<!doctype html>
<html lang="en">
  <head>

    <style>
      body {
        font-family: var(--font-sans, system-ui, sans-serif);
        background: var(--gray-1, #f8fafc);
        color: var(--gray-9, #0f172a);
      }

      .shell {
        inline-size: min(88rem, 100%);
        margin-inline: auto;
        padding: max(var(--size-3), env(safe-area-inset-top)) var(--size-3)
          max(var(--size-8), env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--size-3);
      }

      .masthead h1 {
        margin: 0;
        font-size: clamp(1.6rem, 5vw, 2.4rem);
        letter-spacing: -0.04em;
        line-height: 1.1;
      }

      .kicker {
        display: block;
        margin-block-end: var(--size-1);
        color: var(--gray-6, #64748b);
        font-size: var(--font-size-0);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .masthead p {
        margin: var(--size-2) 0 0;
        color: var(--gray-7, #475569);
        max-inline-size: 42rem;
        line-height: 1.45;
      }

      jelly-tabs::part(tabs) { max-inline-size: 100%; }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--size-2);
        align-items: center;
      }

      .map-panel {
        display: grid;
        gap: var(--size-2);
      }

      .map-stage {
        position: relative;
        block-size: min(70vh, 40rem);
        min-block-size: 18rem;
        border: 1px solid var(--gray-4, #cbd5e1);
        border-radius: var(--radius-2);
        background:
          radial-gradient(circle at 12% 0%, rgba(37, 99, 235, 0.08), transparent 18rem),
          radial-gradient(circle at 90% 10%, rgba(219, 39, 119, 0.07), transparent 16rem),
          #fff;
        overflow: clip;
      }

      .map-empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: var(--size-2);
        padding: var(--size-4);
        text-align: center;
        color: var(--gray-7, #475569);
      }

      .map-empty h2 { margin: 0; color: var(--gray-9, #0f172a); }

      .map-meta {
        display: flex;
        flex-wrap: wrap;
        gap: var(--size-2);
        color: var(--gray-7, #475569);
        font-size: var(--font-size-0);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.15rem 0.55rem;
        border-radius: var(--radius-2);
        background: var(--gray-2, #e2e8f0);
      }

      .swatch {
        inline-size: 0.65rem;
        block-size: 0.65rem;
        border-radius: 999px;
      }

      .detail-card {
        display: grid;
        gap: var(--size-2);
        padding: var(--size-3);
        border: 1px solid var(--gray-4, #cbd5e1);
        border-radius: var(--radius-2);
        background: #fff;
      }

      .detail-card h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .detail-card p {
        margin: 0;
        line-height: 1.45;
        color: var(--gray-8, #1e293b);
      }

      .muted { color: var(--gray-6, #64748b); font-size: var(--font-size-0); }

      .prompt-panel {
        display: grid;
        gap: var(--size-3);
      }

      .prompt-toolbar {
        position: sticky;
        inset-block-start: 0;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: var(--size-2);
        align-items: center;
        padding-block: var(--size-2);
        background: color-mix(in oklab, var(--gray-1, #f8fafc) 88%, transparent);
        backdrop-filter: blur(6px);
      }

      .prompt-pre {
        margin: 0;
        padding: var(--size-3);
        border: 1px solid var(--gray-4, #cbd5e1);
        border-radius: var(--radius-2);
        background: #0b1220;
        color: #e2e8f0;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
        font-size: 0.85rem;
        line-height: 1.45;
        max-block-size: min(70vh, 42rem);
      }

      .copy-result {
        min-block-size: 1.25rem;
        color: var(--gray-7, #475569);
        font-size: var(--font-size-0);
      }

      .load-area {
        display: grid;
        gap: var(--size-2);
      }

      .load-area textarea {
        inline-size: 100%;
        min-block-size: 12rem;
        padding: var(--size-3);
        border: 1px solid var(--gray-4, #cbd5e1);
        border-radius: var(--radius-2);
        background: #fff;
        resize: vertical;
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 0.85rem;
      }

      .issue {
        color: #b91c1c;
        font-size: var(--font-size-0);
      }

      .fallback-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: var(--size-2);
      }

      @media (min-width: 64rem) {
        .map-layout {
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(14rem, 18rem);
          gap: var(--size-3);
          align-items: start;
        }
      }
    </style>
  </head>

  "prompt": "Analyze THIS repository and produce a \"codebase scan\" -\na map of how the codebase works and how it uses AI. You produce only the data\n(a small JSON object); a fixed renderer draws the scan. Write no HTML or CSS.\n\n## Steps\n1. Investigate the repo and build the JSON below.\n2. Write the JSON to `.foglamp/scan.json`, or paste it into the FogLAMP scan viewer prototype (Map tab → Load JSON).\n\n## How to investigate\n- Find where AI runs: generateText / streamText / generateObject / streamObject,\n  @ai-sdk/* providers, agent loops, tool definitions (tool({...})).\n- Identify the models and their provider (OpenAI, Anthropic, Google, …).\n- Identify tools models can call (Exa, Firecrawl, Parallel, DB queries, internal\n  functions) and external integrations/services.\n- Map the business logic too: the internal services/pipelines the product is\n  built from (billing, ingestion, background workers, domain services) - these\n  become \"service\" nodes, and the interesting sentence goes on the edge\n  (e.g. \"charges Stripe on trial end\").\n- Map the main flows: entry points (routes, webhooks, pages, CLIs), scheduled jobs\n  (crons/queues/workers), the agents, the models/tools they use, and the\n  datastores/services they read and write.\n\n## Output contract - write EXACTLY this shape\n{\n  \"version\": 1,\n  \"project\": {\n    \"name\": \"string (<=48)\",\n    \"slug\": \"lowercase-dashed (<=48)\",\n    \"tagline\": \"one line (<=80, optional)\",\n    \"iconDomain\": \"favicon domain for the project, e.g. acme.com (optional)\",\n    \"date\": \"YYYY-MM-DD\"\n  },\n  \"stats\": { \"agents\": 0, \"models\": 0, \"tools\": 0, \"integrations\": 0 },\n  \"topModels\":       [ { \"id\": \"gpt-4o\", \"label\": \"GPT-4o\", \"domain\": \"openai.com\" } ],\n  \"topTools\":        [ { \"id\": \"exa\", \"label\": \"Exa\", \"domain\": \"exa.ai\" } ],\n  \"topIntegrations\": [ { \"id\": \"stripe\", \"label\": \"Stripe\", \"domain\": \"stripe.com\" } ],\n  \"graph\": {\n    \"nodes\": [\n      { \"id\": \"chat\", \"label\": \"Dashboard chat\", \"kind\": \"entry\", \"sub\": \"/api/chat\" },\n      { \"id\": \"agent\", \"label\": \"Support agent\", \"kind\": \"agent\", \"sub\": \"streamText\",\n        \"sourceRef\": \"src/agents/support.ts:42\",\n        \"detail\": \"Answers tickets with order lookups (<=200, optional)\" },\n      { \"id\": \"gpt4o\", \"label\": \"GPT-4o\", \"kind\": \"model\", \"domain\": \"openai.com\" },\n      { \"id\": \"billing\", \"label\": \"Billing service\", \"kind\": \"service\",\n        \"sourceRef\": \"src/services/billing.ts\" },\n      { \"id\": \"pg\", \"label\": \"Postgres\", \"kind\": \"store\", \"domain\": \"postgresql.org\" }\n    ],\n    \"edges\": [\n      { \"from\": \"chat\", \"to\": \"agent\", \"kind\": \"triggers\" },\n      { \"from\": \"agent\", \"to\": \"gpt4o\", \"kind\": \"calls\" },\n      { \"from\": \"billing\", \"to\": \"pg\", \"kind\": \"writes\", \"label\": \"charges on trial end\" }\n    ]\n  }\n}\n\n## Rules (these keep every scan consistent - do not break them)\n- Caps: topModels <= 3, topTools <= 10, topIntegrations <= 10, graph.nodes <= 60,\n  graph.edges <= 120. One map holds everything - AI flows AND business logic.\n  Big maps are welcome (the viewer pans); aim for 20-40 nodes on a substantial\n  codebase. Rich, not sparse - but every node must earn its place.\n- Give every distinct agent its OWN node when there are <= 10 agents; only\n  merge agents into one node when they are numerous and near-identical (then\n  say so in sub, e.g. \"12 near-identical scrapers\"). Chain agents with\n  agent->agent edges when one feeds the next.\n- group (optional, <=24): tag related nodes with a shared group name - those\n  nodes render as one labeled vertical stack. Group by feature/domain the way a\n  team would say it (\"Billing\", \"Ingestion\", \"Setup pipeline\"), not by file\n  layout. Use 2-3 groups of 3-6 nodes; leave hub-and-spoke nodes ungrouped.\n- Node labels <= 28 chars, sub <= 40, edge labels <= 24.\n- kind is one of: entry (trigger/route/page/CLI), cron (scheduled job), agent,\n  model, tool, service (internal business-logic module/pipeline the project\n  owns), store (DB/cache/index), external (3rd-party API).\n- Edge kind (optional): \"calls\" | \"reads\" | \"writes\" | \"triggers\" - what the\n  connection does. Prefer setting it; it's shown quietly (revealed when a flow\n  is traced). Add a label only when a specific phrase says more (e.g. \"charges\n  on trial end\" - put the business logic on edges); labels are always visible.\n- domain is a favicon domain with no scheme (openai.com, anthropic.com, exa.ai,\n  clickhouse.com). Add it to anything a recognizable company/product owns; omit it\n  for purely internal nodes (entries, crons, services, internal tools). Use the\n  product domain for models (gemini.google.com for Gemini, claude.ai for Claude).\n- detail (optional, <=200) is shown when a node is clicked - one sentence of\n  what it does. sourceRef (optional, <=120) is the repo path (plus :line) where\n  the node lives, e.g. \"src/agents/support.ts:42\" - add it to internal nodes so\n  teammates can jump to code.\n- Every edge's from/to must reference an existing node id; ids unique.\n- Use today's date for project.date.\n",

    <script type="module">
      const MANIFEST = JSON.parse(document.getElementById("manifest").textContent);
      const COPY = MANIFEST.copy;
      const shell = document.getElementById("shell");
      const refs = {};
      let jellyOk = false;
      let view = MANIFEST.defaultTab;
      let scan = null;
      let cy = null;

      const make = (tag, attrs = {}, kids = []) => {
        const el = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs || {})) {
          if (k === "text") el.textContent = v;
          else if (k === "html") el.innerHTML = v;
          else if (k === "style" && v && typeof v === "object") Object.assign(el.style, v);
          else if (k === "onClick") el.addEventListener("click", v);
          else if (v === true) el.setAttribute(k, "");
          else if (v !== false && v != null) el.setAttribute(k, v);
        }
        for (const kid of kids) if (kid) el.append(kid);
        return el;
      };

      const button = (label, opts = {}) => {
        if (jellyOk) {
          const b = make("jelly-button", {
            size: "small",
            ...(opts.variant ? { variant: opts.variant } : {}),
            ...(opts.ariaLabel ? { "aria-label": opts.ariaLabel } : {})
          }, [document.createTextNode(label)]);
          if (opts.onClick) b.addEventListener("click", opts.onClick);
          return b;
        }
        return make("button", {
          type: "button",
          text: label,
          ...(opts.ariaLabel ? { "aria-label": opts.ariaLabel } : {}),
          onClick: opts.onClick
        });
      };

      async function detectJelly() {
        try {
          await Promise.race([
            customElements.whenDefined("jelly-button"),
            new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 1200))
          ]);
          jellyOk = true;
        } catch {
          jellyOk = false;
        }
      }

      function loadStored() {
        try {
          const raw = localStorage.getItem(MANIFEST.storageKey);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch {
          return null;
        }
      }

      function persist(next) {
        try {
          localStorage.setItem(MANIFEST.storageKey, JSON.stringify(next));
        } catch {
          /* ignore quota */
        }
      }

      function validateScan(data) {
        if (!data || typeof data !== "object") return COPY.invalidScan;
        if (!data.graph || !Array.isArray(data.graph.nodes) || !Array.isArray(data.graph.edges)) {
          return COPY.invalidScan;
        }
        return null;
      }

      function setScan(next, { store = true } = {}) {
        const err = validateScan(next);
        if (err) {
          if (refs.loadIssue) refs.loadIssue.textContent = err;
          return false;
        }
        scan = next;
        if (store) persist(next);
        if (refs.loadIssue) refs.loadIssue.textContent = "";
        renderMeta();
        renderGraph();
        renderDetail(null);
        return true;
      }

      function kindColor(kind) {
        return (MANIFEST.kinds[kind] && MANIFEST.kinds[kind].color) || "#64748b";
      }

      function toElements(data) {
        const nodes = data.graph.nodes.map((n) => ({
          data: {
            id: n.id,
            label: n.label,
            sub: n.sub || "",
            kind: n.kind,
            detail: n.detail || "",
            sourceRef: n.sourceRef || "",
            domain: n.domain || "",
            group: n.group || "",
            color: kindColor(n.kind)
          }
        }));
        const edges = data.graph.edges.map((e, i) => ({
          data: {
            id: `e${i}-${e.from}-${e.to}`,
            source: e.from,
            target: e.to,
            label: e.label || "",
            kind: e.kind || "",
            lineColor: MANIFEST.edgeKinds[e.kind] || "#94a3b8"
          }
        }));
        return [...nodes, ...edges];
      }

      function renderGraph() {
        if (!refs.stage) return;
        refs.stage.replaceChildren();
        if (!scan) {
          refs.stage.append(make("div", { class: "map-empty" }, [
            make("h2", { text: COPY.emptyTitle }),
            make("p", { text: COPY.emptyBody })
          ]));
          return;
        }
        const cyFactory = window.cytoscape;
        if (typeof cyFactory !== "function") {
          refs.stage.append(make("div", { class: "map-empty" }, [
            make("h2", { text: "Cytoscape failed to load" }),
            make("p", { text: "Check the CDN and reload." })
          ]));
          return;
        }
        cy = cyFactory({
          container: refs.stage,
          elements: toElements(scan),
          style: [
            {
              selector: "node",
              style: {
                "background-color": "data(color)",
                "label": "data(label)",
                "color": "#0f172a",
                "text-valign": "center",
                "text-halign": "center",
                "font-size": 10,
                "font-weight": 600,
                "text-wrap": "wrap",
                "text-max-width": 88,
                "width": 96,
                "height": 42,
                "shape": "round-rectangle",
                "border-width": 1,
                "border-color": "#ffffff",
                "overlay-padding": 4
              }
            },
            {
              selector: "node:selected",
              style: {
                "border-width": 3,
                "border-color": "#0f172a"
              }
            },
            {
              selector: "edge",
              style: {
                "width": 1.5,
                "line-color": "data(lineColor)",
                "target-arrow-color": "data(lineColor)",
                "target-arrow-shape": "triangle",
                "curve-style": "bezier",
                "label": "data(label)",
                "font-size": 8,
                "color": "#475569",
                "text-rotation": "autorotate",
                "text-margin-y": -8,
                "arrow-scale": 0.8
              }
            }
          ],
          layout: {
            name: "cose",
            animate: false,
            padding: 24,
            nodeRepulsion: 8000,
            idealEdgeLength: 110,
            nestingFactor: 1.2
          },
          wheelSensitivity: 0.2,
          minZoom: 0.2,
          maxZoom: 2.8
        });
        cy.on("tap", "node", (evt) => renderDetail(evt.target.data()));
        cy.on("tap", (evt) => {
          if (evt.target === cy) renderDetail(null);
        });
        window.setTimeout(() => cy.fit(undefined, 32), MANIFEST.timing.fitDelayMs);
      }

      function renderMeta() {
        if (!refs.mapMeta) return;
        refs.mapMeta.replaceChildren();
        if (!scan) return;
        const p = scan.project || {};
        const s = scan.stats || {};
        refs.mapMeta.append(
          make("span", { class: "chip", text: p.name || p.slug || "scan" }),
          make("span", { class: "chip", text: p.date || "" }),
          make("span", { class: "chip", text: `${(scan.graph.nodes || []).length} nodes` }),
          make("span", { class: "chip", text: `${(scan.graph.edges || []).length} edges` }),
          make("span", { class: "chip", text: `${s.agents || 0} agents · ${s.models || 0} models` })
        );
        const legend = make("div", { class: "row" });
        for (const [kind, meta] of Object.entries(MANIFEST.kinds)) {
          legend.append(make("span", { class: "chip" }, [
            make("span", { class: "swatch", style: { background: meta.color } }),
            document.createTextNode(meta.label)
          ]));
        }
        refs.mapMeta.append(legend);
      }

      function renderDetail(data) {
        if (!refs.detail) return;
        refs.detail.replaceChildren();
        if (!data) {
          refs.detail.append(make("p", { class: "muted", text: COPY.detailEmpty }));
          return;
        }
        refs.detail.append(
          make("h2", { text: data.label }),
          make("p", { class: "muted", text: [data.kind, data.sub, data.domain].filter(Boolean).join(" · ") }),
          data.detail ? make("p", { text: data.detail }) : null,
          data.sourceRef ? make("p", { class: "muted", text: data.sourceRef }) : null,
          data.group ? make("p", { class: "muted", text: `group: ${data.group}` }) : null
        );
      }

      function copyText(text, resultNode, blockNode) {
        const reset = () => window.setTimeout(() => { resultNode.textContent = ""; }, MANIFEST.timing.copyResetMs);
        const manual = () => {
          resultNode.textContent = COPY.copyFailure + " " + COPY.copyManualHint;
          if (blockNode) {
            const range = document.createRange();
            range.selectNodeContents(blockNode);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
          }
          reset();
        };
        if (!navigator.clipboard || !navigator.clipboard.writeText) {
          manual();
          return;
        }
        navigator.clipboard.writeText(text).then(() => {
          resultNode.textContent = COPY.copySuccess;
          reset();
        }, manual);
      }

      function setView(next) {
        view = next || MANIFEST.defaultTab;
        if (jellyOk && refs.tabs) {
          refs.tabs.value = view;
          for (const panel of refs.tabs.querySelectorAll("jelly-tab-panel")) {
            if (panel.getAttribute("value") === view) panel.setAttribute("active", "");
            else panel.removeAttribute("active");
          }
        } else if (refs.panels) {
          for (const [id, panel] of Object.entries(refs.panels)) {
            panel.hidden = id !== view;
          }
        }
        if (view === "map" && cy) window.setTimeout(() => cy.resize(), 30);
      }

      function openLoadSheet() {
        if (!refs.loadDrawer) return;
        if (refs.loadText) refs.loadText.value = scan ? JSON.stringify(scan, null, 2) : "";
        if (jellyOk) {
          refs.loadDrawer.open = true;
          refs.loadDrawer.setAttribute("open", "");
        } else {
          refs.loadDrawer.hidden = false;
        }
      }

      function closeLoadSheet() {
        if (!refs.loadDrawer) return;
        if (jellyOk) {
          refs.loadDrawer.open = false;
          refs.loadDrawer.removeAttribute("open");
        } else {
          refs.loadDrawer.hidden = true;
        }
      }

      function applyLoad() {
        try {
          const data = JSON.parse(refs.loadText.value);
          if (setScan(data)) closeLoadSheet();
        } catch {
          refs.loadIssue.textContent = COPY.invalidJson;
        }
      }

      function buildMapPanel(host) {
        refs.stage = make("div", { class: "map-stage", id: "stage" });
        refs.mapMeta = make("div", { class: "map-meta" });
        refs.detail = make("div", { class: "detail-card" });
        const bar = make("div", { class: "row" }, [
          button(COPY.loadButton, { variant: "mint", onClick: openLoadSheet }),
          button(COPY.resetButton, { onClick: () => setScan(MANIFEST.sampleScan) }),
          button(COPY.fitButton, { onClick: () => cy && cy.fit(undefined, 32) })
        ]);
        const layout = make("div", { class: "map-layout" }, [
          make("div", { class: "map-panel" }, [refs.stage, bar, refs.mapMeta]),
          refs.detail
        ]);
        host.append(layout);
        renderDetail(null);
      }

      function buildPromptPanel(host) {
        refs.copyResult = make("div", { class: "copy-result", "aria-live": "polite" });
        refs.promptPre = make("pre", { class: "prompt-pre", text: MANIFEST.prompt });
        const toolbar = make("div", { class: "prompt-toolbar" }, [
          button(COPY.copyPrompt, {
            variant: "mint",
            onClick: () => copyText(MANIFEST.prompt, refs.copyResult, refs.promptPre)
          }),
          refs.copyResult
        ]);
        host.append(make("div", { class: "prompt-panel" }, [
          make("p", { class: "muted", text: COPY.promptHint }),
          toolbar,
          refs.promptPre
        ]));
      }

      function buildOverlays() {
        const body = make("div", { class: "load-area" }, [
          make("p", { class: "muted", text: "Paste a FogLAMP scan.json object." }),
          refs.loadText = make("textarea", {
            spellcheck: "false",
            "aria-label": "scan JSON"
          }),
          refs.loadIssue = make("div", { class: "issue", role: "alert" }),
          make("div", { class: "row" }, [
            button(COPY.loadApply, { variant: "mint", onClick: applyLoad }),
            button(COPY.loadClose, { onClick: closeLoadSheet })
          ])
        ]);
        if (jellyOk) {
          refs.loadDrawer = make("jelly-drawer", {
            id: "load-drawer",
            label: COPY.loadTitle,
            side: "bottom"
          }, [body]);
        } else {
          refs.loadDrawer = make("section", {
            class: "detail-card",
            hidden: true
          }, [
            make("h2", { text: COPY.loadTitle }),
            body
          ]);
        }
        shell.append(refs.loadDrawer);
      }

      function buildChrome() {
        shell.replaceChildren();
        shell.append(make("header", { class: "masthead" }, [
          make("span", { class: "kicker", text: MANIFEST.kicker }),
          make("h1", { text: MANIFEST.title }),
          make("p", { text: MANIFEST.tagline })
        ]));

        refs.panels = {};
        const tabs = make(jellyOk ? "jelly-tabs" : "div", { id: "tabs", size: MANIFEST.tabSize });
        for (const tab of MANIFEST.tabs) {
          const content = make("div", { style: { marginBlockStart: "var(--size-3)" } });
          refs.panels[tab.id] = content;
          tabs.append(make(jellyOk ? "jelly-tab-panel" : "section", {
            label: tab.label,
            value: tab.id,
            active: tab.id === view
          }, [content]));
        }
        tabs.addEventListener("change", (e) => setView((e.target && e.target.value) || MANIFEST.defaultTab));
        refs.tabs = tabs;

        if (!jellyOk) {
          shell.append(make("div", { class: "fallback-tabs row" }, MANIFEST.tabs.map((tab) =>
            button(tab.label, { onClick: () => setView(tab.id) })
          )));
        }
        shell.append(tabs);
        buildMapPanel(refs.panels.map);
        buildPromptPanel(refs.panels.prompt);
        buildOverlays();
        setView(view);
      }

      async function boot() {
        await detectJelly();
        buildChrome();
        const stored = loadStored();
        if (stored && !validateScan(stored)) setScan(stored, { store: false });
        else setScan(MANIFEST.sampleScan, { store: false });
      }

      boot();
    </script>
