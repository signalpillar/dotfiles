  context: A private GCSE triple-science revision tracker published as a static GitHub Pages prototype
    in this dotfiles repository.
context: 'Add declarative support resources for all 121 curriculum topics without changing the prerequisite
  DAG''s meaning.

  Each topic needs a short Markdown summary, a copy-paste interactive tutor prompt, checked supporting
  links, and one Wikipedia link.

  Past papers use a separate typed support graph so one paper can support many topics without affecting
  readiness or track layout.

  Keep the existing HTML URL and add external assets under prototypes/gcse-science-f1-roadmap/.

  Preserve the existing manifest-driven application rules, CDN-blocked fallback, progress persistence,
  import/export, and mobile behavior.

  The expanded multi-file prototype requires HTTP; direct file opening is no longer supported and must
  fail with clear manifest-driven guidance.

  Initial paper delivery is schema-only; paper inspection and question-level mapping will be added incrementally
  through the replication skill.'
