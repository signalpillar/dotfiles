<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Scorecard Tally</title>
    <link rel="stylesheet" href="prototype-base.css">
    <style>
      :root {
        color-scheme: light;
        font-family: "Avenir Next", Avenir, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        --ink: #1b2430;
        --muted: #667085;
        --paper: #f5f6fa;
        --surface: #ffffff;
        --line: #e2e5ee;
        --accent: #2f7a5c;
        --accent-strong: #1f5c43;
        --warn-fg: #b3261e;
        --shadow: 0 0.5rem 2rem rgba(27, 36, 48, 0.08);
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.5rem;
        --space-6: 2rem;
        --space-8: 3rem;
        --text-00: 0.75rem;
        --text-0: 0.875rem;
        --text-1: 1rem;
        --text-2: 1.125rem;
        --text-5: 1.75rem;
        --text-6: 2.25rem;
        --radius-2: 0.5rem;
        --radius-3: 0.75rem;
        --radius-4: 1rem;
        --radius-round: 999px;
      }

      body {
        background: var(--paper);
        color: var(--ink);
      }

      button,
      input {
        font: inherit;
      }

      main {
        width: min(30rem, 100%);
        margin: 0 auto;
        padding: max(var(--space-4), env(safe-area-inset-top)) var(--space-4) calc(var(--space-8) + env(safe-area-inset-bottom));
        display: grid;
        gap: var(--space-4);
      }

      header {
        display: grid;
        gap: var(--space-2);
      }

      .back-link {
        color: var(--muted);
        text-decoration: none;
        font-size: var(--text-0);
      }

      .back-link:hover,
      .back-link:focus-visible {
        color: var(--accent-strong);
      }

      h1 {
        margin: 0;
        font-size: clamp(var(--text-5), 9vw, var(--text-6));
        letter-spacing: -0.03em;
      }

      .tagline {
        margin: 0;
        color: var(--muted);
        font-size: var(--text-1);
        line-height: 1.5;
      }

      .surface {
        border: 1px solid var(--line);
        border-radius: var(--radius-4);
        background: var(--surface);
        box-shadow: var(--shadow);
        padding: var(--space-4);
      }

      .btn-plain {
        min-height: 2.75rem;
        padding: 0 var(--space-4);
        border: 1px solid var(--line);
        border-radius: var(--radius-2);
        background: var(--surface);
        color: var(--ink);
        font-weight: 600;
        cursor: pointer;
      }

      .btn-plain.block {
        width: 100%;
      }

      .btn-accent {
        border-color: var(--accent-strong);
        background: var(--accent);
        color: white;
      }

      .btn-plain:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .btn-plain:focus-visible,
      input:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      input[type="text"],
      input[type="number"] {
        width: 100%;
        min-height: 2.75rem;
        padding: 0 var(--space-3);
        border: 1px solid var(--line);
        border-radius: var(--radius-2);
        background: var(--paper);
        color: var(--ink);
      }

      .leader-bar {
        position: sticky;
        top: var(--space-2);
        z-index: 3;
        display: none;
        flex-direction: column;
        gap: var(--space-1);
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-4);
        border: 1px solid var(--accent-strong);
        background: var(--accent);
        color: white;
        box-shadow: var(--shadow);
      }

      .leader-bar.visible {
        display: flex;
      }

      .leader-label {
        margin: 0;
        font-size: var(--text-0);
        opacity: 0.85;
      }

      .leader-value {
        font-size: var(--text-5);
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .rows-list {
        display: grid;
        gap: var(--space-3);
      }

      .empty-state {
        margin: 0;
        padding: var(--space-5) var(--space-4);
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: var(--radius-4);
      }

      .row-card {
        display: grid;
        gap: var(--space-3);
      }

      .row-head {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: var(--space-2);
        align-items: center;
      }

      .row-label-input {
        font-weight: 700;
        font-size: var(--text-2);
      }

      .row-remove {
        min-height: 2.25rem;
        min-width: 2.25rem;
        padding: 0;
        border-radius: var(--radius-round);
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--warn-fg);
        font-size: var(--text-2);
        line-height: 1;
        cursor: pointer;
      }

      .values-grid {
        display: grid;
        grid-template-columns: repeat(var(--grid-columns, 4), minmax(0, 1fr));
        gap: var(--space-2);
      }

      .values-grid input {
        text-align: center;
        padding: 0 var(--space-1);
      }

      .values-grid .sub-row-gap {
        grid-column: 1 / -1;
        height: 1px;
        background: var(--line);
        margin: var(--space-1) 0;
      }

      .row-sum {
        font-size: var(--text-2);
        font-weight: 800;
        white-space: nowrap;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: max(var(--space-4), env(safe-area-inset-bottom));
        transform: translateX(-50%) translateY(150%);
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-3);
        background: var(--ink);
        color: white;
        box-shadow: var(--shadow);
        transition: transform 180ms ease;
        z-index: 4;
        max-width: calc(100% - 2rem);
      }

      .toast.visible {
        transform: translateX(-50%) translateY(0);
      }

      .toast button {
        border: 0;
        background: transparent;
        color: #9be3bf;
        font-weight: 700;
        cursor: pointer;
      }

      .toast button[hidden] {
        display: none;
      }

      .section-heading {
        margin: 0;
        font-size: var(--text-1);
        font-weight: 700;
      }

      .history-section {
        display: grid;
        gap: var(--space-3);
      }

      .history-list {
        display: grid;
        gap: var(--space-2);
      }

      .history-card {
        display: grid;
        gap: var(--space-1);
        padding: var(--space-3) var(--space-4);
      }

      .history-head {
        display: flex;
        justify-content: space-between;
        gap: var(--space-2);
        font-size: var(--text-00);
        color: var(--muted);
      }

      .history-winner {
        font-weight: 700;
        color: var(--accent-strong);
      }

      .history-scores {
        color: var(--muted);
        font-size: var(--text-0);
      }

      @media (min-width: 46rem) {
        main {
          padding-top: var(--space-8);
        }
      }
    </style>
  </head>
  <body>
    <script type="application/json" id="manifest">
      {
        "copy": {
          "title": "Scorecard Tally",
          "tagline": "Type in each player's grid of numbers. This adds up each player's sum live, fully offline.",
          "addPlayerButton": "+ Add player",
          "leaderLabel": "Leading",
          "leaderTemplate": "{winner} — {score}",
          "leaderTieTemplate": "Tied at {score}: {winner}",
          "leaderEmptyText": "No scores yet",
          "emptyState": "No players yet. Add one to get started.",
          "sumLabel": "Sum",
          "labelPlaceholder": "Label",
          "removeRowLabel": "Remove row",
          "undoTemplate": "Removed “{label}”",
          "undoButton": "Undo",
          "cleanButton": "Clean round",
          "cleanedToastOne": "Saved round {round} — {winner} won with {score}. Scores cleared.",
          "cleanedToastTie": "Saved round {round} — tied at {score} between {winner}. Scores cleared.",
          "historyHeading": "Round history",
          "historyWinnerTemplate": "🏆 {winner} — {score}",
          "unnamedPlayerTemplate": "Player {number}"
        },
        "grid": { "columns": 4, "rows": 2 },
        "timing": { "saveDebounceMs": 200, "undoTimeoutMs": 6000 },
        "storage": { "sessionKey": "scorecard-tally:session", "historyKey": "scorecard-tally:history" }
      }
    </script>

    <main>
      <header>
        <a class="back-link" href="index.html">&larr; Back</a>
        <h1 id="pageTitle"></h1>
        <p class="tagline" id="pageTagline"></p>
      </header>

      <div class="leader-bar" id="leaderBar">
        <p class="leader-label" id="leaderLabelText"></p>
        <div class="leader-value" id="leaderValue"></div>
      </div>

      <button type="button" class="btn-plain block btn-accent" id="cleanButton"></button>

      <div class="rows-list" id="rowsList"></div>
      <p class="empty-state" id="emptyState"></p>

      <button type="button" class="btn-plain block" id="addRowButton"></button>

      <section class="history-section" id="historySection" hidden>
        <h2 class="section-heading" id="historyHeading"></h2>
        <div class="history-list" id="historyList"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <span id="toastText"></span>
      <button type="button" id="toastUndoButton"></button>
    </div>

    <script type="module">
      const M = JSON.parse(document.getElementById("manifest").textContent);
      const COPY = M.copy;
      const VALUES_COUNT = M.grid.columns * M.grid.rows;

      document.documentElement.style.setProperty("--grid-columns", M.grid.columns);

      function make(tag, props = {}, children = []) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props)) {
          if (value === undefined || value === null || value === false) continue;
          if (key === "class") node.className = value;
          else if (key === "text") node.textContent = value;
          else if (key === "on") for (const [evt, handler] of Object.entries(value)) node.addEventListener(evt, handler);
          else node.setAttribute(key, value === true ? "" : String(value));
        }
        children.filter(Boolean).forEach((child) => node.append(child));
        return node;
      }

      /* ---------------- static copy from the manifest ---------------- */

      document.title = COPY.title;
      document.getElementById("pageTitle").textContent = COPY.title;
      document.getElementById("pageTagline").textContent = COPY.tagline;
      document.getElementById("leaderLabelText").textContent = COPY.leaderLabel;
      document.getElementById("emptyState").textContent = COPY.emptyState;
      document.getElementById("addRowButton").textContent = COPY.addPlayerButton;
      document.getElementById("toastUndoButton").textContent = COPY.undoButton;
      document.getElementById("cleanButton").textContent = COPY.cleanButton;
      document.getElementById("historyHeading").textContent = COPY.historyHeading;

      /* ---------------- state ---------------- */

      let rowSeq = 0;
      const rows = new Map(); // id -> { label, values: (number|null)[] }
      const rowRefs = new Map(); // id -> DOM refs for in-place updates
      let pendingUndo = null;

      function displayLabel(row, index) {
        return (row.label || "").trim() || template(COPY.unnamedPlayerTemplate, { number: index + 1 });
      }

      function blankRow() {
        return { label: "", values: new Array(VALUES_COUNT).fill(null) };
      }

      function toNumberOrNull(value) {
        if (value === "" || value === null || value === undefined) return null;
        const n = Number(value);
        return Number.isFinite(n) ? n : null;
      }

      function sumOf(values) {
        return values.reduce((total, v) => total + (Number.isFinite(v) ? v : 0), 0);
      }

      function template(str, vars) {
        return str.replace(/\{(\w+)\}/g, (_, key) => vars[key]);
      }

      /* `type="text" inputmode="numeric" pattern="[0-9]*"` is the standard trick to get
         a plain digit-only numpad on iOS and Android, instead of the punctuation-laden
         keyboard `type="number"` triggers on iOS. Strip anything non-digit as a backstop
         for keyboards/pastes that ignore the hint. */
      function makeDigitInput(ariaLabel, value) {
        const input = make("input", {
          type: "text",
          inputmode: "numeric",
          pattern: "[0-9]*",
          "aria-label": ariaLabel,
          value: value === null ? "" : value
        });
        input.addEventListener("input", () => {
          const digitsOnly = input.value.replace(/[^0-9]/g, "");
          if (digitsOnly !== input.value) input.value = digitsOnly;
        });
        return input;
      }

      /* ---------------- persistence (all local, no network involved) ---------------- */

      let saveTimer = null;
      function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveSession, M.timing.saveDebounceMs);
      }

      function saveSession() {
        const order = [...rowRefs.keys()];
        const payload = order.map((id) => rows.get(id));
        try {
          localStorage.setItem(M.storage.sessionKey, JSON.stringify(payload));
        } catch (err) {
          console.warn("Could not save session", err);
        }
      }

      function sanitiseStoredRow(item) {
        const row = blankRow();
        if (item && typeof item === "object") {
          row.label = typeof item.label === "string" ? item.label.slice(0, 40) : "";
          const values = Array.isArray(item.values) ? item.values : [];
          for (let i = 0; i < VALUES_COUNT; i++) {
            row.values[i] = toNumberOrNull(values[i]);
          }
        }
        return row;
      }

      function loadSession() {
        try {
          const raw = localStorage.getItem(M.storage.sessionKey);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed.map(sanitiseStoredRow);
        } catch (err) {
          console.warn("Could not load saved session", err);
          return [];
        }
      }

      /* ---------------- row rendering ---------------- */

      const rowsList = document.getElementById("rowsList");
      const emptyState = document.getElementById("emptyState");

      function updateEmptyState() {
        emptyState.style.display = rowRefs.size === 0 ? "block" : "none";
      }

      function addRow(rowData, { focusLabel = false } = {}) {
        const id = `row-${++rowSeq}`;
        rows.set(id, rowData);

        const labelInput = make("input", {
          type: "text",
          class: "row-label-input",
          placeholder: COPY.labelPlaceholder,
          value: rowData.label || ""
        });
        labelInput.addEventListener("input", () => {
          rows.get(id).label = labelInput.value;
          scheduleSave();
        });

        const removeButton = make("button", {
          type: "button",
          class: "row-remove",
          "aria-label": COPY.removeRowLabel,
          text: "✕"
        });
        removeButton.addEventListener("click", () => removeRow(id));

        const valuesGrid = make("div", { class: "values-grid" });
        const valueInputs = [];
        for (let i = 0; i < VALUES_COUNT; i++) {
          if (i === M.grid.columns) {
            valuesGrid.append(make("div", { class: "sub-row-gap" }));
          }
          const valueInput = makeDigitInput(`Value ${i + 1}`, rowData.values[i]);
          const index = i;
          valueInput.addEventListener("input", () => {
            rows.get(id).values[index] = toNumberOrNull(valueInput.value);
            refreshRowTotals(id);
            scheduleSave();
          });
          valueInputs.push(valueInput);
          valuesGrid.append(valueInput);
        }

        const sumEl = make("div", { class: "row-sum" });

        const card = make("div", { class: "surface" }, [
          make("div", { class: "row-card" }, [
            make("div", { class: "row-head" }, [labelInput, removeButton]),
            valuesGrid,
            sumEl
          ])
        ]);
        card.dataset.rowId = id;

        rowRefs.set(id, { card, sumEl, labelInput, valueInputs });
        rowsList.append(card);
        refreshRowTotals(id);
        updateEmptyState();
        updateLeaderBar();

        if (focusLabel) labelInput.focus();
        return id;
      }

      function refreshRowTotals(id) {
        const row = rows.get(id);
        const refs = rowRefs.get(id);
        if (!row || !refs) return;
        refs.sumEl.textContent = `${COPY.sumLabel}: ${sumOf(row.values)}`;
        updateLeaderBar();
      }

      function removeRow(id) {
        const refs = rowRefs.get(id);
        const row = rows.get(id);
        if (!refs || !row) return;

        refs.card.remove();
        rowRefs.delete(id);
        rows.delete(id);
        updateEmptyState();
        updateLeaderBar();
        scheduleSave();

        pendingUndo = { id, row };
        showToast(template(COPY.undoTemplate, { label: row.label || COPY.labelPlaceholder }), () => {
          if (!pendingUndo) return;
          addRow(pendingUndo.row);
          pendingUndo = null;
          hideToast();
          scheduleSave();
        });
      }

      /* The "leader" is computed live from whatever has been typed in so far — not a
         grand total. It's the same computation "Clean round" uses to pick a winner,
         shown as a running preview while scores are still being entered. */
      function updateLeaderBar() {
        const bar = document.getElementById("leaderBar");
        document.getElementById("cleanButton").disabled = rowRefs.size === 0;
        if (rowRefs.size === 0) {
          bar.classList.remove("visible");
          return;
        }
        bar.classList.add("visible");

        const ids = [...rowRefs.keys()];
        const scores = ids.map((id, index) => ({ label: displayLabel(rows.get(id), index), sum: sumOf(rows.get(id).values) }));
        const maxSum = Math.max(...scores.map((s) => s.sum));
        const valueEl = document.getElementById("leaderValue");

        if (maxSum === 0) {
          valueEl.textContent = COPY.leaderEmptyText;
          return;
        }
        const leaders = scores.filter((s) => s.sum === maxSum).map((s) => s.label);
        valueEl.textContent = leaders.length === 1
          ? template(COPY.leaderTemplate, { winner: leaders[0], score: maxSum })
          : template(COPY.leaderTieTemplate, { winner: leaders.join(", "), score: maxSum });
      }

      /* ---------------- round history (append-only; "Clean round" is the writer) ---------------- */

      const historySection = document.getElementById("historySection");
      const historyList = document.getElementById("historyList");
      let history = []; // chronological order, oldest first: { round, recordedAt, winners, maxSum, scores }

      function sanitiseHistoryEntry(item) {
        if (!item || typeof item !== "object") return null;
        const round = Number(item.round);
        const recordedAt = Number(item.recordedAt);
        const maxSum = Number(item.maxSum);
        const winners = Array.isArray(item.winners) ? item.winners.filter((w) => typeof w === "string") : [];
        const scores = Array.isArray(item.scores)
          ? item.scores
              .filter((s) => s && typeof s.label === "string" && Number.isFinite(Number(s.sum)))
              .map((s) => ({ label: s.label, sum: Number(s.sum) }))
          : [];
        if (!Number.isFinite(round) || !Number.isFinite(recordedAt) || !Number.isFinite(maxSum) || winners.length === 0 || scores.length === 0) {
          return null;
        }
        return { round, recordedAt, winners, maxSum, scores };
      }

      function saveHistory() {
        try {
          localStorage.setItem(M.storage.historyKey, JSON.stringify(history));
        } catch (err) {
          console.warn("Could not save history", err);
        }
      }

      function loadHistory() {
        try {
          const raw = localStorage.getItem(M.storage.historyKey);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed.map(sanitiseHistoryEntry).filter(Boolean);
        } catch (err) {
          console.warn("Could not load round history", err);
          return [];
        }
      }

      function updateHistoryVisibility() {
        historySection.hidden = history.length === 0;
      }

      function buildHistoryCard(entry) {
        const winnerText = entry.winners.join(" & ");
        const time = new Date(entry.recordedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        const scoreLine = entry.scores.map((s) => `${s.label} ${s.sum}`).join(" · ");
        return make("div", { class: "surface history-card" }, [
          make("div", { class: "history-head" }, [
            make("span", { text: `Round ${entry.round}` }),
            make("span", { text: time })
          ]),
          make("div", { class: "history-winner", text: template(COPY.historyWinnerTemplate, { winner: winnerText, score: entry.maxSum }) }),
          make("div", { class: "history-scores", text: scoreLine })
        ]);
      }

      function cleanRound() {
        const ids = [...rowRefs.keys()];
        if (ids.length === 0) return;

        const scores = ids.map((id, index) => ({ label: displayLabel(rows.get(id), index), sum: sumOf(rows.get(id).values) }));
        const maxSum = Math.max(...scores.map((s) => s.sum));
        const winners = scores.filter((s) => s.sum === maxSum).map((s) => s.label);

        const entry = { round: history.length + 1, recordedAt: Date.now(), winners, maxSum, scores };
        history.push(entry);
        saveHistory();
        historyList.prepend(buildHistoryCard(entry));
        updateHistoryVisibility();

        ids.forEach((id) => {
          const row = rows.get(id);
          row.values = new Array(VALUES_COUNT).fill(null);
          const refs = rowRefs.get(id);
          refs.valueInputs.forEach((input) => (input.value = ""));
          refreshRowTotals(id);
        });
        scheduleSave();

        showToast(
          winners.length === 1
            ? template(COPY.cleanedToastOne, { round: entry.round, winner: winners[0], score: maxSum })
            : template(COPY.cleanedToastTie, { round: entry.round, winner: winners.join(", "), score: maxSum })
        );
      }

      document.getElementById("cleanButton").addEventListener("click", cleanRound);

      /* ---------------- toast / undo ---------------- */

      const toast = document.getElementById("toast");
      const toastText = document.getElementById("toastText");
      const toastUndoButton = document.getElementById("toastUndoButton");
      let toastHandler = null;
      let toastTimer = null;

      function showToast(text, onUndo) {
        clearTimeout(toastTimer);
        toastText.textContent = text;
        toastHandler = onUndo || null;
        toastUndoButton.hidden = !onUndo;
        toast.classList.add("visible");
        toastTimer = setTimeout(hideToast, M.timing.undoTimeoutMs);
      }

      function hideToast() {
        clearTimeout(toastTimer);
        toast.classList.remove("visible");
        toastHandler = null;
        pendingUndo = null;
      }

      toastUndoButton.addEventListener("click", () => {
        if (toastHandler) toastHandler();
      });

      /* ---------------- add blank row ---------------- */

      document.getElementById("addRowButton").addEventListener("click", () => {
        addRow(blankRow(), { focusLabel: true });
      });

      /* ---------------- hydrate from the last local session ---------------- */

      const restored = loadSession();
      if (restored.length > 0) {
        restored.forEach((row) => addRow(row));
      } else {
        addRow(blankRow());
      }
      updateEmptyState();
      updateLeaderBar();

      history = loadHistory();
      history.slice().reverse().forEach((entry) => historyList.append(buildHistoryCard(entry)));
      updateHistoryVisibility();
    </script>
  </body>
</html>
