<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>GCSE Triple Science: F1 Roadmap</title>

    <!-- Component library: Jelly UI, dependency-free web components, one tag, no build step. -->
    <script type="module" src="https://jelly-ui.com/package.js"></script>
    <!-- Token set: Open Props. Every spacing, radius, shadow and easing below comes from it. -->
    <link rel="stylesheet" href="https://unpkg.com/open-props">

    <style>
      /* Layout only. Colours, fonts and every tunable number are injected from the
         manifest at boot (see buildThemeStyles); everything else is an Open Props token. */

      * { box-sizing: border-box; }
      /* Jelly paints each component's soft body on a canvas that deliberately
         overhangs its box so the membrane can bulge. Clip that at the page edge:
         `clip` rather than `hidden` so no scroll container is created and the
         drawer and dialog still position themselves against the viewport. */
      html, body { min-block-size: 100%; overflow-x: clip; }
      body { margin: 0; font-family: var(--font-text); background: var(--page-bg); color: var(--page-fg); }
      button, input, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }

      .shell {
        inline-size: min(78rem, 100%);
        margin-inline: auto;
        padding: max(var(--size-3), env(safe-area-inset-top)) var(--size-3) var(--size-8);
        display: grid;
        /* minmax(0,...) stops an intrinsically wide child (the tab bar, the track
           canvas) from widening the whole column and scrolling the page sideways. */
        grid-template-columns: minmax(0, 1fr);
        gap: var(--size-3);
        color: var(--text);
        font-family: var(--font-text);
      }
      .shell > *, .shell jelly-tab-panel { min-inline-size: 0; }
      /* Keep the tab bar inside the column instead of letting five tabs set the
         page width; the component compresses the pill track to fit. */
      jelly-tabs::part(tabs) { max-inline-size: 100%; }

      h1, h2, h3, .display { font-family: var(--font-display); letter-spacing: var(--font-letterspacing-0); }

      .row { display: flex; gap: var(--size-2); flex-wrap: wrap; align-items: center; }
      .row[hidden] { display: none; }
      .row .grow { flex: 1 1 12rem; min-width: 9rem; }
      .push { margin-inline-start: auto; }

      /* masthead */
      .kicker { font-size: var(--font-size-0); font-weight: var(--font-weight-8); letter-spacing: var(--font-letterspacing-4); text-transform: uppercase; color: var(--accent); }
      .masthead h1 { margin: 0; font-size: var(--font-size-4); }

      /* dashboard */
      .dash { display: grid; gap: var(--size-3); }
      .score { font-family: var(--font-display); font-size: var(--font-size-6); font-weight: var(--font-weight-8); line-height: var(--font-lineheight-0); letter-spacing: var(--font-letterspacing-0); }
      .score small { font-size: var(--font-size-0); font-weight: var(--font-weight-6); color: var(--text-muted); letter-spacing: normal; }
      .subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: var(--size-3); }
      .subject-row { display: grid; gap: var(--size-1); }
      .subject-row .lbl { display: flex; justify-content: space-between; gap: var(--size-2); font-size: var(--font-size-0); }
      .subject-row .lbl span { color: var(--text-muted); }

      /* shared surface */
      .surface {
        border: var(--border-size-1) solid var(--line);
        border-radius: var(--radius-3);
        background: var(--surface);
        box-shadow: var(--shadow-2);
      }

      /* track map */
      .viewport { position: relative; overflow: auto; border: var(--border-size-1) solid var(--line); border-radius: var(--radius-4); background: var(--muted-bg); max-height: min(68vh, 40rem); }
      .zoom-wrap { position: relative; }
      .canvas { position: absolute; inset: 0 auto auto 0; transform-origin: 0 0; }
      .canvas svg { position: absolute; inset: 0 auto auto 0; pointer-events: none; }
      .lane-label { position: absolute; font-family: var(--font-display); font-size: var(--font-size-0); font-weight: var(--font-weight-8); letter-spacing: var(--font-letterspacing-3); text-transform: uppercase; color: var(--c); }
      .lane-band { position: absolute; inset-inline-start: 0; border-top: var(--border-size-1) dashed var(--line-strong); opacity: 0.55; }
      .stage-label { position: absolute; font-size: var(--font-size-0); font-weight: var(--font-weight-7); letter-spacing: var(--font-letterspacing-3); text-transform: uppercase; color: var(--text-muted); }
      .stage-label b { display: block; font-family: var(--font-display); color: var(--text); letter-spacing: normal; text-transform: none; }

      .node {
        position: absolute;
        text-align: start;
        border: var(--border-size-1) solid var(--line);
        border-inline-start: var(--border-size-4) solid var(--c);
        border-radius: var(--radius-2);
        background: var(--surface);
        color: var(--text);
        padding: var(--size-1) var(--size-2);
        display: grid;
        gap: var(--size-1);
        align-content: start;
        overflow: hidden;
        box-shadow: var(--shadow-1);
        transition: transform 0.14s var(--ease-3), box-shadow 0.14s var(--ease-3), opacity 0.16s var(--ease-3);
      }
      .node:hover { transform: translateY(-2px) scale(1.015); box-shadow: var(--shadow-3); }
      .node:active { transform: scale(0.98); }
      .node .n-title { font-size: var(--font-size-0); font-weight: var(--font-weight-6); line-height: var(--font-lineheight-1); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .node .n-meta { display: flex; align-items: center; gap: var(--size-1); font-size: var(--font-size-00); color: var(--text-muted); letter-spacing: var(--font-letterspacing-2); text-transform: uppercase; }
      .dot { inline-size: var(--size-2); block-size: var(--size-2); border-radius: var(--radius-round); background: var(--s); flex: none; }
      .node.locked { border-style: dashed; opacity: 0.62; }
      .node.dim { opacity: 0.15; }
      .node.selected { box-shadow: 0 0 0 3px var(--accent), var(--shadow-3); }
      .node .tint { position: absolute; inset: 0; background: var(--s); opacity: 0.1; pointer-events: none; }

      /* roadmap */
      .stage-block { display: grid; gap: var(--size-3); margin-block-end: var(--size-6); }
      .stage-head { display: flex; align-items: baseline; gap: var(--size-2); flex-wrap: wrap; }
      .stage-head h2 { margin: 0; font-size: var(--font-size-2); }
      .stage-head .num { font-size: var(--font-size-0); font-weight: var(--font-weight-8); letter-spacing: var(--font-letterspacing-4); color: var(--accent); text-transform: uppercase; }
      .stage-head p { margin: 0; color: var(--text-muted); font-size: var(--font-size-0); flex: 1 1 12rem; }
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: var(--size-3); }
      .lcard {
        text-align: start; inline-size: 100%;
        border: var(--border-size-1) solid var(--line);
        border-inline-start: var(--border-size-4) solid var(--c);
        border-radius: var(--radius-3);
        background: var(--surface); color: var(--text);
        padding: var(--size-3);
        display: grid; gap: var(--size-2);
        box-shadow: var(--shadow-1);
        transition: transform 0.14s var(--ease-3), box-shadow 0.14s var(--ease-3);
      }
      .lcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-3); }
      .lcard:active { transform: scale(0.985); }
      .lcard .l-top { display: flex; align-items: center; gap: var(--size-2); font-size: var(--font-size-00); text-transform: uppercase; letter-spacing: var(--font-letterspacing-3); color: var(--text-muted); }
      .lcard .l-title { font-family: var(--font-display); font-size: var(--font-size-1); font-weight: var(--font-weight-7); line-height: var(--font-lineheight-1); }
      .lcard .l-f1 { font-size: var(--font-size-0); color: var(--text-muted); line-height: var(--font-lineheight-3); }
      .lcard.locked { opacity: 0.65; border-style: dashed; }
      .lcard.selected { box-shadow: 0 0 0 3px var(--accent); }

      /* garage */
      .garage { display: grid; gap: var(--size-3); }
      .dcard {
        border: var(--border-size-1) solid var(--line);
        border-inline-start: var(--border-size-5) solid var(--c);
        border-radius: var(--radius-3);
        background: var(--surface);
        padding: var(--size-3);
        display: grid; gap: var(--size-2);
        box-shadow: var(--shadow-1);
      }
      .dhead { display: flex; align-items: center; gap: var(--size-3); flex-wrap: wrap; }
      .pos { font-family: var(--font-display); font-size: var(--font-size-3); font-weight: var(--font-weight-8); color: var(--c); min-inline-size: var(--size-6); }
      .dname { font-family: var(--font-display); font-weight: var(--font-weight-7); font-size: var(--font-size-1); }
      .dteam { font-size: var(--font-size-00); color: var(--text-muted); text-transform: uppercase; letter-spacing: var(--font-letterspacing-3); }
      .dfocus { font-size: var(--font-size-0); color: var(--text-muted); }
      .dnodes { display: flex; flex-wrap: wrap; gap: var(--size-1); }

      .tagbtn {
        border: var(--border-size-1) solid var(--line-strong);
        background: var(--muted-bg); color: var(--text-muted);
        border-radius: var(--radius-round);
        padding: var(--size-1) var(--size-2);
        font-size: var(--font-size-0);
        display: inline-flex; align-items: center; gap: var(--size-1);
        transition: transform 0.12s var(--ease-3), color 0.12s var(--ease-3);
      }
      .tagbtn:hover { color: var(--text); transform: translateY(-1px); }
      .tagbtn:active { transform: scale(0.95); }
      .tagbtn i { inline-size: var(--size-1); block-size: var(--size-1); border-radius: var(--radius-round); background: var(--s); flex: none; }

      /* explainer */
      .explainer { display: grid; gap: var(--size-7); max-inline-size: 52rem; }
      .lede { margin: 0; font-size: var(--font-size-1); line-height: var(--font-lineheight-3); color: var(--text-muted); }
      .ex-section { display: grid; gap: var(--size-3); }
      .ex-section h2 { margin: 0; font-size: var(--font-size-3); }
      .ex-section h2 .rule { display: block; inline-size: var(--size-6); block-size: 4px; border-radius: var(--radius-round); background: var(--accent); margin-block-end: var(--size-2); }
      .ex-section p { margin: 0; line-height: var(--font-lineheight-3); font-size: var(--font-size-1); }
      .ex-section .sub { color: var(--text-muted); font-size: var(--font-size-0); margin: 0; line-height: var(--font-lineheight-3); }

      .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: var(--size-2); }
      .stat { border: var(--border-size-1) solid var(--line); border-radius: var(--radius-3); background: var(--surface); padding: var(--size-3); display: grid; gap: var(--size-1); }
      .stat b { font-family: var(--font-display); font-size: var(--font-size-3); font-weight: var(--font-weight-8); }
      .stat span { font-size: var(--font-size-0); font-weight: var(--font-weight-7); text-transform: uppercase; letter-spacing: var(--font-letterspacing-3); color: var(--accent); }
      .stat em { font-style: normal; font-size: var(--font-size-0); color: var(--text-muted); line-height: var(--font-lineheight-2); }

      .item-grid { display: grid; gap: var(--size-2); }
      .item, .gterm { border: var(--border-size-1) solid var(--line); border-radius: var(--radius-3); background: var(--surface); padding: var(--size-3); display: grid; gap: var(--size-2); }
      .item h3, .gterm h3 { margin: 0; font-size: var(--font-size-1); }
      .item p, .gterm p { margin: 0; font-size: var(--font-size-0); line-height: var(--font-lineheight-3); color: var(--text-muted); }
      .sci { display: flex; flex-wrap: wrap; gap: var(--size-1); align-items: center; }
      .glossary { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: var(--size-2); }

      .ratio-bar { display: flex; overflow: hidden; border-radius: var(--radius-round); block-size: var(--size-6); box-shadow: var(--shadow-1); }
      .ratio-bar span { display: grid; place-items: center; font-family: var(--font-display); font-weight: var(--font-weight-8); font-size: var(--font-size-0); flex-basis: 0; }
      .ratio-cards { grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
      .ratio-card { border-inline-start: var(--border-size-4) solid var(--c); gap: var(--size-1); }
      .ratio-share { font-family: var(--font-display); font-size: var(--font-size-4); font-weight: var(--font-weight-8); color: var(--c); line-height: var(--font-lineheight-0); }

      .steps { display: grid; gap: var(--size-2); }
      .step { display: grid; grid-template-columns: 6rem 1fr; gap: var(--size-3); border: var(--border-size-1) solid var(--line); border-radius: var(--radius-3); background: var(--surface); padding: var(--size-3); }
      .step .when { font-family: var(--font-display); font-weight: var(--font-weight-8); font-size: var(--font-size-0); color: var(--accent); }
      .step .what { font-weight: var(--font-weight-7); font-size: var(--font-size-0); margin-block-end: var(--size-1); }
      .step p { margin: 0; font-size: var(--font-size-0); line-height: var(--font-lineheight-3); color: var(--text-muted); }
      @media (max-width: 30rem) { .step { grid-template-columns: 1fr; gap: var(--size-1); } }

      .table-wrap { overflow-x: auto; border: var(--border-size-1) solid var(--line); border-radius: var(--radius-3); }
      table { border-collapse: collapse; inline-size: 100%; font-size: var(--font-size-0); min-inline-size: 20rem; }
      th, td { padding: var(--size-2) var(--size-3); text-align: start; border-block-end: var(--border-size-1) solid var(--line); }
      th { font-family: var(--font-display); text-transform: uppercase; letter-spacing: var(--font-letterspacing-3); color: var(--text-muted); }
      tr:last-child td { border-block-end: 0; }
      td:first-child { font-weight: var(--font-weight-7); }

      .linklist { display: grid; gap: var(--size-2); }
      .linkrow { display: grid; gap: var(--size-1); border: var(--border-size-1) solid var(--line); border-radius: var(--radius-3); background: var(--surface); padding: var(--size-3); text-decoration: none; color: inherit; transition: transform 0.14s var(--ease-3), box-shadow 0.14s var(--ease-3); }
      .linkrow:hover { transform: translateY(-2px); box-shadow: var(--shadow-3); }
      .linkrow .lname { font-family: var(--font-display); font-weight: var(--font-weight-7); font-size: var(--font-size-1); }
      .linkrow .lname::after { content: " \2197"; color: var(--accent); }
      .linkrow .lnote { font-size: var(--font-size-0); color: var(--text-muted); line-height: var(--font-lineheight-3); }
      .linkrow .lhost { font-size: var(--font-size-00); color: var(--text-muted); }

      /* detail drawer */
      .detail-body { display: grid; gap: var(--size-3); align-content: start; }
      .detail-body h2 { margin: 0; font-size: var(--font-size-3); line-height: var(--font-lineheight-1); }
      .status-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--size-2); }
      .facts { display: grid; gap: var(--size-2); }
      .fact { border: var(--border-size-1) solid var(--line); border-radius: var(--radius-3); background: var(--muted-bg); padding: var(--size-3); display: grid; gap: var(--size-1); }
      .fact h3 { margin: 0; font-family: var(--font-text); font-size: var(--font-size-00); letter-spacing: var(--font-letterspacing-4); text-transform: uppercase; color: var(--text-muted); font-weight: var(--font-weight-7); }
      .fact p { margin: 0; font-size: var(--font-size-0); line-height: var(--font-lineheight-3); }
      .fact.is-f1 { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
      .fact.is-f1 h3 { color: var(--accent); }
      .links { display: flex; flex-wrap: wrap; gap: var(--size-1); }
      .caption { font-size: var(--font-size-00); letter-spacing: var(--font-letterspacing-4); text-transform: uppercase; color: var(--text-muted); font-weight: var(--font-weight-7); }
      .stamp, .foot { font-size: var(--font-size-0); color: var(--text-muted); line-height: var(--font-lineheight-3); }
      .foot { max-inline-size: 46rem; }
      .foot a { color: inherit; }

      .empty { padding: var(--size-8) var(--size-3); text-align: center; color: var(--text-muted); font-size: var(--font-size-0); }

      /* plain-element fallbacks, used only when the component library is unavailable */
      textarea.plain, input.plain { inline-size: 100%; border: var(--border-size-1) solid var(--line-strong); background: var(--muted-bg); color: var(--text); border-radius: var(--radius-2); padding: var(--size-2) var(--size-3); font-size: var(--font-size-0); }
      textarea.plain { min-block-size: 5rem; resize: vertical; line-height: var(--font-lineheight-3); }
      .btn-plain { border: var(--border-size-1) solid var(--line-strong); background: var(--muted-bg); color: var(--text); border-radius: var(--radius-round); padding: var(--size-2) var(--size-3); font-size: var(--font-size-0); font-weight: var(--font-weight-6); }
      .sr { position: absolute; inline-size: 1px; block-size: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

      /* Graceful degradation when the CDN is unreachable: unknown custom elements
         still render their light-DOM children, so keep them legible and usable. */
      jelly-tabs:not(:defined) jelly-tab-panel:not([active]) { display: none; }
      jelly-card:not(:defined) { display: block; border: var(--border-size-1) solid var(--line); border-radius: var(--radius-4); background: var(--surface); padding: var(--size-5); }
      jelly-button:not(:defined), jelly-chip:not(:defined), jelly-badge:not(:defined) { display: inline-block; border: var(--border-size-1) solid var(--line-strong); border-radius: var(--radius-round); padding: var(--size-1) var(--size-3); font-size: var(--font-size-0); font-weight: var(--font-weight-6); cursor: pointer; }
      jelly-drawer:not(:defined), jelly-dialog:not(:defined) { display: block; position: fixed; z-index: var(--layer-4); inset: auto 0 0 0; max-block-size: 85vh; overflow: auto; background: var(--surface); border-block-start: var(--border-size-1) solid var(--line); border-radius: var(--radius-4) var(--radius-4) 0 0; padding: var(--size-3); }
      jelly-drawer:not(:defined):not([open]), jelly-dialog:not(:defined):not([open]) { display: none; }
      jelly-progress:not(:defined) { display: block; block-size: 10px; border-radius: var(--radius-round); background: var(--line-strong); overflow: hidden; }
    </style>
  </head>

  <body>
    <!--
      The single manifest. Every constant, colour, threshold, label, link and piece
      of domain knowledge lives here as plain JSON; the script below is logic only
      and reads all of it from this block. Change what the app knows or how it is
      tuned by editing JSON, never JavaScript.
    -->
    <script type="application/json" id="manifest">
{
  "manifestVersion": 3,

  "app": {
    "id": "gcse-science-f1-roadmap",
    "kicker": "Triple science",
    "title": "Race to the GCSEs",
    "accent": "#e8002d",
    "defaultTab": "track",
    "defaultMode": "light",
    "tabSize": "small",
    "storage": { "progress": "gcse-science-f1-roadmap-v1", "mode": "gcse-science-f1-roadmap-mode", "schemaVersion": 1 },
    "media": { "wide": "(min-width: 60rem)", "dark": "(prefers-color-scheme: dark)" },
    "timing": { "libraryTimeoutMs": 6000, "resizeDebounceMs": 150, "revokeObjectUrlMs": 1000 },
    "rules": { "unlockWeight": 0.67, "notesMaxLength": 4000, "masteredStatus": "race", "maxStatusPoints": 25 },
    "track": {
      "nodeWidth": 170, "nodeHeight": 60, "columnGap": 76, "rowGap": 12,
      "padInline": 100, "padBlock": 56, "laneGap": 28, "laneLabelInset": 12,
      "edge": { "curve": 0.55, "minCurve": 38, "widthIdle": 1.4, "widthActive": 2.6, "opacityIdle": 0.35, "opacityActive": 0.95, "opacityHidden": 0.07 }
    },
    "zoom": { "min": 0.3, "max": 1.4, "fitMax": 1.2, "step": 0.1 },
    "modes": [
      { "id": "auto",  "label": "Auto" },
      { "id": "light", "label": "Light" },
      { "id": "dark",  "label": "Dark" }
    ],
    "tabs": [
      { "id": "track",     "label": "Track map" },
      { "id": "list",      "label": "Roadmap" },
      { "id": "garage",    "label": "Garage" },
      { "id": "study",     "label": "How to study", "page": "study" },
      { "id": "explainer", "label": "F1 explained", "page": "explainer" }
    ],
    "export": { "filePrefix": "gcse-science-f1-progress", "mimeType": "application/json" },

    "style": {
      "fonts": {
        "display": "ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif",
        "text": "system-ui, -apple-system, 'Segoe UI', sans-serif"
      },
      "palette": {
        "light": {
          "bg": "oklch(1 0 0)",
          "surface": "oklch(1 0 0)",
          "muted-bg": "oklch(0.9906 0.0017 247.84)",
          "text": "oklch(0.2609 0.0238 267.11)",
          "text-muted": "oklch(0.503 0.0269 266.68)",
          "line": "oklch(0.9439 0.004 286.32)",
          "line-strong": "oklch(0.8884 0 0)",
          "shadow-color": "220 3% 15%",
          "shadow-strength": "1%"
        },
        "dark": {
          "bg": "oklch(0.2198 0.006 236.84)",
          "surface": "oklch(0.2514 0.0163 264.22)",
          "muted-bg": "oklch(0.288 0.018 262.21)",
          "text": "oklch(0.9645 0.0054 274.97)",
          "text-muted": "oklch(0.7595 0.0259 265.54)",
          "line": "oklch(0.3674 0.0201 266.01)",
          "line-strong": "oklch(0.4707 0.0189 266.12)",
          "shadow-color": "220 40% 2%",
          "shadow-strength": "25%"
        }
      }
    },

    "copy": {
      "scoreCaption": "of the track complete",
      "pointsBadge": "{points} / {max} pts",
      "masteredBadge": "{count} purple",
      "topicsBadge": "{count} topics",
      "subjectMastered": "{count}/{total} purple",
      "searchLabel": "Search topics",
      "searchPlaceholder": "Search topics, F1 links, DIY...",

            "color": "#f2c744",

        "paragraphs": [
          "Formula 1 is the top level of single seater motor racing, run by the FIA, the international governing body for motorsport. The word \"formula\" means a set of rules, and every car on the grid is built to that same formula.",
          "The thing that makes F1 different from most racing is that each team designs and builds its own car. In many series everyone runs identical machinery and only the driver varies. In F1 you are watching an engineering competition and a driving competition at the same time, which is exactly why it works so well as a way into science.",
          "A season is a set of races called Grands Prix, held on circuits around the world between roughly March and December. Two championships are decided every year: the Drivers' championship, won by the individual with the most points, and the Constructors' championship, where a team adds both of its cars' points together. The Constructors' title is the one that decides how much prize money each team receives, so it matters more to the factory than most fans realise.",
          "2026 opened a new rule set. The cars are lighter and smaller, the power units split their output roughly half and half between a petrol engine and an electric motor, the fuel is fully sustainable, and moveable wings replaced the old DRS overtaking system."

            "title": "Downforce: wings mounted upside down",
            "body": "An aeroplane wing is shaped so air moving over it produces lift. Turn the same shape over and it produces the opposite: a force pushing the car down onto the track. More force pressing the tyres into the road means more grip, which means higher cornering speed. A modern F1 car generates more downforce than its own weight, so in theory it could drive along a ceiling.",

          {
            "title": "The grip budget",
            "body": "A tyre can only produce a certain total force. That budget is shared between braking, turning and accelerating, so if a driver uses all of it braking there is nothing left to turn with, and the car goes straight on. Engineers draw this as a circle: the length of the arrow can point in any direction, but it can never leave the circle. Learning to trade braking for cornering as you release the brake is most of what makes a driver fast.",
            "science": ["M9", "P4"]
          },
          {
            "title": "Mass and inertia",
            "body": "Force equals mass times acceleration, so for the same force a lighter car accelerates harder, brakes later and changes direction faster. That is why the minimum weight of 768 kg is policed to the gram, why ballast is made of dense tungsten so it can be placed exactly where the engineers want it, and why teams argue about a driver's body mass.",
            "science": ["P4", "P5", "M11"]
          },
          {
            "title": "Energy management",
            "body": "Since 2026 roughly half the power is electric. The MGU-K recovers energy under braking and puts it back on the straights, but the amount recoverable each lap is limited, so drivers and engineers plan where to deploy it. Spend it in the wrong place and you arrive at the next straight with an empty battery while the car behind arrives with a full one.",
            "science": ["P6", "P7", "P12", "C8"]
          },
          {
            "title": "The tyre temperature window",
            "body": "A tyre only grips properly inside a range of temperatures. Too cold and the rubber is hard and slides; too hot and it degrades and falls apart. Getting a set of tyres into that window on an out lap, and keeping them there for a whole stint, is a bigger part of race pace than raw engine power.",
            "science": ["P14", "C5", "C3"]
          },
          {
            "title": "Balance",
            "body": "Where the aerodynamic force acts, and where the mass sits, decide how the car behaves. Too much force at the front and the rear steps out (oversteer); too much at the back and the front will not turn (understeer). Teams adjust ride height, wing angles, springs and anti roll bars to move that balance, and the centre of mass is kept as low as the rules allow so less weight transfers in a corner.",
            "science": ["P8", "M4"]
          },
          {
            "title": "The driver is a component",
            "body": "Cockpit temperatures reach 50 degrees C, heart rate sits at 160 to 180 bpm for two hours, and cornering loads push the head sideways at several times its own weight. Drivers lose two to three kilograms of sweat during a race, and dehydration measurably slows decision making. Everything a driver trains is a biology topic.",
            "science": ["B3", "B6", "B7", "B10"]
          },
          {
            "title": "To finish first, first you have to finish",
            "body": "A retirement scores nothing, no matter how fast the car was. Reliability, corrosion protection, fatigue life of components and a sensible strategy under uncertainty are worth more over a season than a tenth of a second per lap. A cost cap limits how much each team can spend, which forces those trade offs to be real.",
            "science": ["M12", "C11", "M10"]
          }
        ]
      },
      {
        "type": "glossary",
        "title": "Concepts you should know",
        "intro": "The vocabulary that commentators use without explaining. Chips link back to the science topic behind the word.",
        "items": [
          { "term": "Grand Prix", "body": "One race event of the championship, held over a weekend. Usually the shortest distance over 305 km, with a two hour time limit. Monaco is the exception at around 260 km.", "science": ["P2"] },
          { "term": "Constructor", "body": "A team, in its role as the designer and builder of the car. Constructors' championship points come from both of a team's cars added together.", "science": [] },
          { "term": "Power unit", "body": "The whole propulsion system, not just the engine: a 1.6 litre turbocharged V6 petrol engine, an electric motor generator, a battery, and the control electronics.", "science": ["P6", "C9"] },
          { "term": "ICE", "body": "Internal combustion engine, the petrol half of the power unit. Around 400 kW in 2026.", "science": ["C9", "C6"] },
          { "term": "MGU-K", "body": "Motor generator unit, kinetic. Under braking it acts as a generator and charges the battery; on acceleration it acts as a motor and adds up to 350 kW.", "science": ["P12", "P7"] },
          { "term": "Energy store", "body": "The battery pack. Its mass and the energy it may deploy per lap are both limited by the rules, so energy density is the design problem.", "science": ["C8", "P11"] },
          { "term": "Sustainable fuel", "body": "From 2026 all cars run a fully sustainable fuel, made from non food biomass, municipal waste, or carbon captured from the air rather than pumped out of the ground.", "science": ["C9", "C13"] },
          { "term": "Active aero: X mode and Z mode", "body": "The 2026 cars have moveable front and rear wings. X mode flattens them for low drag on a straight; Z mode steepens them for downforce in the corners. The switch is governed automatically rather than left to the driver.", "science": ["P1", "M8"] },
          { "term": "Manual Override Mode", "body": "The 2026 replacement for DRS. A car close behind another gets extra electrical deployment to help it attack, rather than an open flap.", "science": ["P6", "P12"] },
          { "term": "Ground effect", "body": "Downforce generated by the shaped floor of the car rather than the wings. Air accelerating through the narrow gap under the car drops in pressure and sucks the car towards the track.", "science": ["P9"] },
          { "term": "Dirty air", "body": "The turbulent, low energy air left behind a car. It reduces the downforce of the car following, which is why closing the last half second is much harder than the first.", "science": ["P9", "P1"] },
          { "term": "Slipstream or tow", "body": "The opposite effect on a straight: sitting in the hole punched through the air by the car ahead means less drag and more speed.", "science": ["P7", "P9"] },
          { "term": "Compound", "body": "The rubber recipe of a tyre. Softer compounds grip more and wear out faster. A dry race offers soft, medium and hard; wet weather brings intermediates and full wets.", "science": ["C3", "C10"] },
          { "term": "Degradation, or \"deg\"", "body": "The gradual loss of tyre performance during a stint, from wear and from overheating. High deg forces more pit stops and changes the whole strategy.", "science": ["C5", "P14"] },
          { "term": "Stint", "body": "The run of laps between two pit stops, on one set of tyres.", "science": ["M10"] },
          { "term": "Undercut and overcut", "body": "Two ways of passing in the pits. Undercut: stop earlier than your rival and use fresh tyres to gain time before they stop. Overcut: stay out longer while they warm up their new tyres, and gain the time then.", "science": ["M12", "M10"] },
          { "term": "Parc ferme", "body": "French for \"closed park\". From the start of qualifying the car setup is frozen; change anything significant and you start from the pit lane.", "science": [] },
          { "term": "Pole position", "body": "First place on the starting grid, earned by the fastest lap in qualifying.", "science": ["M10"] },
          { "term": "Q1, Q2, Q3", "body": "The three parts of qualifying. Q1 lasts 18 minutes and eliminates the slowest five cars; Q2 lasts 15 minutes and eliminates five more; Q3 lasts 12 minutes and the remaining ten fight for pole.", "science": ["M10"] },
          { "term": "Purple, green and yellow sectors", "body": "Timing screen colours. Each lap is split into three sectors. Purple means the fastest time anyone has set, green means your own personal best, yellow means slower than your own best. This app borrows exactly that scale for topic progress.", "science": ["M10", "M6"] },
          { "term": "Delta", "body": "The time difference against a reference lap, shown live on the steering wheel. A negative delta means you are gaining.", "science": ["M10", "M6"] },
          { "term": "Safety car and virtual safety car", "body": "Ways of neutralising a race after an incident. A real car leads the field slowly; a virtual safety car instead forces everyone to drive to a delta time. Both bunch the field up and can rescue or ruin a strategy.", "science": ["M12", "P2"] },
          { "term": "Blue flag", "body": "Shown to a driver about to be lapped, telling them to let the leaders through.", "science": [] },
          { "term": "Track limits", "body": "The white lines at the edge of the circuit. Put all four wheels beyond them and the lap time is deleted, or a penalty follows if it keeps happening.", "science": [] },
          { "term": "Brake bias", "body": "How braking force is split between the front and rear axles, adjustable by the driver from the steering wheel mid lap as fuel burns off and the balance changes.", "science": ["M4", "P8"] },
          { "term": "Ride height and rake", "body": "How high the car sits and how much it is angled nose down. Both change how the floor works, so they are among the most sensitive setup choices.", "science": ["P9", "P8"] },
          { "term": "Telemetry", "body": "The live stream of sensor data from the car to the garage: hundreds of channels covering speed, throttle, brake pressure, temperatures and energy flow, all read as graphs.", "science": ["M6", "M7", "M10"] },
          { "term": "Halo", "body": "The titanium loop above the cockpit. It has to withstand around 12 tonnes of static load and has saved several lives since it was introduced in 2018.", "science": ["P5", "C11"] },
          { "term": "Cost cap", "body": "A limit on how much a team may spend in a year, introduced in 2021 to stop the richest teams simply outspending everyone. It forces engineering trade offs instead of unlimited development.", "science": [] },
          { "term": "DNF", "body": "Did not finish. A retirement through mechanical failure, damage or a crash. No points, regardless of how well the weekend was going.", "science": ["C11"] }
        ]
      },
      {
        "type": "steps",
        "title": "How a normal race weekend runs",
        "intro": "Most of the calendar uses this three day format.",
        "items": [
          { "when": "Friday", "what": "Free Practice 1 and 2", "body": "Two sessions of an hour each. Teams check that the car works, try setup changes, and run long stints to learn how the tyres behave." },
          { "when": "Saturday am", "what": "Free Practice 3", "body": "A final hour to confirm the setup before it is frozen." },
          { "when": "Saturday pm", "what": "Qualifying", "body": "Q1 of 18 minutes drops the slowest five to positions 16 to 20. Q2 of 15 minutes drops five more to positions 11 to 15. Q3 of 12 minutes decides the top ten and pole position." },
          { "when": "Sunday", "what": "The Grand Prix", "body": "A formation lap, then the start. Five red lights come on one at a time and the race begins when they all go out. The race runs to the shortest distance over 305 km, with a two hour limit. In a dry race each driver must use at least two different tyre compounds, which is why everyone has to pit." }
        ]
      },
      {
        "type": "steps",
        "title": "How a sprint weekend runs",
        "intro": "Six weekends in 2026 use the sprint format instead: Shanghai, Miami, Montreal, Silverstone, Zandvoort and Singapore.",
        "items": [
          { "when": "Friday am", "what": "Sprint Practice", "body": "A single practice hour. Teams get one shot at understanding the car before it counts." },
          { "when": "Friday pm", "what": "Sprint Qualifying", "body": "A shortened qualifying session that sets the grid for Saturday's sprint." },
          { "when": "Saturday am", "what": "The Sprint", "body": "A 100 km race, about a third of a Grand Prix and roughly 30 minutes long. No mandatory pit stops. Points go to the top eight: 8, 7, 6, 5, 4, 3, 2, 1." },
          { "when": "Saturday pm", "what": "Grand Prix Qualifying", "body": "The normal Q1, Q2, Q3 format, setting Sunday's grid. The sprint result does not affect it." },
          { "when": "Sunday", "what": "The Grand Prix", "body": "Exactly as on a normal weekend, with full points." }
        ]
      },
      {
        "type": "table",
        "title": "How points are scored",
        "intro": "Points go to the driver and, added together across a team's two cars, to the constructor. The bonus point for fastest lap was scrapped from 2025.",
        "columns": ["Finish", "Grand Prix", "Sprint"],
        "rows": [
          ["1st", "25", "8"],
          ["2nd", "18", "7"],
          ["3rd", "15", "6"],
          ["4th", "12", "5"],
          ["5th", "10", "4"],
          ["6th", "8", "3"],
          ["7th", "6", "2"],
          ["8th", "4", "1"],
          ["9th", "2", "-"],
          ["10th", "1", "-"]
        ],
        "note": "Finish outside the top ten in a Grand Prix, or outside the top eight in a sprint, and you score nothing. Whoever has the most points after the final race is world champion."
      },
      {
        "type": "prose",
        "title": "The 2026 grid",
        "paragraphs": [
          "Eleven teams, twenty two drivers: McLaren (Norris, Piastri), Ferrari (Hamilton, Leclerc), Red Bull (Verstappen, Hadjar), Mercedes (Russell, Antonelli), Aston Martin (Alonso, Stroll), Williams (Albon, Sainz), Audi (Hulkenberg, Bortoleto), Alpine (Gasly, Colapinto), Haas (Ocon, Bearman), Racing Bulls (Lawson, Lindblad) and Cadillac (Perez, Bottas).",
          "The nine drivers used as mentors in the Garage tab are all on this grid. Which topics belong to which driver is an arbitrary choice made to give each of them a specialism, not a claim about what any of them actually knows."
        ]
      },
      {
        "type": "links",
        "title": "Where to go next",
        "intro": "Opens in a new tab.",
        "items": [
          { "label": "Formula1.com", "url": "https://www.formula1.com/", "note": "The official site: calendar, standings, results and race reports." },
          { "label": "The beginner's guide to the 2026 regulations", "url": "https://www.formula1.com/en/latest/article/the-beginners-guide-to-the-2026-regulations.6j0tS0hrHG2T01tpmK6XYz", "note": "Official plain English explanation of the current rule set. Start here." },
          { "label": "FIA regulations", "url": "https://www.fia.com/regulation/category/110", "note": "The actual sporting, technical and financial rulebooks as PDFs. Dry, but it is the primary source." },
          { "label": "FIA 2026 F1 season", "url": "https://www.fia.com/events/fia-formula-one-world-championship/season-2026/formula-one", "note": "Official entry lists, event pages and stewards' decisions." },
          { "label": "Chain Bear on YouTube", "url": "https://www.youtube.com/@ChainBear", "note": "The clearest explanations anywhere of how the rules and the aerodynamics actually work. Ideal if you like knowing why." },
          { "label": "Formula 1 on YouTube", "url": "https://www.youtube.com/@Formula1", "note": "Official highlights, onboards and technical explainers." },
          { "label": "Racecar Engineering", "url": "https://www.racecar-engineering.com/", "note": "Proper engineering journalism about how race cars are designed. Where the physics gets real." },
          { "label": "The Race", "url": "https://www.the-race.com/formula-1/", "note": "Analysis rather than news: why a strategy worked, why a car is quick." },
          { "label": "Autosport", "url": "https://www.autosport.com/f1/", "note": "Daily news coverage across the whole sport." },
          { "label": "BBC Sport Formula 1", "url": "https://www.bbc.co.uk/sport/formula1", "note": "UK coverage, results and the calendar, free to read." },
          { "label": "2026 season on Wikipedia", "url": "https://en.wikipedia.org/wiki/2026_Formula_One_World_Championship", "note": "The fastest way to check a fact: entries, results tables and rule changes with references." },
          { "label": "STEM Racing", "url": "https://www.stemracing.com/", "note": "The schools competition formerly called F1 in Schools. Teams design, test and race a miniature car, which turns most of this roadmap into a practical project." }
        ]
      }
    ]
    }
  }

    <jelly-theme mode="auto" id="theme">
      <div class="shell" id="shell"></div>
    </jelly-theme>

    <script type="module">
      /* Logic only. Every constant, colour, label and fact comes from the manifest. */

      const M = JSON.parse(document.getElementById("manifest").textContent);
      const APP = M.app;
      const COPY = APP.copy;

      const NODES = M.nodes;
      const BY_ID = new Map(NODES.map((n) => [n.id, n]));
      const STATUS = new Map(M.statuses.map((s) => [s.id, s]));
      const STATUS_IDS = M.statuses.map((s) => s.id);
      const MAX_POINTS = NODES.length * APP.rules.maxStatusPoints;

      const UNLOCKS = new Map(NODES.map((n) => [n.id, []]));
      NODES.forEach((n) => n.requires.forEach((r) => UNLOCKS.has(r) && UNLOCKS.get(r).push(n.id)));

      const fill = (template, vars) => String(template).replace(/\{(\w+)\}/g, (_, k) => (k in vars ? vars[k] : "{" + k + "}"));
      const wideQuery = window.matchMedia(APP.media.wide);
      const darkQuery = window.matchMedia(APP.media.dark);

      function make(tag, props = {}, children = []) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props)) {
          if (value === undefined || value === null || value === false) continue;
          if (key === "class") node.className = value;
          else if (key === "text") node.textContent = value;
          else if (key === "style") Object.assign(node.style, value);
          else if (key === "vars") for (const [v, val] of Object.entries(value)) node.style.setProperty("--" + v, val);
          else if (key === "on") for (const [evt, handler] of Object.entries(value)) node.addEventListener(evt, handler);
          else node.setAttribute(key, value === true ? "" : String(value));
        }
        children.filter(Boolean).forEach((child) => node.append(child));
        return node;
      }

      /* The component library loads from a CDN. Wait for it, but never hang: if it
         cannot be fetched the page falls back to plain elements. */
      const jellyOk = await Promise.race([
        customElements.whenDefined("jelly-button").then(() => true),
        new Promise((resolve) => setTimeout(() => resolve(false), APP.timing.libraryTimeoutMs))
      ]);

      /* ---------------- theme, injected from the manifest ---------------- */

      function buildThemeStyles() {
        const rules = [
          ":root{--font-display:" + APP.style.fonts.display + ";--font-text:" + APP.style.fonts.text + ";--accent:" + APP.accent + ";}"
        ];
        for (const [mode, tokens] of Object.entries(APP.style.palette)) {
          const decls = Object.entries(tokens).map(([k, v]) => "--" + k + ":" + v).join(";");
          rules.push('.shell[data-mode="' + mode + '"]{' + decls + ";--page-bg:" + tokens.bg + ";--page-fg:" + tokens.text + ";}");
          rules.push('body[data-mode="' + mode + '"]{--page-bg:' + tokens.bg + ";--page-fg:" + tokens.text +
            ";--shadow-color:" + tokens["shadow-color"] + ";--shadow-strength:" + tokens["shadow-strength"] + ";}");
        }
        document.head.append(make("style", { text: rules.join("\n") }));
      }

      const theme = document.getElementById("theme");
      const shell = document.getElementById("shell");
      let modePref = localStorage.getItem(APP.storage.mode) || APP.defaultMode;

      function resolvedMode() {
        if (modePref !== "auto") return modePref;
        if (theme && theme.resolvedMode) return theme.resolvedMode;
        return darkQuery.matches ? "dark" : "light";
      }

      function applyMode() {
        theme.setAttribute("mode", modePref);
        const mode = resolvedMode();
        shell.dataset.mode = mode;
        document.body.dataset.mode = mode;
        localStorage.setItem(APP.storage.mode, modePref);
      }

      /* ---------------- state ---------------- */

      let progress = loadProgress();
      let view = APP.defaultTab;
      let selectedId = null;
      let query = "";
      let activeSubjects = new Set(Object.keys(M.subjects));
      let zoom = 1;
      let pendingImport = null;

      function loadProgress() {
        try {
          const raw = localStorage.getItem(APP.storage.progress);
          if (!raw) return {};
          const parsed = JSON.parse(raw);
          return sanitise(parsed && parsed.progress ? parsed.progress : parsed).entries;
        } catch (err) {
          console.warn("Could not read saved progress", err);
          return {};
        }
      }

      function saveProgress() {
        try {
          localStorage.setItem(
            APP.storage.progress,
            JSON.stringify({ version: APP.storage.schemaVersion, app: APP.id, updatedAt: new Date().toISOString(), progress })
          );
        } catch (err) {
          console.warn("Could not save progress", err);
        }
      }

      /* Accepts anything and keeps only entries with a known node id and status. */
      function sanitise(input) {
        const entries = {};
        let skipped = 0;
        if (input && typeof input === "object") {
          for (const id of Object.keys(input)) {
            const value = input[id];
            if (!BY_ID.has(id) || !value || typeof value !== "object" || !STATUS.has(value.status)) {
              skipped += 1;
              continue;
            }
            entries[id] = {
              status: value.status,
              notes: typeof value.notes === "string" ? value.notes.slice(0, APP.rules.notesMaxLength) : "",
              updatedAt: typeof value.updatedAt === "string" ? value.updatedAt : new Date().toISOString()
            };
          }
        }
        return { entries, skipped };
      }

      const statusOf = (id) => (progress[id] && progress[id].status) || STATUS_IDS[0];
      const statusFor = (id) => STATUS.get(statusOf(id));
      const isUnlocked = (node) => node.requires.every((r) => statusFor(r).weight >= APP.rules.unlockWeight);
      const isMastered = (id) => statusOf(id) === APP.rules.masteredStatus;

      function isVisible(node) {
        if (!activeSubjects.has(node.subject)) return false;
        if (!query) return true;
        return [node.id, node.title, node.spec, node.f1, node.diy, node.check].join(" ").toLowerCase().includes(query);
      }

      function setStatus(id, status) {
        const current = progress[id] || {};
        progress[id] = { status, notes: current.notes || "", updatedAt: new Date().toISOString() };
        saveProgress();
        renderStats();
        renderView();
        renderDetail();
      }

      function setNotes(id, notes) {
        const current = progress[id] || {};
        progress[id] = { status: current.status || STATUS_IDS[0], notes, updatedAt: new Date().toISOString() };
        saveProgress();
      }

      /* ---------------- component wrappers ---------------- */

      function badge(text, opts = {}) {
        const node = make(jellyOk ? "jelly-badge" : "span", { text, size: opts.size || "medium" });
        if (opts.fill) {
          node.style.setProperty("--jelly-fill", opts.fill);
          node.style.setProperty("--jelly-label", opts.label || "#fff");
          if (!jellyOk) Object.assign(node.style, { background: opts.fill, color: opts.label || "#fff", borderColor: opts.fill });
        } else if (opts.variant && jellyOk) {
          node.setAttribute("variant", opts.variant);
          if (opts.outline) node.setAttribute("outline", "");
        }
        return node;
      }

      function button(text, opts = {}) {
        const node = make(jellyOk ? "jelly-button" : "button", {
          text,
          size: opts.size || "small",
          shape: jellyOk ? "square" : undefined,
          block: opts.block && jellyOk,
          class: jellyOk ? undefined : "btn-plain",
          on: opts.onClick ? { click: opts.onClick } : undefined
        });
        if (opts.fill) {
          node.style.setProperty("--jelly-fill", opts.fill);
          node.style.setProperty("--jelly-label", opts.label || "#fff");
          if (!jellyOk) Object.assign(node.style, { background: opts.fill, color: opts.label || "#fff" });
        } else if (opts.variant && jellyOk) {
          node.setAttribute("variant", opts.variant);
        }
        return node;
      }

      function progressBar(value, color, label) {
        if (jellyOk) {
          return make("jelly-progress", { value: Math.round(value), size: "small", label, vars: { "jelly-accent": color } });
        }
        const track = make("div", { style: { blockSize: "10px", borderRadius: "1e5px", background: "var(--line-strong)", overflow: "hidden" } });
        track.append(make("i", { style: { display: "block", blockSize: "100%", background: color, inlineSize: value + "%" } }));
        return track;
      }

      function textField(kind, opts = {}) {
        const tag = jellyOk ? (kind === "textarea" ? "jelly-textarea" : "jelly-input") : kind;
        const node = make(tag, {
          label: opts.label,
          placeholder: opts.placeholder,
          rows: opts.rows,
          class: jellyOk ? undefined : "plain",
          "no-autofill": jellyOk,
          on: opts.onInput ? { input: (e) => opts.onInput(e.target.value) } : undefined
        });
        if (jellyOk) {
          if (opts.value) node.setAttribute("value", opts.value);
        } else {
          node.value = opts.value || "";
          if (kind === "input") node.type = "search";
        }
        return node;
      }

      function card(children) {
        const node = make(jellyOk ? "jelly-card" : "div", { class: jellyOk ? undefined : "surface" });
        children.filter(Boolean).forEach((child) => node.append(child));
        return node;
      }

      /* ---------------- page chrome, built from the manifest ---------------- */

      const refs = {};

      function buildChrome() {
        shell.replaceChildren();

        refs.modeSwitch = make("div", { class: "row" });
        shell.append(
          make("header", { class: "row masthead" }, [
            make("div", {}, [make("span", { class: "kicker", text: APP.kicker }), make("h1", { text: APP.title })]),
            make("div", { class: "push" }, [refs.modeSwitch])
          ])
        );

        refs.pct = make("span", { text: "0" });
        refs.headlineBadges = make("div", { class: "row push" });
        refs.overallBar = make("div");
        refs.subjectGrid = make("div", { class: "subject-grid" });

        shell.append(
          card([
            make("div", { class: "dash" }, [
              make("div", { class: "row" }, [
                make("div", { class: "score" }, [refs.pct, document.createTextNode("%"), make("br"), make("small", { text: COPY.scoreCaption })]),
                refs.headlineBadges
              ]),
              refs.overallBar,
              refs.subjectGrid
            ])
          ])
        );

        refs.searchSlot = make("div", { class: "grow" });
        refs.subjectChips = make("div", { class: "row" });
        refs.controls = make("div", { class: "row" }, [refs.searchSlot, refs.subjectChips]);
        shell.append(refs.controls);

        refs.panels = {};
        refs.tabPanels = {};
        const tabs = make(jellyOk ? "jelly-tabs" : "div", { id: "tabs", size: APP.tabSize });
        APP.tabs.forEach((tab) => {
          const content = make("div", { style: { marginBlockStart: "var(--size-3)" } });
          refs.panels[tab.id] = content;
          const panel = make(jellyOk ? "jelly-tab-panel" : "section", {
            label: tab.label,
            value: tab.id,
            active: tab.id === APP.defaultTab
          }, [tab.id === "track" ? buildTrackPanel(content) : content]);
          refs.tabPanels[tab.id] = panel;
          tabs.append(panel);
        });
        tabs.addEventListener("change", (e) => setView(e.target.value || APP.defaultTab));

        /* Without the library there is no tab bar, so supply a plain one and
           switch the panels by hand. Otherwise only the first tab is reachable. */
        if (!jellyOk) {
          refs.fallbackTabs = make("div", { class: "row" }, APP.tabs.map((tab) =>
            button(tab.label, { onClick: () => setView(tab.id) })
          ));
          shell.append(refs.fallbackTabs);
        }
        shell.append(tabs);

        shell.append(
          make("div", { class: "row" }, [
            button(COPY.exportButton, { variant: "mint", onClick: exportProgress }),
            button(COPY.importButton, { variant: "azure", onClick: () => refs.importFile.click() }),
            button(COPY.resetButton, { variant: "platinum", onClick: resetProgress }),
            (refs.importFile = make("input", {
              type: "file",
              accept: APP.export.mimeType + ",.json",
              class: "sr",
              on: {
                change: (e) => {
                  const file = e.target.files && e.target.files[0];
                  if (file) handleImportFile(file);
                  e.target.value = "";
                }
              }
            }))
          ])
        );

        const foot = make("p", { class: "foot" });
        COPY.footer.forEach((part) => {
          foot.append(part.href ? make("a", { href: part.href, text: part.text, target: part.href.startsWith("http") ? "_blank" : undefined, rel: "noopener" }) : document.createTextNode(part.text));
        });
        shell.append(foot);

        buildOverlays();
      }

      function buildTrackPanel(content) {
        const t = APP.track;
        refs.zoomLabel = make("span", { text: "100%" });
        refs.canvas = make("div", { class: "canvas" });

        refs.edges.setAttribute("aria-hidden", "true");
        refs.canvas.append(refs.edges);
        refs.zoomWrap = make("div", { class: "zoom-wrap" }, [refs.canvas]);
        refs.viewport = make("div", { class: "viewport" }, [refs.zoomWrap]);

        content.append(
          make("div", { class: "row" }, [
            button(COPY.zoomOut, { variant: "platinum", onClick: () => nudgeZoom(-APP.zoom.step) }),
            button(COPY.zoomIn, { variant: "platinum", onClick: () => nudgeZoom(APP.zoom.step) }),
            button(COPY.zoomFit, { variant: "platinum", onClick: fitZoom }),
            refs.zoomLabel,
            make("span", { class: "push foot", text: COPY.trackHint })

          ...APP.modes.map((mode) =>
            button(mode.label, {

      function renderSubjectChips() {
        refs.subjectChips.replaceChildren(
          ...Object.entries(M.subjects).map(([key, subject]) => {
            const on = activeSubjects.has(key);
            const chip = make(jellyOk ? "jelly-chip" : "button", {
              text: subject.name,
              size: "small",
              selectable: jellyOk,
              selected: jellyOk && on,
              class: jellyOk ? undefined : "btn-plain",
              vars: { "jelly-fill": subject.color, "jelly-label": subject.labelColor }
            });
            if (!jellyOk) Object.assign(chip.style, { background: on ? subject.color : "transparent", color: on ? subject.labelColor : "inherit" });
            chip.addEventListener(jellyOk ? "change" : "click", () => {
