# Validate emergency edits with: pi-job --task <this-file> validate
title: Add Markdown task preview command
status: in_progress
source:
  jira: ''
  discovered: '2026-08-03'
  context: Requested a pi-job subcommand that previews a task file as Markdown on standard output.
project:
  key: pi-job-harness
  name: pi-job harness
  route: dot_local/share/pi-job-harness
  context: Implement the command, tests, and documentation in the chezmoi-managed pi-job harness.
context: 'Add `pi-job --task <file> markdown`.

  The command must load and validate the selected task through the existing TaskStore abstraction, render
  a useful human-readable Markdown preview, and write only that Markdown to stdout.

  It must work consistently for supported task-store backends, must not mutate task state, and must not
  emit ANSI styling.

  The preview should preserve task and plan order and cover task metadata, context, decisions, orchestration
  state, artifacts, slices, steps, dependencies, execution evidence, and repository work without exposing
  backend-only serialization details.

  Define explicit behavior for empty or optional fields and escaping content that could break Markdown
  structure.

  Add end-to-end CLI tests for representative and minimal tasks, stdout/stderr behavior, validation failures,
  and proof that previewing leaves the source unchanged.

  Update user-facing command documentation and examples.

  '
