          { "term": "Telemetry", "body": "The live stream of sensor data from the car to the garage: hundreds of channels covering speed, throttle, brake pressure, temperatures and energy flow, all read as graphs.", "science": ["M6", "M7", "M10"] },
          { "term": "Halo", "body": "The titanium loop above the cockpit. It has to withstand around 12 tonnes of static load and has saved several lives since it was introduced in 2018.", "science": ["P5", "C11"] },
          { "term": "Cost cap", "body": "A limit on how much a team may spend in a year, introduced in 2021 to stop the richest teams simply outspending everyone. It forces engineering trade offs instead of unlimited development.", "science": [] },
          { "term": "DNF", "body": "Did not finish. A retirement through mechanical failure, damage or a crash. A retired car can still be classified if it completed enough distance, so DNF does not automatically mean no points.", "science": ["C11"] }
        ]
      },
      {
        "type": "steps",
        "title": "How a normal race weekend runs",
        "intro": "Most of the calendar uses this three day format.",
        "items": [
          { "when": "Friday", "what": "Free Practice 1 and 2", "body": "Two sessions of an hour each. Teams check that the car works, try setup changes, and run long stints to learn how the tyres behave." },
          { "when": "Saturday am", "what": "Free Practice 3", "body": "A final hour to confirm the setup before it is frozen." },
          { "when": "Saturday pm", "what": "Qualifying", "body": "With 22 cars, Q1 of 18 minutes drops the slowest six to positions 17 to 22. Q2 of 15 minutes drops six more to positions 11 to 16. Q3 of 12 minutes decides the top ten and pole position." },
          { "when": "Sunday", "what": "The Grand Prix", "body": "A formation lap, then the start. Five red lights come on one at a time and the race begins when they all go out. The race runs to the shortest distance over 305 km, with a two hour limit. In a dry race each driver must use at least two different tyre compounds, which is why everyone has to pit." }
        ]
      },
      {
        "type": "steps",
        "title": "How a sprint weekend runs",
        "intro": "Six weekends in 2026 use the sprint format instead: Shanghai, Miami, Montreal, Silverstone, Zandvoort and Singapore.",
        "items": [
          { "when": "Friday am", "what": "Sprint Practice", "body": "A single practice hour. Teams get one shot at understanding the car before it counts." },
          { "when": "Friday pm", "what": "Sprint Qualifying", "body": "A shortened qualifying session that sets the grid for Saturday's sprint." },
          { "when": "Saturday am", "what": "The Sprint", "body": "A 100 km race, about a third of a Grand Prix and roughly 30 minutes long. No mandatory pit stops. Points go to the top eight: 8, 7, 6, 5, 4, 3, 2, 1." },
          { "when": "Saturday pm", "what": "Grand Prix Qualifying", "body": "The normal Q1, Q2, Q3 format, setting Sunday's grid. The sprint result does not affect it." },
          { "when": "Sunday", "what": "The Grand Prix", "body": "Exactly as on a normal weekend, with full points." }
        ]
      },
      {
        "type": "table",
        "title": "How points are scored",
        "intro": "Points go to the driver and, added together across a team's two cars, to the constructor. The bonus point for fastest lap was scrapped from 2025.",
        "columns": ["Finish", "Grand Prix", "Sprint"],
        "rows": [
          ["1st", "25", "8"],
          ["2nd", "18", "7"],
          ["3rd", "15", "6"],
          ["4th", "12", "5"],
          ["5th", "10", "4"],
          ["6th", "8", "3"],
          ["7th", "6", "2"],
          ["8th", "4", "1"],
          ["9th", "2", "-"],
          ["10th", "1", "-"]
        ],
        "note": "Finish outside the top ten in a Grand Prix, or outside the top eight in a sprint, and you score nothing. Whoever has the most points after the final race is world champion."
      },
      {
        "type": "prose",
        "title": "The 2026 grid",
        "paragraphs": [
          "Eleven teams, twenty two drivers: McLaren (Norris, Piastri), Ferrari (Hamilton, Leclerc), Red Bull (Verstappen, Hadjar), Mercedes (Russell, Antonelli), Aston Martin (Alonso, Stroll), Williams (Albon, Sainz), Audi (Hulkenberg, Bortoleto), Alpine (Gasly, Colapinto), Haas (Ocon, Bearman), Racing Bulls (Lawson, Lindblad) and Cadillac (Perez, Bottas).",
          "The nine drivers used as mentors in the Garage tab are all on this grid. Which topics belong to which driver is an arbitrary choice made to give each of them a specialism, not a claim about what any of them actually knows."
        ]
      },
      {
        "type": "links",
        "title": "Where to go next",
        "intro": "Opens in a new tab.",
        "items": [
          { "label": "Formula1.com", "url": "https://www.formula1.com/", "note": "The official site: calendar, standings, results and race reports." },
          { "label": "The beginner's guide to the 2026 regulations", "url": "https://www.formula1.com/en/latest/article/the-beginners-guide-to-the-2026-regulations.6j0tS0hrHG2T01tpmK6XYz", "note": "Official plain English explanation of the current rule set. Start here." },
          { "label": "FIA regulations", "url": "https://www.fia.com/regulation/category/110", "note": "The actual sporting, technical and financial rulebooks as PDFs. Dry, but it is the primary source." },
          { "label": "FIA 2026 F1 season", "url": "https://www.fia.com/events/fia-formula-one-world-championship/season-2026/formula-one", "note": "Official entry lists, event pages and stewards' decisions." },
          { "label": "Chain Bear on YouTube", "url": "https://www.youtube.com/@ChainBear", "note": "The clearest explanations anywhere of how the rules and the aerodynamics actually work. Ideal if you like knowing why." },
          { "label": "Formula 1 on YouTube", "url": "https://www.youtube.com/@Formula1", "note": "Official highlights, onboards and technical explainers." },
          { "label": "Racecar Engineering", "url": "https://www.racecar-engineering.com/", "note": "Proper engineering journalism about how race cars are designed. Where the physics gets real." },
          { "label": "The Race", "url": "https://www.the-race.com/formula-1/", "note": "Analysis rather than news: why a strategy worked, why a car is quick." },
          { "label": "Autosport", "url": "https://www.autosport.com/f1/", "note": "Daily news coverage across the whole sport." },
          { "label": "BBC Sport Formula 1", "url": "https://www.bbc.co.uk/sport/formula1", "note": "UK coverage, results and the calendar, free to read." },
          { "label": "2026 season on Wikipedia", "url": "https://en.wikipedia.org/wiki/2026_Formula_One_World_Championship", "note": "The fastest way to check a fact: entries, results tables and rule changes with references." },
          { "label": "STEM Racing", "url": "https://www.stemracing.com/", "note": "The schools competition formerly called F1 in Schools. Teams design, test and race a miniature car, which turns most of this roadmap into a practical project." }
        ]
      }
    ]
    }
  }
}
    </script>

    <jelly-theme mode="auto" id="theme">
      <div class="shell" id="shell"></div>
    </jelly-theme>

    <script type="module">
      /* Logic only. Every constant, colour, label and fact comes from the manifest. */

      const M = JSON.parse(document.getElementById("manifest").textContent);
      const APP = M.app;
      const COPY = APP.copy;

      function renderProtocolError() {
        const shell = document.getElementById("shell");
        shell.replaceChildren();
        const title = document.createElement("h1");
        title.textContent = COPY.httpRequiredTitle;
        shell.append(title);
        for (const text of [COPY.httpRequiredBody, COPY.httpRequiredCommand, COPY.httpRequiredUrl]) {
          const paragraph = document.createElement("p");
          paragraph.textContent = text;
          shell.append(paragraph);
        }
      }

      if (location.protocol !== "http:" && location.protocol !== "https:") renderProtocolError();
      else await boot();

      async function boot() {

      const NODES = M.nodes;
      const BY_ID = new Map(NODES.map((n) => [n.id, n]));
      const STATUS = new Map(M.statuses.map((s) => [s.id, s]));
      const STATUS_IDS = M.statuses.map((s) => s.id);
      const MAX_POINTS = NODES.length * APP.rules.maxStatusPoints;

      const UNLOCKS = new Map(NODES.map((n) => [n.id, []]));
      NODES.forEach((n) => n.requires.forEach((r) => UNLOCKS.has(r) && UNLOCKS.get(r).push(n.id)));

      const nodeOrder = (a, b) =>
        a.stage - b.stage ||
        M.laneOrder.indexOf(a.subject) - M.laneOrder.indexOf(b.subject) ||
        a.id.localeCompare(b.id, undefined, { numeric: true });

      function topologicalOrder() {
        const indegree = new Map(NODES.map((node) => [node.id, node.requires.length]));
        const ready = NODES.filter((node) => indegree.get(node.id) === 0).sort(nodeOrder);
        const ordered = [];
        while (ready.length) {
          const node = ready.shift();
          ordered.push(node);
          UNLOCKS.get(node.id).forEach((id) => {
            indegree.set(id, indegree.get(id) - 1);
            if (indegree.get(id) === 0) {
              ready.push(BY_ID.get(id));
              ready.sort(nodeOrder);
            }
          });
        }
        return ordered;
      }

      const TOPOLOGICAL_NODES = topologicalOrder();
      const TOPOLOGICAL_RANK = new Map(TOPOLOGICAL_NODES.map((node, index) => [node.id, index]));

      function relatedIds(id, direction) {
        const found = new Set();
        const pending = [...direction(BY_ID.get(id))];
        while (pending.length) {
          const next = pending.pop();
          if (found.has(next)) continue;
          found.add(next);
          pending.push(...direction(BY_ID.get(next)));
        }
        return found;
      }

      const ancestorsOf = (id) => relatedIds(id, (node) => node.requires);
      const descendantsOf = (id) => relatedIds(id, (node) => UNLOCKS.get(node.id));

      const fill = (template, vars) => String(template).replace(/\{(\w+)\}/g, (_, k) => (k in vars ? vars[k] : "{" + k + "}"));
      const wideQuery = window.matchMedia(APP.media.wide);
      const darkQuery = window.matchMedia(APP.media.dark);

      function make(tag, props = {}, children = []) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props)) {
          if (value === undefined || value === null || value === false) continue;
          if (key === "class") node.className = value;
          else if (key === "text") node.textContent = value;
          else if (key === "style") Object.assign(node.style, value);
          else if (key === "vars") for (const [v, val] of Object.entries(value)) node.style.setProperty("--" + v, val);
          else if (key === "on") for (const [evt, handler] of Object.entries(value)) node.addEventListener(evt, handler);
          else node.setAttribute(key, value === true ? "" : String(value));
        }
        children.filter(Boolean).forEach((child) => node.append(child));
        return node;
      }

      /* The component library loads from a CDN. Wait for it, but never hang: if it
         cannot be fetched the page falls back to plain elements. */
      const jellyOk = await Promise.race([
        customElements.whenDefined("jelly-button").then(() => true),
        new Promise((resolve) => setTimeout(() => resolve(false), APP.timing.libraryTimeoutMs))
      ]);

      /* ---------------- theme, injected from the manifest ---------------- */

      function buildThemeStyles() {
        const rules = [
          ":root{--font-display:" + APP.style.fonts.display + ";--font-text:" + APP.style.fonts.text + ";--accent:" + APP.accent + ";--chain-outline-width:" + APP.track.edge.nodeOutlineWidth + ";}"
        ];
        for (const [mode, tokens] of Object.entries(APP.style.palette)) {
          const decls = Object.entries(tokens).map(([k, v]) => "--" + k + ":" + v).join(";");
          rules.push('.shell[data-mode="' + mode + '"]{' + decls + ";--page-bg:" + tokens.bg + ";--page-fg:" + tokens.text + ";}");
          rules.push('body[data-mode="' + mode + '"]{--page-bg:' + tokens.bg + ";--page-fg:" + tokens.text +
            ";--shadow-color:" + tokens["shadow-color"] + ";--shadow-strength:" + tokens["shadow-strength"] + ";}");
        }
        document.head.append(make("style", { text: rules.join("\n") }));
      }

      const theme = document.getElementById("theme");
      const shell = document.getElementById("shell");
      let modePref = localStorage.getItem(APP.storage.mode) || APP.defaultMode;

      function resolvedMode() {
        if (modePref !== "auto") return modePref;
        if (theme && theme.resolvedMode) return theme.resolvedMode;
        return darkQuery.matches ? "dark" : "light";
      }

      function applyMode() {
        theme.setAttribute("mode", modePref);
        const mode = resolvedMode();
        shell.dataset.mode = mode;
        document.body.dataset.mode = mode;
        localStorage.setItem(APP.storage.mode, modePref);
      }

      /* ---------------- state ---------------- */

      let progress = loadProgress();
      let view = APP.defaultTab;
      let selectedId = null;
      let query = "";
      let activeSubjects = new Set(Object.keys(M.subjects));
      let zoom = 1;
      let pendingImport = null;
      let selectionToken = 0;
      let catalogPromise = null;
      let paperPromise = null;
      const topicResourceCache = new Map();
      const supportState = { topicId: null, topic: "idle", papers: "idle" };

      function loadProgress() {
        try {
          const raw = localStorage.getItem(APP.storage.progress);
          if (!raw) return {};
          const parsed = JSON.parse(raw);
          return sanitise(parsed && parsed.progress ? parsed.progress : parsed).entries;
        } catch (err) {
          console.warn("Could not read saved progress", err);
          return {};
        }
      }

      function saveProgress() {
        try {
          localStorage.setItem(
            APP.storage.progress,
            JSON.stringify({ version: APP.storage.schemaVersion, app: APP.id, updatedAt: new Date().toISOString(), progress })
          );
        } catch (err) {
          console.warn("Could not save progress", err);
        }
      }

      /* Accepts anything and keeps only entries with a known node id and status. */
      function sanitise(input) {
        const entries = {};
        let skipped = 0;
        if (input && typeof input === "object") {
          for (const id of Object.keys(input)) {
            const value = input[id];
            if (!BY_ID.has(id) || !value || typeof value !== "object" || !STATUS.has(value.status)) {
              skipped += 1;
              continue;
            }
            entries[id] = {
              status: value.status,
              notes: typeof value.notes === "string" ? value.notes.slice(0, APP.rules.notesMaxLength) : "",
              updatedAt: typeof value.updatedAt === "string" ? value.updatedAt : new Date().toISOString()
            };
          }
        }
        return { entries, skipped };
      }

      const statusOf = (id) => (progress[id] && progress[id].status) || APP.rules.newStatus;
      const statusFor = (id) => STATUS.get(statusOf(id));
      const isMet = (id) => statusFor(id).weight >= APP.rules.unlockWeight;
      const unmetPrerequisites = (id) => TOPOLOGICAL_NODES.filter((node) => ancestorsOf(id).has(node.id) && !isMet(node.id));
      const isUnlocked = (node) => unmetPrerequisites(node.id).length === 0;
      const isMastered = (id) => statusOf(id) === APP.rules.masteredStatus;
      const directReadiness = (node) => ({ ready: node.requires.filter(isMet).length, total: node.requires.length });
      const actionableNodes = () => TOPOLOGICAL_NODES.filter((node) => statusOf(node.id) === APP.rules.newStatus && isUnlocked(node));

      const idsInTopologicalOrder = (ids) => TOPOLOGICAL_NODES.filter((node) => ids.has(node.id)).map((node) => node.id);
      window.__ROADMAP_TEST__ = Object.freeze({
        topologicalIds: () => TOPOLOGICAL_NODES.map((node) => node.id),
        ancestors: (id) => idsInTopologicalOrder(ancestorsOf(id)),
        descendants: (id) => idsInTopologicalOrder(descendantsOf(id)),
        readiness: (id) => {
          const node = BY_ID.get(id);
          const direct = directReadiness(node);
          return { ...direct, readyToStart: isUnlocked(node), unmet: unmetPrerequisites(id).map((item) => item.id) };
        },
        actionableIds: () => actionableNodes().map((node) => node.id),
        supportState: () => ({ ...supportState })
      });

      function isVisible(node) {
        if (!activeSubjects.has(node.subject)) return false;
        if (!query) return true;
        return [node.id, node.title, node.spec, node.f1, node.diy, node.check].join(" ").toLowerCase().includes(query);
      }

      function setStatus(id, status) {
        const current = progress[id] || {};
        progress[id] = { status, notes: current.notes || "", updatedAt: new Date().toISOString() };
        saveProgress();
        renderStats();
        renderView();
        renderDetail();
      }

      function setNotes(id, notes) {
        const current = progress[id] || {};
        progress[id] = { status: current.status || APP.rules.newStatus, notes: notes.slice(0, APP.rules.notesMaxLength), updatedAt: new Date().toISOString() };
        saveProgress();
      }

      /* ---------------- component wrappers ---------------- */

      function badge(text, opts = {}) {
        const node = make(jellyOk ? "jelly-badge" : "span", { text, size: opts.size || "medium" });
        if (opts.fill) {
          node.style.setProperty("--jelly-fill", opts.fill);
          node.style.setProperty("--jelly-label", opts.label || "#fff");
          if (!jellyOk) Object.assign(node.style, { background: opts.fill, color: opts.label || "#fff", borderColor: opts.fill });
        } else if (opts.variant && jellyOk) {
          node.setAttribute("variant", opts.variant);
          if (opts.outline) node.setAttribute("outline", "");
        }
        return node;
      }

      function button(text, opts = {}) {
        const node = make(jellyOk ? "jelly-button" : "button", {
          text,
          size: opts.size || "small",
          shape: jellyOk ? "square" : undefined,
          block: opts.block && jellyOk,
          class: jellyOk ? undefined : "btn-plain",
          on: opts.onClick ? { click: opts.onClick } : undefined
        });
        if (opts.fill) {
          node.style.setProperty("--jelly-fill", opts.fill);
          node.style.setProperty("--jelly-label", opts.label || "#fff");
          if (!jellyOk) Object.assign(node.style, { background: opts.fill, color: opts.label || "#fff" });
        } else if (opts.variant && jellyOk) {
          node.setAttribute("variant", opts.variant);
        }
        return node;
      }

      function progressBar(value, color, label) {
        if (jellyOk) {
          return make("jelly-progress", { value: Math.round(value), size: "small", label, vars: { "jelly-accent": color } });
        }
        const track = make("div", { style: { blockSize: "10px", borderRadius: "1e5px", background: "var(--line-strong)", overflow: "hidden" } });
        track.append(make("i", { style: { display: "block", blockSize: "100%", background: color, inlineSize: value + "%" } }));
        return track;
      }

      function textField(kind, opts = {}) {
        const tag = jellyOk ? (kind === "textarea" ? "jelly-textarea" : "jelly-input") : kind;
        const node = make(tag, {
          label: opts.label,
          placeholder: opts.placeholder,
          rows: opts.rows,
          class: jellyOk ? undefined : "plain",
          "no-autofill": jellyOk,
          on: opts.onInput ? { input: (e) => opts.onInput(e.target.value) } : undefined
        });
        if (jellyOk) {
          if (opts.value) node.setAttribute("value", opts.value);
        } else {
          node.value = opts.value || "";
          if (kind === "input") node.type = "search";
        }
        return node;
      }

      function card(children) {
        const node = make(jellyOk ? "jelly-card" : "div", { class: jellyOk ? undefined : "surface" });
        children.filter(Boolean).forEach((child) => node.append(child));
        return node;
      }

      /* ---------------- page chrome, built from the manifest ---------------- */

      const refs = {};

      function buildChrome() {
        shell.replaceChildren();

        refs.modeSwitch = make("div", { class: "row" });
        shell.append(
          make("header", { class: "row masthead" }, [
            make("div", {}, [make("span", { class: "kicker", text: APP.kicker }), make("h1", { text: APP.title })]),
            make("div", { class: "push" }, [refs.modeSwitch])
          ])
        );

        refs.pct = make("span", { text: "0" });
        refs.headlineBadges = make("div", { class: "row push" });
        refs.overallBar = make("div");
        refs.subjectGrid = make("div", { class: "subject-grid" });

        shell.append(
          card([
            make("div", { class: "dash" }, [
              make("div", { class: "row" }, [
                make("div", { class: "score" }, [refs.pct, document.createTextNode("%"), make("br"), make("small", { text: COPY.scoreCaption })]),
                refs.headlineBadges
              ]),
              refs.overallBar,
              refs.subjectGrid
            ])
          ])
        );

        refs.searchSlot = make("div", { class: "grow" });
        refs.subjectChips = make("div", { class: "row" });
        refs.controls = make("div", { class: "row" }, [refs.searchSlot, refs.subjectChips]);
        shell.append(refs.controls);

        refs.panels = {};
        refs.tabPanels = {};
        const tabs = make(jellyOk ? "jelly-tabs" : "div", { id: "tabs", size: APP.tabSize });
        APP.tabs.forEach((tab) => {
          const content = make("div", { style: { marginBlockStart: "var(--size-3)" } });
          refs.panels[tab.id] = content;
          const panel = make(jellyOk ? "jelly-tab-panel" : "section", {
            label: tab.label,
            value: tab.id,
            active: tab.id === APP.defaultTab
          }, [tab.id === "track" ? buildTrackPanel(content) : content]);
          refs.tabPanels[tab.id] = panel;
          tabs.append(panel);
        });
        tabs.addEventListener("change", (e) => setView(e.target.value || APP.defaultTab));

        /* Without the library there is no tab bar, so supply a plain one and
           switch the panels by hand. Otherwise only the first tab is reachable. */
        if (!jellyOk) {
          refs.fallbackTabs = make("div", { class: "row" }, APP.tabs.map((tab) =>
            button(tab.label, { onClick: () => setView(tab.id) })
          ));
          shell.append(refs.fallbackTabs);
        }
        shell.append(tabs);

        shell.append(
          make("div", { class: "row" }, [
            button(COPY.exportButton, { variant: "mint", onClick: exportProgress }),
            button(COPY.importButton, { variant: "azure", onClick: () => refs.importFile.click() }),
            button(COPY.resetButton, { variant: "platinum", onClick: resetProgress }),
            (refs.importFile = make("input", {
              type: "file",
              accept: APP.export.mimeType + ",.json",
              class: "sr",
              on: {
                change: (e) => {
                  const file = e.target.files && e.target.files[0];
                  if (file) handleImportFile(file);
                  e.target.value = "";
                }
              }
            }))
          ])
        );

        const foot = make("p", { class: "foot" });
        COPY.footer.forEach((part) => {
          foot.append(part.href ? make("a", { href: part.href, text: part.text, target: part.href.startsWith("http") ? "_blank" : undefined, rel: "noopener" }) : document.createTextNode(part.text));
        });
        shell.append(foot);

        buildOverlays();
      }

      function buildTrackPanel(content) {
        const t = APP.track;
        refs.zoomLabel = make("span", { text: "100%" });
        refs.canvas = make("div", { class: "canvas" });

      /* ---------------- track map ---------------- */

      let layout = null;

      function computeLayout() {
        const t = APP.track;
        const stages = M.stages.map((s) => s.id);
        const positions = new Map();
        const lanes = [];
        let y = t.padBlock;

        M.laneOrder.forEach((subjectKey) => {
          const cells = stages.map((stageId) =>
            NODES.filter((n) => n.subject === subjectKey && n.stage === stageId).sort((a, b) =>
              TOPOLOGICAL_RANK.get(a.id) - TOPOLOGICAL_RANK.get(b.id)
            )
          );
          const rows = Math.max(1, ...cells.map((c) => c.length));
          const height = rows * t.nodeHeight + (rows - 1) * t.rowGap;

          cells.forEach((cell, stageIdx) => {
            cell.forEach((node, rowIdx) => {
              positions.set(node.id, {
                x: t.padInline + stageIdx * (t.nodeWidth + t.columnGap),
                y: y + rowIdx * (t.nodeHeight + t.rowGap)
              });
            });
          });

          lanes.push({ subject: subjectKey, top: y, height });
          y += height + t.laneGap;
        });

        layout = {
          positions,
          lanes,
          width: t.padInline * 2 + stages.length * t.nodeWidth + (stages.length - 1) * t.columnGap,
          height: y + t.rowGap
        };
      }

      function buildTrackChrome() {
        const t = APP.track;
        refs.canvas.querySelectorAll(".lane-label, .stage-label, .lane-band").forEach((n) => n.remove());

        M.stages.forEach((stage, i) => {
          refs.canvas.append(
            make("div", {
              class: "stage-label",
              text: fill(COPY.stageNumber, { id: stage.id }),
              style: { insetInlineStart: t.padInline + i * (t.nodeWidth + t.columnGap) + "px", insetBlockStart: "14px", inlineSize: t.nodeWidth + "px" }
            }, [make("b", { text: stage.name })])
          );
        });

        layout.lanes.forEach((lane) => {
          refs.canvas.append(
            make("div", { class: "lane-band", style: { insetBlockStart: lane.top - t.laneGap / 2 + "px", inlineSize: layout.width + "px" } }),
            make("div", {
              class: "lane-label",
              text: M.subjects[lane.subject].name,
              vars: { c: M.subjects[lane.subject].color },
              style: { insetInlineStart: t.laneLabelInset + "px", insetBlockStart: lane.top + "px", inlineSize: t.padInline - t.laneLabelInset * 2 + "px" }
            })
          );
        });
      }

      function renderTrack() {
        const t = APP.track;
        const e = t.edge;
        const upstream = selectedId ? ancestorsOf(selectedId) : new Set();
        const downstream = selectedId ? descendantsOf(selectedId) : new Set();
        Object.assign(refs.canvas.style, { inlineSize: layout.width + "px", blockSize: layout.height + "px" });
        refs.edges.setAttribute("width", layout.width);
        refs.edges.setAttribute("height", layout.height);
        refs.edges.setAttribute("viewBox", "0 0 " + layout.width + " " + layout.height);

        const paths = [];
        NODES.forEach((node) => {
          const to = layout.positions.get(node.id);
          node.requires.forEach((reqId) => {
            const from = layout.positions.get(reqId);
            const source = BY_ID.get(reqId);
            if (!from || !to || !source) return;
            const sameStage = from.x === to.x;
            const x1 = sameStage ? from.x : from.x + t.nodeWidth;
            const y1 = from.y + t.nodeHeight / 2;
            const x2 = to.x;
            const y2 = to.y + t.nodeHeight / 2;
            const dx = Math.max(e.minCurve, (x2 - x1) * e.curve);
            const upstreamEdge = selectedId && upstream.has(reqId) && (node.id === selectedId || upstream.has(node.id));
            const downstreamEdge = selectedId && downstream.has(node.id) && (reqId === selectedId || downstream.has(reqId));
            const active = upstreamEdge || downstreamEdge;
            const visible = isVisible(node) && isVisible(source);
            const path = sameStage
              ? "M " + x1 + " " + y1 + " C " + (x1 - e.sameStageOffset) + " " + y1 + ", " + (x2 - e.sameStageOffset) + " " + y2 + ", " + x2 + " " + y2
              : "M " + x1 + " " + y1 + " C " + (x1 + dx) + " " + y1 + ", " + (x2 - dx) + " " + y2 + ", " + x2 + " " + y2;
            const stroke = upstreamEdge ? e.upstreamColor : downstreamEdge ? e.downstreamColor : M.subjects[source.subject].color;
            paths.push(
              '<path d="' + path +
                '" fill="none" stroke-linecap="round" stroke="' + stroke +
                '" stroke-width="' + (active ? e.widthActive : e.widthIdle) +
                '" opacity="' + (active ? e.opacityActive : selectedId ? e.opacityHidden : visible ? e.opacityIdle : e.opacityHidden) + '" />'
            );
          });
        });
        refs.edges.innerHTML = paths.join("");

        refs.canvas.querySelectorAll(".node").forEach((n) => n.remove());
        NODES.forEach((node) => {
          const pos = layout.positions.get(node.id);
          const status = statusFor(node.id);
          const locked = !isUnlocked(node);
          const graphClass = !selectedId || node.id === selectedId
            ? ""
            : upstream.has(node.id)
              ? " upstream"
              : downstream.has(node.id)
                ? " downstream"
                : " unrelated";

          const btn = make("button", {
            class: "node" + (locked ? " locked" : "") + (isVisible(node) ? "" : " dim") + graphClass + (selectedId === node.id ? " selected" : ""),
            "data-node-id": node.id,
            "data-readiness": locked ? "blocked" : "ready",
            vars: { c: M.subjects[node.subject].color, s: status.color, upstream: e.upstreamColor, downstream: e.downstreamColor },
            style: { insetInlineStart: pos.x + "px", insetBlockStart: pos.y + "px", inlineSize: t.nodeWidth + "px", blockSize: t.nodeHeight + "px" },
            on: { click: () => select(node.id) }
          }, [
            status.id === APP.rules.newStatus ? null : make("span", { class: "tint" }),
            make("span", { class: "n-title", text: node.title }),
            make("span", { class: "n-meta" }, [make("i", { class: "dot" }), document.createTextNode(node.id + " · " + (locked ? COPY.blockedBadge : COPY.readyBadge))])
          ]);
          refs.canvas.append(btn);
        });

        applyZoom();
      }

      function applyZoom() {
        refs.canvas.style.transform = "scale(" + zoom + ")";
        Object.assign(refs.zoomWrap.style, { inlineSize: layout.width * zoom + "px", blockSize: layout.height * zoom + "px" });
        refs.zoomLabel.textContent = Math.round(zoom * 100) + "%";
      }

      function nudgeZoom(delta) {
        zoom = Math.min(APP.zoom.max, Math.max(APP.zoom.min, zoom + delta));
        applyZoom();
      }

      function fitZoom() {
        const available = refs.viewport.clientWidth - APP.track.fitInset;
        if (available <= 0) return;
        zoom = Math.min(APP.zoom.fitMax, Math.max(APP.zoom.min, available / layout.width));
        applyZoom();
      }

      class ResourceValidationError extends Error {}

      function requireObject(value, label) {
        if (!value || typeof value !== "object" || Array.isArray(value)) throw new ResourceValidationError(label + " must be an object");
        return value;
      }

      function requireKeys(value, keys, label) {
        requireObject(value, label);
        if (Object.keys(value).sort().join("|") !== [...keys].sort().join("|")) throw new ResourceValidationError(label + " has unexpected fields");
      }

      function requireText(value, label) {
        if (typeof value !== "string" || !value.trim()) throw new ResourceValidationError(label + " must be non-empty text");
      }

      function requireHttps(value, label) {
        requireText(value, label);
        let parsed;
        try { parsed = new URL(value); } catch { throw new ResourceValidationError(label + " must be an absolute URL"); }
        if (parsed.protocol !== "https:") throw new ResourceValidationError(label + " must use HTTPS");
      }

      function resolveResourcePath(relative, baseUrl, rootUrl) {
        requireText(relative, "Resource path");
        if (relative.includes("\\") || relative.startsWith("/") || relative.includes("?") || relative.includes("#") || relative.split("/").some((part) => !part || part === "." || part === "..")) {
          throw new ResourceValidationError("Unsafe resource path");
        }
        const resolved = new URL(relative, baseUrl);
        if (!resolved.href.startsWith(rootUrl.href)) throw new ResourceValidationError("Resource path leaves its root");
        return resolved;
      }

      async function fetchJson(url, label) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(label + " request failed");
        try { return await response.json(); } catch { throw new ResourceValidationError(label + " is not valid JSON"); }
      }

      async function fetchText(url, label) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(label + " request failed");
        return response.text();
      }

      function validateCatalog(catalog) {
        requireKeys(catalog, ["schemaVersion", "topics"], "Catalog");
        if (catalog.schemaVersion !== APP.support.schemaVersion) throw new ResourceValidationError("Unsupported catalog schema");
        requireObject(catalog.topics, "Catalog topics");
        for (const [id, value] of Object.entries(catalog.topics)) {
          const node = BY_ID.get(id);
          if (!node) throw new ResourceValidationError("Catalog contains an unknown topic");
          requireText(value, "Catalog topic path");
          if (value !== "topics/" + node.subject + "/" + id.toLowerCase() + "/topic.json") throw new ResourceValidationError("Catalog topic path does not match its curriculum topic");
        }
        return catalog;
      }

      function validateTopicRecord(topic, expectedId) {
        requireKeys(topic, ["schemaVersion", "topicId", "summary", "explainPrompt", "links", "wikipedia"], "Topic record");
        if (topic.schemaVersion !== APP.support.schemaVersion || topic.topicId !== expectedId) throw new ResourceValidationError("Topic record does not match the catalog");
        requireText(topic.summary, "Summary path");
        requireText(topic.explainPrompt, "Prompt path");
        if (!Array.isArray(topic.links) || topic.links.length < APP.support.minLinks) throw new ResourceValidationError("Topic does not have enough supporting links");
        const urls = new Set();
        for (const link of topic.links) {
          requireKeys(link, ["label", "url", "publisher", "kind", "note"], "Supporting link");
          for (const field of ["label", "publisher", "kind", "note"]) requireText(link[field], "Supporting link " + field);
          if (!APP.support.linkKinds.includes(link.kind)) throw new ResourceValidationError("Unsupported supporting link kind");
          requireHttps(link.url, "Supporting link URL");
          if (urls.has(link.url)) throw new ResourceValidationError("Duplicate supporting link URL");
          urls.add(link.url);
        }
        requireKeys(topic.wikipedia, ["label", "url"], "Wikipedia link");
        requireText(topic.wikipedia.label, "Wikipedia label");
        requireHttps(topic.wikipedia.url, "Wikipedia URL");
        if (new URL(topic.wikipedia.url).hostname !== APP.support.wikipediaHost) throw new ResourceValidationError("Unexpected Wikipedia host");
        if (urls.has(topic.wikipedia.url)) throw new ResourceValidationError("Wikipedia must be separate from supporting links");
        return topic;
      }

      function validatePaperGraph(graph) {
        requireKeys(graph, ["schemaVersion", "nodes", "edges"], "Paper graph");
        if (graph.schemaVersion !== APP.support.schemaVersion || !Array.isArray(graph.nodes) || !Array.isArray(graph.edges)) throw new ResourceValidationError("Invalid paper graph");
        const nodes = new Map();
        graph.nodes.forEach((paper) => {
          requireKeys(paper, ["id", "type", "board", "qualification", "series", "component", "tier", "urls"], "Paper");
          if (paper.type !== "past-paper" || typeof paper.id !== "string" || !paper.id.startsWith("paper:")) throw new ResourceValidationError("Invalid paper node");
          for (const field of ["board", "qualification", "series", "component", "tier"]) requireText(paper[field], "Paper " + field);
          requireKeys(paper.urls, ["questionPaper", "markScheme"], "Paper URLs");
          requireHttps(paper.urls.questionPaper, "Question paper URL");
          requireHttps(paper.urls.markScheme, "Mark scheme URL");
          if (nodes.has(paper.id)) throw new ResourceValidationError("Duplicate paper node");
          nodes.set(paper.id, paper);
        });
        const edgeKeys = new Set();
        graph.edges.forEach((edge) => {
          requireKeys(edge, edge.pages === undefined ? ["from", "to", "questions", "note"] : ["from", "to", "questions", "pages", "note"], "Paper edge");
          if (!nodes.has(edge.from) || typeof edge.to !== "string" || !edge.to.startsWith("topic:") || !BY_ID.has(edge.to.slice(6))) throw new ResourceValidationError("Invalid paper edge");
          if (!Array.isArray(edge.questions) || !edge.questions.length || edge.questions.some((question) => typeof question !== "string" || !question.trim()) || new Set(edge.questions).size !== edge.questions.length) throw new ResourceValidationError("Paper edge has invalid questions");
          if (edge.pages !== undefined && (!Array.isArray(edge.pages) || !edge.pages.length || edge.pages.some((page) => !Number.isInteger(page) || page < 1))) throw new ResourceValidationError("Paper edge has invalid pages");
          requireText(edge.note, "Paper edge note");
          const edgeKey = edge.from + "\0" + edge.to;
          if (edgeKeys.has(edgeKey)) throw new ResourceValidationError("Duplicate paper-to-topic edge");
          edgeKeys.add(edgeKey);
        });
        return { ...graph, byId: nodes };
      }

      function validateMarkdownSource(source) {
        requireText(source, "Markdown");
        if (new TextEncoder().encode(source).byteLength > APP.support.maxMarkdownBytes || /<\/?[A-Za-z][^>]*>/.test(source) || /^\s*>/m.test(source) || /^\s*\|.*\|\s*$/m.test(source) || /!\[[^\]]*\]\(/.test(source) || /^\s*- \[[ xX]\]/m.test(source) || /^#{4,}\s/m.test(source) || /^\s*(?:-{3,}|_{3,}|\*{3,})\s*$/m.test(source) || /~~/.test(source)) {
          throw new ResourceValidationError("Unsupported Markdown source");
        }
        for (const match of source.matchAll(/\[[^\]]+\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g)) requireHttps(match[1], "Markdown link");
        return source;
      }

      function loadSupportCatalog() {
        if (!catalogPromise) {
          const url = new URL(APP.support.catalogUrl, location.href);
          catalogPromise = fetchJson(url, "Catalog").then((catalog) => ({ catalog: validateCatalog(catalog), url, root: new URL("./", url) }));
        }
        return catalogPromise;
      }

      function loadPaperGraph() {
        if (!paperPromise) {
          const url = new URL(APP.support.papersUrl, location.href);
          paperPromise = fetchJson(url, "Paper graph").then(validatePaperGraph);
        }
        return paperPromise;
      }

      async function loadTopicResources(topicId) {
        if (topicResourceCache.has(topicId)) return topicResourceCache.get(topicId);
        const { catalog, url, root } = await loadSupportCatalog();
        const recordPath = catalog.topics[topicId];
        if (!recordPath) throw new Error("Topic support is not published");
        const recordUrl = resolveResourcePath(recordPath, url, root);
        const topic = validateTopicRecord(await fetchJson(recordUrl, "Topic record"), topicId);
        const topicRoot = new URL("./", recordUrl);
        const summaryUrl = resolveResourcePath(topic.summary, recordUrl, topicRoot);
        const promptUrl = resolveResourcePath(topic.explainPrompt, recordUrl, topicRoot);
        const [summarySource, promptSource] = await Promise.all([fetchText(summaryUrl, "Summary"), fetchText(promptUrl, "Prompt")]);
        const resources = { topic, summarySource: validateMarkdownSource(summarySource), promptSource: validateMarkdownSource(promptSource) };
        topicResourceCache.set(topicId, resources);
        return resources;
      }

      function markdownTokensSafe(tokens) {
        for (const token of tokens) {
          if (token.type === "html") return false;
          if (token.href && new URL(token.href, location.href).protocol !== "https:") return false;
          if (token.tokens && !markdownTokensSafe(token.tokens)) return false;
          if (token.items && !markdownTokensSafe(token.items)) return false;
        }
        return true;
      }

      function renderMarkdown(source) {
        validateMarkdownSource(source);
        if (!window.marked) throw new Error("Marked unavailable");
        const tokens = window.marked.lexer(source, { gfm: true, breaks: false });
        if (!markdownTokensSafe(tokens)) throw new ResourceValidationError("Unsafe Markdown tokens");
        const template = document.createElement("template");
        template.innerHTML = window.marked.parse(source, { gfm: true, breaks: false });
        const allowedTags = new Set(["A", "P", "H1", "H2", "H3", "EM", "STRONG", "UL", "OL", "LI", "CODE", "PRE", "BR"]);
        for (const element of template.content.querySelectorAll("*")) {
          if (!allowedTags.has(element.tagName)) throw new ResourceValidationError("Unsupported rendered Markdown element");
          const allowedAttributes = element.tagName === "A" ? new Set(["href"]) : element.tagName === "CODE" ? new Set(["class"]) : new Set();
          for (const attribute of [...element.attributes]) if (!allowedAttributes.has(attribute.name)) throw new ResourceValidationError("Unsupported rendered Markdown attribute");
          if (element.tagName === "CODE" && element.hasAttribute("class") && !/^language-[a-z0-9_-]+$/i.test(element.className)) throw new ResourceValidationError("Unsafe rendered code class");
          if (element.tagName === "A") {
            const parsed = new URL(element.getAttribute("href"), location.href);
            if (parsed.protocol !== "https:") throw new ResourceValidationError("Unsafe rendered Markdown link");
            element.href = parsed.href;
            element.target = "_blank";
            element.rel = "noopener noreferrer";
          }
        }
        return template.content;
      }

      async function copyExplainPrompt(source, resultNode) {
        try {
          await navigator.clipboard.writeText(source);
          resultNode.textContent = COPY.copySuccess;
        } catch {
          resultNode.textContent = COPY.copyFailure;
        }
        window.setTimeout(() => { resultNode.textContent = ""; }, APP.timing.copyResultResetMs);
      }

      function externalLink(link) {
        return make("a", { class: "support-link", href: link.url, target: "_blank", rel: "noopener noreferrer" }, [
          make("strong", { text: link.label }),
          link.publisher ? make("span", { class: "support-status", text: fill(COPY.resourcePublisher, { publisher: link.publisher, kind: link.kind }) }) : null,
          link.note ? make("span", { class: "support-status", text: link.note }) : null
        ]);
      }

      function markdownPreview(source) {
        const preview = make("div", { class: "support-markdown" });
        try { preview.append(renderMarkdown(source)); }
        catch (error) { preview.replaceChildren(make("p", { class: "support-status", text: window.marked ? COPY.supportInvalid : COPY.markedUnavailable })); }
        return preview;
      }

      function renderSupportResources(node) {
        const token = ++selectionToken;
        const topicId = node.id;
        supportState.topicId = topicId;
        supportState.topic = "loading";
        supportState.papers = "loading";
        const topicSection = make("section", { class: "support-section", "data-support-topic": topicId }, [
          make("h3", { text: COPY.supportTitle }),
          make("p", { class: "support-status", text: COPY.supportLoading })
        ]);
        const paperSection = make("section", { class: "support-section", "data-support-papers": topicId }, [
          make("h3", { text: COPY.papersTitle }),
          make("p", { class: "support-status", text: COPY.papersLoading })
        ]);
        refs.detailBody.append(make("div", { class: "support" }, [topicSection, paperSection]));

        loadTopicResources(topicId).then(({ topic, summarySource, promptSource }) => {
          if (selectedId !== topicId || selectionToken !== token) return;
          supportState.topic = "ready";
          const result = make("span", { class: "support-status", "aria-live": "polite" });
          topicSection.replaceChildren(
            make("h3", { text: COPY.summaryTitle }),
            markdownPreview(summarySource),
            make("h3", { text: COPY.promptTitle }),
            markdownPreview(promptSource),
            make("div", { class: "support-actions" }, [button(COPY.copyPrompt, { variant: "azure", onClick: () => copyExplainPrompt(promptSource, result) }), result]),
            make("h3", { text: COPY.linksTitle }),
            make("div", { class: "support-links" }, topic.links.map(externalLink)),
            make("h3", { text: COPY.wikipediaTitle }),
            externalLink(topic.wikipedia)
          );
        }).catch((error) => {
          if (selectedId !== topicId || selectionToken !== token) return;
          supportState.topic = error instanceof ResourceValidationError ? "invalid" : "unavailable";
          topicSection.replaceChildren(make("h3", { text: COPY.supportTitle }), make("p", { class: "support-status", text: error instanceof ResourceValidationError ? COPY.supportInvalid : COPY.supportUnavailable }));
        });

        loadPaperGraph().then((graph) => {
          if (selectedId !== topicId || selectionToken !== token) return;
          const edges = graph.edges.filter((edge) => edge.to === "topic:" + topicId);
          supportState.papers = edges.length ? "ready" : "empty";
          paperSection.replaceChildren(make("h3", { text: COPY.papersTitle }));
          if (!edges.length) paperSection.append(make("p", { class: "support-status", text: COPY.papersEmpty }));
          else paperSection.append(make("div", { class: "support-links" }, edges.map((edge) => {
            const paper = graph.byId.get(edge.from);
            return externalLink({
              label: fill(COPY.paperLink, { board: paper.board, series: paper.series, component: paper.component, questions: edge.questions.join(", ") }),
              url: paper.urls.questionPaper,
              note: edge.note
            });
          })));
        }).catch(() => {
          if (selectedId !== topicId || selectionToken !== token) return;
          supportState.papers = "unavailable";
          paperSection.replaceChildren(make("h3", { text: COPY.papersTitle }), make("p", { class: "support-status", text: COPY.papersUnavailable }));
        });
      }

      function renderDetail() {
        refs.detailBody.replaceChildren();
        if (!selectedId) return;

        const node = BY_ID.get(selectedId);
        const entry = progress[node.id] || {};
        const status = statusFor(node.id);
        const subject = M.subjects[node.subject];
        const stage = M.stages.find((s) => s.id === node.stage);
        const driver = M.drivers.find((d) => d.id === node.driver);
        const L = COPY.factLabels;

        refs.detailBody.append(
          make("h2", { text: node.title }),
          make("div", { class: "row" }, [
            badge(subject.name, { fill: subject.color, label: subject.labelColor, size: "small" }),
            badge(node.id, { variant: "platinum", size: "small", outline: true }),
            badge(fill(COPY.stageBadge, { id: stage.id, name: stage.name }), { variant: "platinum", size: "small", outline: true }),
            badge(isUnlocked(node) ? COPY.readyBadge : COPY.blockedBadge, { fill: isUnlocked(node) ? STATUS.get(APP.rules.masteredStatus).color : APP.accent, size: "small" })
          ].filter(Boolean)),
          readinessRow(node),
          make("div", { class: "caption", text: COPY.statusPrompt }),
          make("div", { class: "status-row" }, STATUS_IDS.map((sid) => {
            const s = STATUS.get(sid);
            const active = status.id === sid;
            return button(fill(COPY.statusButton, { label: s.label, note: s.note }), {
              fill: active ? s.color : undefined,
              label: s.labelColor,
              variant: active ? undefined : "platinum",
              block: true,
              onClick: () => setStatus(node.id, sid)
            });
          })),
          make("div", { class: "facts" }, [
            fact(L.spec, node.spec),
            fact(L.f1, node.f1, true),
            fact(L.diy, node.diy),
            fact(L.check, node.check),
            driver ? fact(L.driver, fill(COPY.driverFact, driver)) : null
          ].filter(Boolean))
        );

        refs.detailBody.append(directPrerequisiteList(node), prerequisiteSequence(node));
        const unlocks = UNLOCKS.get(node.id);
        if (unlocks.length) refs.detailBody.append(linkFact(COPY.unlocksLabel, unlocks));

        renderSupportResources(node);

        refs.detailBody.append(
          make("div", { class: "caption", text: COPY.notesPrompt }),
          textField("textarea", {
            label: COPY.notesLabel,
            rows: 4,
            value: entry.notes || "",
            placeholder: COPY.notesPlaceholder,
            onInput: (value) => setNotes(node.id, value)
          })
        );

        if (entry.updatedAt) {
          refs.detailBody.append(make("div", { class: "stamp", text: fill(COPY.lastUpdated, { when: new Date(entry.updatedAt).toLocaleString() }) }));
        }
        refs.detailBody.append(button(COPY.closeButton, { variant: "platinum", block: true, onClick: closeDetail }));
      }

      function linkFact(title, ids) {
        return make("div", { class: "fact" }, [
          make("h3", { text: title }),
          make("div", { class: "links" }, ids.map((id) => (BY_ID.has(id) ? topicChip(id, BY_ID.get(id).title) : null)).filter(Boolean))
        ]);
      }

      function directPrerequisiteList(node) {
        if (!node.requires.length) return fact(COPY.directPrerequisitesLabel, COPY.noPrerequisites);
        const ids = node.requires.slice().sort((a, b) => Number(isMet(a)) - Number(isMet(b)) || TOPOLOGICAL_RANK.get(a) - TOPOLOGICAL_RANK.get(b));
        return make("div", { class: "fact" }, [
          make("h3", { text: COPY.directPrerequisitesLabel }),
          make("ul", { class: "prereq-list" }, ids.map((id) => {
            const met = isMet(id);
            return make("li", { class: "prereq-item", "data-prerequisite-id": id }, [
              topicChip(id, BY_ID.get(id).title),
              make("strong", { text: fill(COPY.prerequisiteState, { status: statusFor(id).label, state: met ? COPY.prerequisiteMet : COPY.prerequisiteBlocking }) })
            ]);
          }))
        ]);
      }

      function prerequisiteSequence(node) {
        const unmet = unmetPrerequisites(node.id);
        return make("div", { class: "fact", "data-learning-sequence": node.id }, [
          make("h3", { text: COPY.doFirstLabel }),
          unmet.length
            ? make("ol", { class: "learning-sequence" }, unmet.map((item) => make("li", {}, [topicChip(item.id, item.id + " " + item.title)])))
            : make("p", { text: COPY.doFirstClear })
        ]);
      }

      /* ---------------- import and export ---------------- */

      function exportProgress() {
        const payload = {
          app: APP.id,
          version: APP.storage.schemaVersion,
          exportedAt: new Date().toISOString(),
          summary: {
            topics: NODES.length,
            points: NODES.reduce((sum, n) => sum + statusFor(n.id).points, 0),
            maxPoints: MAX_POINTS
          },
          progress
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: APP.export.mimeType });
        const url = URL.createObjectURL(blob);
        const a = make("a", { href: url, download: APP.export.filePrefix + "-" + new Date().toISOString().slice(0, 10) + ".json" });
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), APP.timing.revokeObjectUrlMs);
      }

      async function handleImportFile(file) {
        let parsed;
        try {
          parsed = JSON.parse(await file.text());
        } catch (err) {
          window.alert(COPY.importBadJson);
          return;
        }
        const source = parsed && typeof parsed === "object" && parsed.progress ? parsed.progress : parsed;
        const { entries, skipped } = sanitise(source);
        const count = Object.keys(entries).length;
        if (!count) {
          window.alert(COPY.importNothingUsable);
          return;
        }
        pendingImport = entries;
        refs.importSummary.textContent = fill(skipped ? COPY.importSummarySkipped : COPY.importSummary, { count, skipped });
        toggleImportSheet(true);
      }

      function toggleImportSheet(open) {
        if (jellyOk) refs.importSheet.open = open;
        else if (open) refs.importSheet.setAttribute("open", "");
        else refs.importSheet.removeAttribute("open");
      }

      function applyImport(mode) {
        if (!pendingImport) return;
        if (mode === "replace") {
          progress = pendingImport;
        } else {
          for (const [id, incoming] of Object.entries(pendingImport)) {
            const existing = progress[id];
            if (!existing || new Date(incoming.updatedAt) >= new Date(existing.updatedAt || 0)) progress[id] = incoming;
          }
        }
        pendingImport = null;
        saveProgress();
        toggleImportSheet(false);
        renderStats();
        renderView();
        renderDetail();
      }

      function resetProgress() {
        if (!window.confirm(COPY.resetConfirm)) return;
        progress = {};
        saveProgress();
        closeDetail();
        renderStats();
        renderView();
      }

      /* ---------------- views ---------------- */

      /* Views the app implements itself, plus one generic renderer for every tab
         that declares a "page" in the manifest. */
      const VIEW_RENDERERS = { track: renderTrack, list: renderList, garage: renderGarage };
      const PAGE_TABS = new Map(APP.tabs.filter((t) => t.page).map((t) => [t.id, t.page]));

      function renderView() {
        if (PAGE_TABS.has(view)) renderPage(view, PAGE_TABS.get(view));
        else (VIEW_RENDERERS[view] || (() => {}))();
        /* Search and subject filters only apply to the roadmap views. */
        refs.controls.hidden = PAGE_TABS.has(view);
      }

      function setView(next) {
        view = next;
        if (!jellyOk) {
          for (const [id, panel] of Object.entries(refs.tabPanels)) panel.hidden = id !== view;
          [...refs.fallbackTabs.children].forEach((btn, i) => {
            btn.style.opacity = APP.tabs[i].id === view ? "1" : "0.55";
          });
        }
        renderView();
        if (view === "track") requestAnimationFrame(fitZoom);
      }

      /* ---------------- boot ---------------- */

      buildThemeStyles();
      buildChrome();
      applyMode();
      renderModeSwitch();
      renderSubjectChips();

      refs.searchSlot.append(
        textField("input", {
          label: COPY.searchLabel,
          placeholder: COPY.searchPlaceholder,
          onInput: (value) => {
            query = value.trim().toLowerCase();
            renderView();
          }
        })
      );

      computeLayout();
      buildTrackChrome();
      renderStats();
      setView(APP.defaultTab);

      darkQuery.addEventListener("change", () => {
        if (modePref === "auto") {
          applyMode();
          renderView();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && selectedId) closeDetail();
      });

      let resizeTimer = null;
      window.addEventListener("resize", () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(() => {
          if (view === "track") fitZoom();
          refs.drawer.setAttribute("side", wideQuery.matches ? "end" : "bottom");
        }, APP.timing.resizeDebounceMs);
      });
      }
    </script>
  </body>
</html>
