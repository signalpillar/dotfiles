<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prototypes</title>
    <link rel="stylesheet" href="prototype-base.css">
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #f7f3ea;
        --ink: #172033;
        --muted: #5d6678;
        --card: #fffdf8;
        --line: rgba(23, 32, 51, 0.14);
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.1);
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(147, 197, 253, 0.34), transparent 32rem),
          linear-gradient(135deg, #fffaf0 0%, #f7f3ea 52%, #edf4ff 100%);
        color: var(--ink);
      }

      main {
        width: min(44rem, 100%);
        margin: 0 auto;
        padding: 1.75rem 1rem 3rem;
      }

      .hero {
        margin-bottom: 1.5rem;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 0.25rem;
        font-size: clamp(1.6rem, 7vw, 2.4rem);
        letter-spacing: -0.04em;
      }

      h2 {
        margin-bottom: 0.65rem;
        font-size: 1rem;
        letter-spacing: -0.02em;
      }

      .intro,
      .section-note {
        color: var(--muted);
        line-height: 1.45;
      }

      .intro {
        margin-bottom: 0;
        font-size: 0.95rem;
      }

      .section {
        display: grid;
        gap: 0.7rem;
        margin-top: 1.5rem;
      }

      .item-list {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: 0.9rem;
        background: color-mix(in srgb, var(--card) 78%, transparent);
        overflow: hidden;
      }

      a.item-card {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.18rem 0.55rem;
        padding: 0.72rem 0.9rem;
        color: inherit;
        text-decoration: none;
        border-block-end: 1px solid var(--line);
        background: transparent;
      }

      .item-list a.item-card:last-child {
        border-block-end: none;
      }

      a.item-card:focus-visible,
      a.item-card:hover {
        background: var(--accent-soft);
        outline: none;
      }

      .item-card strong {
        flex: none;
        font-size: 0.94rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .item-card span {
        flex: 1 1 14rem;
        min-width: 0;
        color: var(--muted);
        font-size: 0.84rem;
        line-height: 1.4;
      }

      .item-card .meta {
        flex: none;
        padding: 0.16rem 0.48rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.74rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <header class="hero">
        <h1 id="page-title"></h1>
        <p class="intro" id="page-intro"></p>
      </header>

      <div id="sections"></div>
    </main>

    <script type="application/json" id="index-manifest">
      {
        "title": "Prototypes",
        "intro": "Small self-contained HTML prototypes published as static GitHub Pages files.",
        "sections": [
          {
            "id": "prototypes",
            "type": "link-list",
            "title": "Prototype apps",
            "label": "Available prototypes",
            "items": [
              {
                "title": "Mind Map Viewer",
                "url": "mindmap-viewer.html",
                "description": "Markdown outline rendered as a pannable, zoomable mind map."
              },
              {
                "title": "Modern LLM Timelines",
                "url": "llm-lifecycle-timelines.html",
                "description": "Model development and inference stages as an explorable timeline."
              },
              {
                "title": "Jump Rope Interval Timer",
                "url": "jump-rope-interval-timer.html",
                "description": "Work and break interval timer with round tracking."
              },
              {
                "title": "Browser LLM Chat",
                "url": "browser-llm-chat.html",
                "description": "Chat with a small LLM running entirely in-browser via WebGPU."
              },
              {
                "title": "Meeting Cost Meter",
                "url": "meeting-cost-meter.html",
                "description": "Live money burn meter for meetings, by headcount and hourly rate."
              },
              {
                "title": "Context Kit",
                "url": "context-kit.html",
                "description": "Assemble, tag, and reorder prompt context for AI coding sessions."
              },
              {
                "title": "AI Coding Playbook",
                "url": "ai-coding-playbook.html",
                "description": "Checklist of AI coding practices with progress tracking."
              },
              {
                "title": "Voice Kit",
                "url": "voice-kit.html",
                "description": "In-browser speech-to-text and text-to-speech, local models only."
              },
              {
                "title": "Noise Nudge",
                "url": "noise-nudge.html",
                "description": "Live room loudness meter that counts distracting peaks."
              },
              {
                "title": "GCSE Triple Science: F1 Roadmap",
                "url": "gcse-science-f1-roadmap.html",
                "description": "GCSE science syllabus as a prerequisite graph, linked to Formula 1."
              },
              {
                "title": "Day Mosaic",
                "url": "day-mosaic.html",
                "description": "Daily activity log rendered as a Mondrian-style mosaic grid."
              },
              {
                "title": "FogLAMP Scan Viewer",
                "url": "foglamp-scan-viewer.html",
                "description": "Codebase scan JSON rendered as a local Cytoscape graph."
              },
              {
                "title": "Mortgage Compass",
                "url": "mortgage-compass.html",
                "description": "Visualises mortgage interest vs. ownership, and buying vs. renting."
              },
              {
                "title": "Scorecard Tally",
                "url": "scorecard-tally.html",
                "description": "Sums handwritten score grids and flags mismatches instantly."
              },
              {
                "title": "UK Income Tax Visualiser",
                "url": "uk-tax-visualizer.html",
                "description": "Salary split across UK tax bands, with the marginal band shown."
              },
              {
                "title": "Card Vision Test",
                "url": "symbiosis-card-vision-test.html",
                "description": "In-browser vision model reads a Symbiosis card from a photo; logs accuracy."
              }
            ]
          },
          {
            "id": "bookmarks",
            "type": "link-list",
            "title": "Bookmarks",
            "label": "Saved bookmarks",
            "note": "Useful links that do not belong to one prototype app.",
            "items": [
              {
                "title": "Social Downloader",
                "url": "https://www.socialdownloader.space/",
                "description": "Download social media videos from a browser.",
                "meta": "External bookmark"
              }
            ]
          }
        ]
      }
    </script>

    <script>
      const index = JSON.parse(document.getElementById("index-manifest").textContent);
      const renderers = {
        "link-list": renderLinkList
      };

      document.title = index.title;
      document.getElementById("page-title").textContent = index.title;
      document.getElementById("page-intro").textContent = index.intro;

      const sections = document.getElementById("sections");
      index.sections.forEach((section) => {
        const renderer = renderers[section.type];
        if (!renderer) {
          throw new Error(`No renderer for section type: ${section.type}`);
        }
        sections.append(renderer(section));
      });

      function renderLinkList(section) {
        const root = document.createElement("section");
        root.className = "section";
        root.id = section.id;

        const heading = document.createElement("h2");
        heading.textContent = section.title;
        root.append(heading);

        if (section.note) {
          const note = document.createElement("p");
          note.className = "section-note";
          note.textContent = section.note;
          root.append(note);
        }

        const list = document.createElement("div");
        list.className = "item-list";
        list.setAttribute("aria-label", section.label);

        section.items.forEach((item) => {
          list.append(renderCard(item));
        });

        root.append(list);
        return root;
      }

      function renderCard(item) {
        const card = document.createElement("a");
        card.className = "item-card";
        card.href = item.url;

        if (new URL(item.url, window.location.href).origin !== window.location.origin) {
          card.target = "_blank";
          card.rel = "noreferrer";
        }

        const title = document.createElement("strong");
        title.textContent = item.title;
        card.append(title);

        const description = document.createElement("span");
        description.textContent = item.description;
        card.append(description);

        if (item.meta) {
          const meta = document.createElement("span");
          meta.className = "meta";
          meta.textContent = item.meta;
          card.append(meta);
        }

        return card;
      }
    </script>
  </body>
</html>
