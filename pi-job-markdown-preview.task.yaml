decisions:
- date: '2026-08-03'
  note: Name the subcommand `markdown`; it prints the preview to stdout and does not modify the task.
  source: user-request
- date: '2026-08-03'
  note: Instruction packets must include NEXT ACTION and enter-the-loop guidance so agents continue after
    bootstrap without waiting for 'continue'. Pause only for user-decision steps or blockers.
  source: chat:2026-08-03
- date: '2026-08-03'
  note: 'markdown v1: allow preview without orchestration init; command is markdown with no flags; full-task
    dump to stdout; omit empty optional sections; free-form notes/context in fenced code blocks; escape
    titles/headings; Decisions section is always present and visually prominent (even when empty).'
  source: chat:2026-08-03
- date: '2026-08-03'
  note: 'Markdown document order: title/status/project, then prominent Decisions (dated bullets; empty
    marker if none), then context and remaining metadata, then slices. Omit empty optional sections. Fence
    free-form notes/context; escape titles. Mark the current cursor slice and step inline with a (current)
    badge - do not quarantine orchestration into an appendix.'
  source: chat:2026-08-03
- date: '2026-08-03'
  note: 'Revise earlier no-flags choice: v1 may add one optional sort flag for slices by oldest-changed-first
    (using recorded execution timestamps; slices without execution sort after those with timestamps, preserving
    plan order as tie-break). Default remains plan order.'
  source: chat:2026-08-03
- date: '2026-08-03'
  note: Sort flag name is --chronological. Slice change time = earliest non-empty execution.started/ended
    on the slice or any of its steps/final_steps; missing timestamps sort after; plan order is tie-break.
  source: grill-plan
- date: '2026-08-03'
  note: Render decisions and nested notes as Markdown blockquotes (not code fences). Prefer Markdown when
    recording notes/decisions/context so `pi-job markdown` shows formatting. CLI help and add-decision/finish
    tips prompt for Markdown.
  source: chat:2026-08-03
