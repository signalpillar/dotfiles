    </script>

    <script type="module">
      const M = JSON.parse(document.getElementById("fact-graph-manifest").textContent);
      const C = M.copy;
      const $ = (id) => document.getElementById(id);
      const fill = (tpl, vars = {}) => tpl.replace(/\{(\w+)\}/g, (all, key) => (key in vars ? String(vars[key]) : all));
      const ds = window.datascript && typeof window.datascript.q === "function" ? window.datascript : null;
      const hasCy = typeof window.cytoscape === "function";
      const hasFcose = hasCy && typeof window.cytoscapeFcose === "function";
      if (hasFcose) window.cytoscape.use(window.cytoscapeFcose);

      for (const [key, value] of Object.entries(M.colors)) document.documentElement.style.setProperty(`--fg-${key}`, value);

      const RX = {
        arrow: new RegExp(M.syntax.arrow),
        graphPrefix: new RegExp(M.syntax.graphPrefix),
        worldDate: new RegExp(M.syntax.worldDate),
        titleSep: new RegExp(M.syntax.titleSeparator),
        abbrev: new RegExp(M.syntax.abbreviation),
        slugStrip: new RegExp(M.syntax.slugStrip, "gu")
      };
      const dateFmt = new Intl.DateTimeFormat(M.locale, M.dateFormat);
      const fmtAt = (iso) => dateFmt.format(new Date(iso));

      // ---- Storage --------------------------------------------------------------------------

      let storageOk = true;
      function readJson(key) {
        try {
          const raw = localStorage.getItem(key);
          return raw === null ? undefined : JSON.parse(raw);
        } catch {
          return undefined;
        }
      }
      function writeJson(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {
          if (storageOk) flash(C.storageFailed);
          storageOk = false;
        }
      }
      const newId = () => (crypto.randomUUID ? crypto.randomUUID() : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`);

      // ---- Parsing ---------------------------------------------------------------------------

      const slugify = (text) => text.trim().toLowerCase().replace(RX.slugStrip, "-").replace(/^-+|-+$/g, "");
      const normLabel = (text) => text.trim().toLowerCase().replace(/\s+/g, " ");

      function parseTerm(raw) {
        const text = raw.trim();
        if (!text) return { error: C.errEmptyNode };
        let term;
        if (RX.titleSep.test(text)) {
          const parts = text.split(RX.titleSep).map((part) => part.trim()).filter(Boolean);
          if (!parts.length) return { error: C.errEmptyNode };
          term = { slug: slugify(parts[0]), title: parts.slice(1).join(" ") || null, name: parts[0] };
        } else {
          const abbrev = text.match(RX.abbrev);
          term = abbrev
            ? { slug: slugify(abbrev[2]), title: abbrev[1].trim(), name: abbrev[2].trim() }
            : { slug: slugify(text), title: null, name: text };
        }
        if (!term.slug) return { error: fill(C.errEmptySlug, { text }) };
        return term;
      }

      // Returns null for a blank line, { error } for a bad line, or a fact draft.
      function parseLine(raw, graph) {
        let text = raw.trim();
        if (!text) return null;
        let graphSlug = graph.slug;
        let graphTitle = graph.title;
        const prefix = text.match(RX.graphPrefix);
        if (prefix) {
          graphSlug = slugify(prefix[1]);
          graphTitle = prefix[1];
          text = text.slice(prefix[0].length);
          if (!graphSlug) return { error: C.errGraph };
        }
        let date = null;
        const when = text.match(RX.worldDate);
        if (when) {
          date = when[1];
          text = text.slice(0, when.index);
          if (Number.isNaN(Date.parse(date))) return { error: fill(C.errDate, { date }) };
        }
        const parts = text.split(RX.arrow);
        if (parts.length !== 3) return { error: fill(C.errArrows, { count: parts.length - 1 }) };
        const from = parseTerm(parts[0]);
        const to = parseTerm(parts[2]);
        const label = normLabel(parts[1]);
        const error = from.error || to.error || (label ? null : C.errEmptyLabel);
        if (error) return { error };
        return { graph: graphSlug, graphTitle, from, label, to, date, text: raw.trim() };
      }

      // ---- Log sanitising --------------------------------------------------------------------

      const KINDS = new Set(["fact", "retract", "graph"]);
      const hasIdentity = (e) => e && typeof e.id === "string" && e.id && KINDS.has(e.kind) && typeof e.at === "string" && !Number.isNaN(Date.parse(e.at));
      const cleanTerm = (t) => (t && typeof t.slug === "string" && t.slug
        ? { slug: t.slug, title: typeof t.title === "string" && t.title ? t.title : null, name: typeof t.name === "string" && t.name ? t.name : t.slug }
        : null);

      function sanitizeEntry(e) {
        if (!hasIdentity(e)) return null;
        const base = { id: e.id, kind: e.kind, at: e.at };
        if (e.kind === "retract") return typeof e.target === "string" ? { ...base, target: e.target } : null;
        if (e.kind === "graph") {
          return typeof e.slug === "string" && e.slug ? { ...base, slug: e.slug, title: typeof e.title === "string" && e.title ? e.title : e.slug } : null;
        }
        const from = cleanTerm(e.from);
        const to = cleanTerm(e.to);
        if (!from || !to || typeof e.graph !== "string" || !e.graph || typeof e.label !== "string" || !e.label) return null;
        return {
          ...base,
          graph: e.graph,
          graphTitle: typeof e.graphTitle === "string" && e.graphTitle ? e.graphTitle : e.graph,
          from,
          to,
          label: normLabel(e.label),
          date: typeof e.date === "string" && !Number.isNaN(Date.parse(e.date)) ? e.date : null,
          text: typeof e.text === "string" ? e.text : ""
        };
      }
      const byTime = (a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0);

      function seedEntries() {
        return M.seed.map((item, index) => {
          const id = `seed-${index + 1}`;
          if (item.kind === "graph") return { id, kind: "graph", at: item.at, slug: item.slug, title: item.title };
          const draft = parseLine(item.text, { slug: item.graph, title: item.graph });
          if (!draft || draft.error) throw new Error(`Seed line ${index + 1}: ${draft && draft.error}`);
          return { id, kind: "fact", at: item.at, ...draft };
        });
      }

      // ---- DataScript ------------------------------------------------------------------------

      const SCHEMA = {
        "node/slug": { ":db/unique": ":db.unique/identity" },
        "graph/slug": { ":db/unique": ":db.unique/identity" },
        "edge/id": { ":db/unique": ":db.unique/identity" },
        "edge/from": { ":db/valueType": ":db.type/ref" },
        "edge/to": { ":db/valueType": ":db.type/ref" },
        "edge/graph": { ":db/valueType": ":db.type/ref" }
      };
      const Q = {
        graphs: '[:find ?s ?t :where [?g "graph/slug" ?s] [(get-else $ ?g "graph/title" ?s) ?t]]',
        edges: '[:find ?id ?fs ?l ?ts :in $ ?gs :where [?g "graph/slug" ?gs] [?e "edge/graph" ?g] [?e "edge/id" ?id] [?e "edge/label" ?l] [?e "edge/from" ?f] [?e "edge/to" ?t] [?f "node/slug" ?fs] [?t "node/slug" ?ts]]',
        edgeCounts: '[:find ?gs (count ?e) :where [?e "edge/graph" ?g] [?g "graph/slug" ?gs]]',
        alsoIn: '[:find ?gs (count ?e) :in $ ?ns :where [?n "node/slug" ?ns] (or [?e "edge/from" ?n] [?e "edge/to" ?n]) [?e "edge/graph" ?g] [?g "graph/slug" ?gs]]',
        labels: '[:find ?l :where [_ "edge/label" ?l]]',
        triple: '[:find ?e . :in $ ?gs ?fs ?l ?ts :where [?g "graph/slug" ?gs] [?f "node/slug" ?fs] [?t "node/slug" ?ts] [?e "edge/from" ?f] [?e "edge/to" ?t] [?e "edge/label" ?l] [?e "edge/graph" ?g]]'
      };
      const NODE_PULL = '["node/slug" "node/title" "node/name"]';
      const EDGE_PULL = '["edge/id" "edge/label" "edge/at" "edge/date" "edge/text" {"edge/from" ["node/slug"]} {"edge/to" ["node/slug"]} {"edge/graph" ["graph/slug" "graph/title"]}]';

      const exists = (db, ref) => ds.entity(db, ref) !== null;

      function nodeTx(db, tempid, term) {
        const tx = { ":db/id": tempid, "node/slug": term.slug };
        const known = exists(db, ["node/slug", term.slug]) ? ds.pull(db, NODE_PULL, ["node/slug", term.slug]) : null;
        if (term.title) tx["node/title"] = term.title; // explicit title: the latest entry wins
        if (!known) tx["node/name"] = term.name; // first seen text is the fallback
        // DataScript has no lower-case function, so text search matches this precomputed field.
        const title = term.title || (known && known["node/title"]) || "";
        const name = (known && known["node/name"]) || term.name;
        tx["node/search"] = [term.slug, title, name].join(" ").toLowerCase();
        return tx;
      }
      function graphTx(db, tempid, slug, title) {
        const tx = { ":db/id": tempid, "graph/slug": slug };
        if (!exists(db, ["graph/slug", slug])) tx["graph/title"] = title;
        return tx;
      }

      function applyEntry(db, e) {
        if (e.kind === "graph") return ds.db_with(db, [graphTx(db, -1, e.slug, e.title)]);
        if (e.kind === "retract") {
          return exists(db, ["edge/id", e.target]) ? ds.db_with(db, [[":db.fn/retractEntity", ["edge/id", e.target]]]) : db;
        }
        const edge = { "edge/id": e.id, "edge/from": -1, "edge/to": -2, "edge/label": e.label, "edge/graph": -3, "edge/at": e.at, "edge/text": e.text || "" };
        if (e.date) edge["edge/date"] = e.date;
        return ds.db_with(db, [nodeTx(db, -1, e.from), nodeTx(db, -2, e.to), graphTx(db, -3, e.graph, e.graphTitle || e.graph), edge]);
      }
      const buildDb = (entries) => entries.reduce(applyEntry, ds.empty_db(SCHEMA));

      // ---- State -----------------------------------------------------------------------------

      const state = {
        log: [],
        liveDb: null,
        db: null,
        time: 0, // number of log entries applied; log.length means live
        graph: null,
        selected: null, // { kind: "node", slug } or { kind: "edge", id }
        positions: {},
        drafts: [],
        dbVersion: 0,
        matches: new Set() // node slugs from the last query result
      };

      // ---- Persistence: the shared Nostr store (nostr/store.js) when it opens, else localStorage --------

      const LOG = "log"; // collection name in M.storage.collections
      let store = null;
      const persisted = new Set(); // log ids the store already holds

      async function openStore() {
        if (!window.NostrPrototypes) return null;
        try {
          return await window.NostrPrototypes.openStore(M.storage);
        } catch (error) {
          console.warn(error);
          return null;
        }
      }

      function readLegacyLog() {
        const stored = readJson(M.localStorage.log);
        if (stored === undefined) return undefined;
        return Array.isArray(stored) ? stored.map(sanitizeEntry).filter(Boolean) : [];
      }

      function storedLog() {
        const entries = store.list(LOG).map(sanitizeEntry).filter(Boolean);
        persisted.clear();
        entries.forEach((e) => persisted.add(e.id));
        return entries;
      }

      // Loads the log. On the first visit it seeds sample data; a log from an older version moves into the store once.
      async function loadLog() {
        if (!store) {
          const legacy = readLegacyLog();
          if (legacy !== undefined) return legacy;
          const seed = seedEntries();
          writeJson(M.localStorage.log, seed);
          return seed;
        }
        const legacy = readLegacyLog();
        if (legacy !== undefined) {
          for (const entry of legacy) await store.append(LOG, entry);
          try { localStorage.removeItem(M.localStorage.log); } catch { /* storage blocked */ }
          writeJson(M.localStorage.seeded, true);
        }
        const anonymous = store.owner === window.NostrPrototypes.config.anonOwner;
        if (!store.list(LOG).length && anonymous && !readJson(M.localStorage.seeded)) {
          for (const entry of seedEntries()) await store.append(LOG, entry);
          writeJson(M.localStorage.seeded, true);
        }
        return storedLog();
      }

      // Persists log entries that are new since the last save. The log only grows, except for Clear all.
      function saveLog() {
        if (!store) {
          writeJson(M.localStorage.log, state.log);
          return;
        }
        for (const entry of state.log) {
          if (persisted.has(entry.id)) continue;
          persisted.add(entry.id);
          store.append(LOG, entry).catch((error) => flash(fill(C.saveFailed, { message: error.message })));
        }
      }

      const compact = window.matchMedia(M.layout.compactQuery);
      const isLive = () => state.time >= state.log.length;

      function rebuild({ keepTime = false } = {}) {
        state.log.sort(byTime);
        if (!keepTime) state.time = state.log.length;
        state.time = Math.min(state.time, state.log.length);
        if (!ds) return;
        state.liveDb = buildDb(state.log);
        state.db = isLive() ? state.liveDb : buildDb(state.log.slice(0, state.time));
        state.dbVersion += 1;
      }

      function graphList() {
        const map = new Map();
        if (ds && state.db) for (const [slug, title] of ds.q(Q.graphs, state.db)) map.set(slug, title);
        if (ds && state.liveDb) for (const [slug, title] of ds.q(Q.graphs, state.liveDb)) if (!map.has(slug)) map.set(slug, title);
        if (!map.size) map.set(M.defaultGraph.slug, M.defaultGraph.title);
        return [...map].map(([slug, title]) => ({ slug, title })).sort((a, b) => a.title.localeCompare(b.title));
      }
      function graphTitle(slug) {
        const found = graphList().find((g) => g.slug === slug);
        return found ? found.title : slug;
      }

      function nodeInfo(db, slug) {
        const pulled = ds.pull(db, NODE_PULL, ["node/slug", slug]) || {};
        return { slug, title: pulled["node/title"] || null, name: pulled["node/name"] || slug, display: pulled["node/title"] || pulled["node/name"] || slug };
      }

      function currentView() {
        if (!ds || !state.db) return { nodes: [], edges: [] };
        const rows = ds.q(Q.edges, state.db, state.graph.slug);
        const edges = rows.map(([id, from, label, to]) => ({ id, from, label, to })).sort((a, b) => a.id.localeCompare(b.id));
        const slugs = [...new Set(edges.flatMap((e) => [e.from, e.to]))].sort();
        return { nodes: slugs.map((slug) => nodeInfo(state.db, slug)), edges };
      }

      // ---- Status ----------------------------------------------------------------------------

      let statusTimer = null;
      // Short messages go to the shared toast in shell.js; without the shell, to the status line.
      function flash(message) {
        if (window.PrototypeShell) {
          window.PrototypeShell.toast(message, { timeoutMs: M.timing.statusMs });
          return;
        }
        $("status").textContent = message;
        clearTimeout(statusTimer);
        statusTimer = setTimeout(() => { $("status").textContent = persistentStatus(); }, M.timing.statusMs);
      }
      function persistentStatus() {
        if (!ds) return C.dsMissing;
        if (!hasCy) return C.cyMissing;
        if (!isLive()) return C.timeNotLive;
        return "";
      }

      // ---- Graph canvas ----------------------------------------------------------------------

      let cy = null;
      let fallbackList = null;
      const S = M.graphStyle;
      const K = M.colors;

      function initCanvas() {
        if (!hasCy) {
          fallbackList = document.createElement("ul");
          fallbackList.className = "canvas-list";
          $("canvas").append(fallbackList);
          return;
        }
        cy = window.cytoscape({
          container: $("canvas"),
          minZoom: 0.2,
          maxZoom: 3,
          wheelSensitivity: 0.3,
          style: [
            { selector: "node", style: {
              "background-color": K.node, "width": S.nodeSize, "height": S.nodeSize,
              "label": "data(label)", "color": K.nodeText, "font-size": S.fontSize,
              "text-valign": "bottom", "text-margin-y": 4, "text-wrap": "wrap", "text-max-width": S.labelMaxWidth,
              "text-outline-color": K.textHalo, "text-outline-width": 2
            } },
            { selector: "edge", style: {
              "width": S.edgeWidth, "line-color": K.edge, "target-arrow-color": K.edge, "target-arrow-shape": "triangle",
              "curve-style": "bezier", "label": "data(label)", "font-size": S.edgeFontSize, "color": K.edgeText,
              "text-rotation": "autorotate", "text-outline-color": K.textHalo, "text-outline-width": 2
            } },
            { selector: ".faded", style: { "opacity": S.fadedOpacity } },
            { selector: "node.up", style: { "background-color": K.up } },
            { selector: "edge.up", style: { "line-color": K.up, "target-arrow-color": K.up, "width": S.highlightWidth } },
            { selector: "node.down", style: { "background-color": K.down } },
            { selector: "edge.down", style: { "line-color": K.down, "target-arrow-color": K.down, "width": S.highlightWidth } },
            { selector: ".focus", style: { "background-color": K.focus, "line-color": K.focus, "target-arrow-color": K.focus, "width": S.focusSize, "height": S.focusSize, "font-weight": "bold" } },
            { selector: "edge.focus", style: { "width": S.highlightWidth } },
            { selector: "node.match", style: { "border-width": S.matchBorder, "border-color": K.match, "border-opacity": 1 } }
          ]
        });
        cy.on("tap", "node", (event) => select({ kind: "node", slug: event.target.id() }));
        cy.on("tap", "edge", (event) => select({ kind: "edge", id: event.target.data("factId") }));
        cy.on("tap", (event) => { if (event.target === cy) select(null); });
        cy.on("dragfree", "node", () => savePositions());
      }

      function savePositions() {
        if (!cy) return;
        const map = {};
        cy.nodes().forEach((n) => { map[n.id()] = { x: Math.round(n.position("x")), y: Math.round(n.position("y")) }; });
        state.positions[state.graph.slug] = { ...(state.positions[state.graph.slug] || {}), ...map };
        writeJson(M.localStorage.positions, state.positions);
      }

      function runLayout({ randomize, fixed }) {
        const L = M.layout;
        const opts = hasFcose
          ? { name: L.name, randomize, animate: !randomize, animationDuration: L.animationDuration, nodeRepulsion: L.nodeRepulsion, idealEdgeLength: L.idealEdgeLength, fit: false, padding: L.fitPadding }
          : { name: L.fallbackName, randomize, animate: false, fit: false, padding: L.fitPadding };
        if (hasFcose && fixed.length && !randomize) opts.fixedNodeConstraint = fixed.map((n) => ({ nodeId: n.id(), position: { ...n.position() } }));
        if (!hasFcose) fixed.forEach((n) => n.lock());
        const layout = cy.layout(opts);
        layout.one("layoutstop", () => {
          fixed.forEach((n) => n.unlock());
          cy.fit(undefined, L.fitPadding);
          savePositions();
        });
        layout.run();
      }

      function renderGraph({ fit = false, relayout = false } = {}) {
        const view = currentView();
        $("canvas-empty").hidden = view.edges.length > 0;
        $("canvas-empty-text").textContent = state.log.length ? fill(C.emptyGraph, { graph: state.graph.title }) : C.emptyStore;
        $("load-sample").hidden = state.log.length > 0;
        if (!cy) return renderFallback(view);

        const known = state.positions[state.graph.slug] || {};
        const before = new Set(cy.nodes().map((n) => n.id()));
        cy.batch(() => {
          cy.elements().remove();
          cy.add([
            ...view.nodes.map((n) => ({ group: "nodes", data: { id: n.slug, label: n.display } })),
            ...view.edges.map((e) => ({ group: "edges", data: { id: `e:${e.id}`, factId: e.id, source: e.from, target: e.to, label: e.label } }))
          ]);
        });
        if (relayout) {
          state.positions[state.graph.slug] = {};
          applyHighlight();
          if (cy.nodes().length) runLayout({ randomize: true, fixed: [] });
          return;
        }
        const placed = [];
        const fresh = [];
        cy.nodes().forEach((n) => {
          if (known[n.id()]) { n.position(known[n.id()]); placed.push(n); } else fresh.push(n);
        });
        // Start a new node next to a placed neighbour, so the incremental layout settles quickly.
        const nudge = M.layout.nudge;
        fresh.forEach((n, index) => {
          const anchor = n.neighborhood("node").filter((m) => known[m.id()]).first();
          const base = anchor.nonempty() ? anchor.position() : { x: 0, y: 0 };
          n.position({ x: base.x + nudge * Math.cos(index), y: base.y + nudge * Math.sin(index) });
        });
        applyHighlight();
        if (fresh.length) runLayout({ randomize: placed.length === 0, fixed: placed });
        else if (fit || [...before].some((id) => cy.$id(id).empty()) || before.size === 0) cy.fit(undefined, M.layout.fitPadding);
      }

      function renderFallback(view) {
        fallbackList.replaceChildren(...view.edges.map((e) => {
          const li = document.createElement("li");
          const nodeBtn = (slug) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "link-btn";
            b.textContent = nodeInfo(state.db, slug).display;
            b.addEventListener("click", () => select({ kind: "node", slug }));
            return b;
          };
          const label = document.createElement("button");
          label.type = "button";
          label.className = "link-btn arrow";
          label.textContent = `-> ${e.label} ->`;
          label.addEventListener("click", () => select({ kind: "edge", id: e.id }));
          li.append(nodeBtn(e.from), label, nodeBtn(e.to));
          return li;
        }));
      }

      function applyHighlight() {
        if (!cy) return;
        cy.elements().removeClass("faded focus down up match");
        cy.nodes().filter((n) => state.matches.has(n.id())).addClass("match");
        const sel = state.selected;
        if (!sel) return;
        const target = sel.kind === "node" ? cy.$id(sel.slug) : cy.$id(`e:${sel.id}`);
        if (target.empty()) return;
        cy.elements().addClass("faded");
        if (sel.kind === "edge") {
          target.union(target.connectedNodes()).removeClass("faded").addClass("focus");
          return;
        }
        target.successors().removeClass("faded").addClass("down");
        target.predecessors().removeClass("faded").addClass("up");
        target.removeClass("faded down up").addClass("focus");
      }

      // ---- Detail ----------------------------------------------------------------------------

      // Node.append() turns null into the text "null", so optional children go through this.
      const appendAll = (node, ...children) => {
        node.append(...children.filter((c) => c !== null && c !== undefined));
        return node;
      };
      const el = (tag, props = {}, ...children) => appendAll(Object.assign(document.createElement(tag), props), ...children);
      const chip = (text, kind = "") => el("span", { className: `chip ${kind}`.trim(), textContent: text });

      function select(sel) {
        state.selected = sel;
        applyHighlight();
        renderDetail();
      }

      function reachCounts(slug) {
        if (cy) {
          const n = cy.$id(slug);
          return { down: n.successors("node").length, up: n.predecessors("node").length };
        }
        const { edges } = currentView();
        const walk = (start, next) => {
          const seen = new Set();
          const queue = [start];
          while (queue.length) {
            const cur = queue.shift();
            for (const e of edges) {
              const [a, b] = next(e);
              if (a === cur && !seen.has(b) && b !== start) { seen.add(b); queue.push(b); }
            }
          }
          return seen.size;
        };
        return { down: walk(slug, (e) => [e.from, e.to]), up: walk(slug, (e) => [e.to, e.from]) };
      }

      function renderDetail() {
        const box = $("detail");
        const sel = state.selected;
        if (!sel || !ds || !state.db) { box.hidden = true; box.replaceChildren(); return; }
        const closeBtn = el("button", { type: "button", className: "secondary outline", textContent: C.detailClose });
        closeBtn.addEventListener("click", () => select(null));
        if (sel.kind === "node") renderNodeDetail(box, sel.slug, closeBtn);
        else renderEdgeDetail(box, sel.id, closeBtn);
      }

      function renderNodeDetail(box, slug, closeBtn) {
        if (!exists(state.db, ["node/slug", slug])) { box.hidden = true; return; }
        const info = nodeInfo(state.db, slug);
        const view = currentView();
        const reach = reachCounts(slug);
        const edgeRow = (e, other, dir) => {
          const row = el("li");
          const nodeLink = el("button", { type: "button", className: "link-btn", textContent: nodeInfo(state.db, other).display });
          nodeLink.addEventListener("click", () => select({ kind: "node", slug: other }));
          const factLink = el("button", { type: "button", className: "link-btn arrow", textContent: dir === "out" ? `-> ${e.label} ->` : `<- ${e.label} <-` });
          factLink.addEventListener("click", () => select({ kind: "edge", id: e.id }));
          row.append(factLink, nodeLink);
          return row;
        };
        const outgoing = view.edges.filter((e) => e.from === slug).map((e) => edgeRow(e, e.to, "out"));
        const incoming = view.edges.filter((e) => e.to === slug).map((e) => edgeRow(e, e.from, "in"));
        const others = ds.q(Q.alsoIn, state.db, slug).filter(([g]) => g !== state.graph.slug).sort();
        const alsoIn = el("div", { className: "also-in" });
        if (!others.length) alsoIn.append(el("span", { className: "muted small", textContent: C.detailAlsoInNone }));
        for (const [g, count] of others) {
          const b = el("button", { type: "button", className: "secondary", textContent: fill(C.detailAlsoInItem, { graph: graphTitle(g), edges: count }) });
          b.dataset.graph = g;
          b.addEventListener("click", () => switchGraph(g, { keepSelection: true }));
          alsoIn.append(b);
        }
        box.replaceChildren(
          el("div", { className: "detail-head" },
            el("div", {}, el("h2", { textContent: info.display }), el("span", { className: "muted small" }, `${C.detailSlug} `, el("code", { className: "slug", textContent: slug }))),
            closeBtn),
          el("div", { className: "reach" },
            el("span", {}, el("span", { className: "swatch sw-down" }), fill(C.detailDown, { count: reach.down })),
            el("span", {}, el("span", { className: "swatch sw-up" }), fill(C.detailUp, { count: reach.up }))),
          outgoing.length ? el("h3", { textContent: fill(C.detailOutgoing, { graph: state.graph.title }) }) : null,
          outgoing.length ? el("ul", {}, ...outgoing) : null,
          incoming.length ? el("h3", { textContent: fill(C.detailIncoming, { graph: state.graph.title }) }) : null,
          incoming.length ? el("ul", {}, ...incoming) : null,
          el("h3", { textContent: C.detailAlsoIn }),
          alsoIn
        );
        box.dataset.kind = "node";
        box.hidden = false;
      }

      function renderEdgeDetail(box, id, closeBtn) {
        if (!exists(state.db, ["edge/id", id])) { box.hidden = true; return; }
        const e = ds.pull(state.db, EDGE_PULL, ["edge/id", id]);
        const from = nodeInfo(state.db, e["edge/from"]["node/slug"]);
        const to = nodeInfo(state.db, e["edge/to"]["node/slug"]);
        const nodeLink = (n) => {
          const b = el("button", { type: "button", className: "link-btn", textContent: n.display });
          b.addEventListener("click", () => select({ kind: "node", slug: n.slug }));
          return b;
        };
        const retract = el("button", { type: "button", className: "secondary outline", textContent: C.retract });
        retract.addEventListener("click", () => retractFact(id));
        retract.disabled = !isLive();
        box.replaceChildren(
          el("div", { className: "detail-head" }, el("h2", { textContent: C.detailEdge }), closeBtn),
          el("p", { className: "reach" }, nodeLink(from), el("span", { className: "arrow", textContent: `-> ${e["edge/label"]} ->` }), nodeLink(to)),
          el("ul", {},
            el("li", { className: "muted small", textContent: fill(C.detailEdgeGraph, { graph: e["edge/graph"]["graph/title"] || e["edge/graph"]["graph/slug"] }) }),
            el("li", { className: "muted small", textContent: fill(C.detailEdgeAt, { at: fmtAt(e["edge/at"]) }) }),
            e["edge/date"] ? el("li", { className: "muted small", textContent: fill(C.detailEdgeDate, { date: e["edge/date"] }) }) : null,
            e["edge/text"] ? el("li", { className: "muted small", textContent: fill(C.detailEdgeText, { text: e["edge/text"] }) }) : null),
          el("div", {}, retract)
        );
        box.dataset.kind = "edge";
        box.hidden = false;
      }

      // ---- Tabs, stats, timeline, log --------------------------------------------------------

      function renderTabs() {
        const counts = new Map(ds && state.db ? ds.q(Q.edgeCounts, state.db) : []);
        const tabs = graphList().map((g) => {
          const b = el("button", { type: "button", textContent: fill(C.tabTemplate, { title: g.title, edges: counts.get(g.slug) || 0 }) });
          b.setAttribute("role", "tab");
          b.setAttribute("aria-selected", String(g.slug === state.graph.slug));
          b.dataset.graph = g.slug;
          b.addEventListener("click", () => switchGraph(g.slug));
          return b;
        });
        const add = el("button", { type: "button", className: "secondary outline", textContent: C.newGraphButton, id: "graph-new" });
        add.addEventListener("click", () => { $("graph-form").hidden = false; $("graph-name").focus(); });
        $("tabs").replaceChildren(...tabs, add);
      }

      function renderStats() {
        const view = currentView();
        $("stats").textContent = fill(C.statsTemplate, { graph: state.graph.title, nodes: view.nodes.length, edges: view.edges.length, entries: state.log.length });
      }

      function renderTimeline() {
        const slider = $("time");
        slider.max = String(state.log.length);
        slider.value = String(state.time);
        slider.disabled = state.log.length === 0 || !ds;
        const n = state.time;
        $("time-label").textContent = n >= state.log.length
          ? fill(C.timeLive, { count: state.log.length })
          : n === 0 ? C.timeStart : fill(C.timeAsOf, { n, count: state.log.length, at: fmtAt(state.log[n - 1].at) });
      }

      function describeEntry(e, byId) {
        if (e.kind === "graph") return fill(C.logGraph, { graph: e.title });
        if (e.kind === "retract") {
          const target = byId.get(e.target);
          return fill(C.logRetraction, { text: target ? target.text || `${target.from.slug} -> ${target.label} -> ${target.to.slug}` : e.target });
        }
        return e.text || `${e.from.slug} -> ${e.label} -> ${e.to.slug}`;
      }

      function renderLog() {
        $("log-title").textContent = fill(C.logTitle, { count: state.log.length });
        const byId = new Map(state.log.map((e) => [e.id, e]));
        const retracted = new Set(state.log.filter((e) => e.kind === "retract").map((e) => e.target));
        const items = [...state.log].reverse().map((e) => {
          const li = el("li", { className: retracted.has(e.id) ? "retracted" : "" });
          li.dataset.id = e.id;
          appendAll(li,
            e.kind === "fact" ? chip(graphTitle(e.graph), "graph") : null,
            el("span", { className: "text", textContent: describeEntry(e, byId) }),
            el("span", { className: "muted", textContent: fmtAt(e.at) })
          );
          if (e.kind === "fact" && retracted.has(e.id)) li.append(chip(C.logRetractedTag, "warn"));
          if (e.kind === "fact" && !retracted.has(e.id)) {
            const b = el("button", { type: "button", className: "secondary outline", textContent: C.retract });
            b.addEventListener("click", () => retractFact(e.id));
            li.append(b);
          }
          return li;
        });
        $("log-list").replaceChildren(...items);
      }

      // ---- Composer --------------------------------------------------------------------------

      function computeDrafts() {
        const lines = $("entry").value.split("\n");
        const db = state.liveDb;
        const labels = new Set(ds && db ? ds.q(Q.labels, db).map(([l]) => l) : []);
        const graphs = new Set(graphList().map((g) => g.slug));
        const seen = new Set();
        const drafts = [];
        lines.forEach((line, index) => {
          const draft = parseLine(line, state.graph);
          if (!draft) return;
          draft.line = index + 1;
          if (draft.error || !ds) { drafts.push(draft); return; }
          const key = [draft.graph, draft.from.slug, draft.label, draft.to.slug].join("\u0000");
          draft.duplicate = seen.has(key) || ds.q(Q.triple, db, draft.graph, draft.from.slug, draft.label, draft.to.slug) !== null;
          seen.add(key);
          draft.newFrom = !exists(db, ["node/slug", draft.from.slug]);
          draft.newTo = !exists(db, ["node/slug", draft.to.slug]);
          draft.newLabel = !labels.has(draft.label);
          draft.newGraph = !graphs.has(draft.graph);
          drafts.push(draft);
        });
        return drafts;
      }

      function renderPreview() {
        state.drafts = computeDrafts();
        const term = (t, isNew) => [
          el("strong", { textContent: t.title || t.name }),
          el("code", { className: "slug", textContent: t.slug }),
          chip(isNew ? C.chipNewNode : C.chipKnownNode, isNew ? "new" : "")
        ];
        $("preview").replaceChildren(...state.drafts.map((d) => {
          if (d.error) return el("li", { className: "err" }, chip(fill(C.lineError, { line: d.line, message: d.error }), "err"));
          const li = el("li", { className: d.duplicate ? "skip" : "" });
          appendAll(li,
            chip(d.graphTitle, "graph"),
            d.newGraph ? chip(C.chipNewGraph, "new") : null,
            ...term(d.from, d.newFrom),
            el("span", { className: "arrow", textContent: `-> ${d.label} ->` }),
            d.newLabel ? chip(C.chipNewLabel, "warn") : null,
            ...term(d.to, d.newTo),
            d.date ? chip(fill(C.chipDate, { date: d.date })) : null,
            d.duplicate ? chip(C.chipDuplicate, "warn") : null
          );
          return li;
        }));
        const ready = state.drafts.filter((d) => !d.error && !d.duplicate).length;
        $("add").disabled = !ds || ready === 0;
        $("add").textContent = ready ? fill(C.addButtonCount, { count: ready }) : C.addButton;
      }

      function addFacts() {
        if (!ds) return;
        const drafts = computeDrafts();
        const ready = drafts.filter((d) => !d.error && !d.duplicate);
        if (!ready.length) return;
        const now = Date.now();
        ready.forEach((d, index) => {
          state.log.push({
            id: newId(), kind: "fact", at: new Date(now + index).toISOString(),
            graph: d.graph, graphTitle: d.graphTitle, from: d.from, to: d.to, label: d.label, date: d.date, text: d.text
          });
        });
        saveLog();
        // Keep the lines that were not added, so errors can be fixed in place.
        const keep = new Set(drafts.filter((d) => d.error).map((d) => d.line));
        $("entry").value = $("entry").value.split("\n").filter((_, i) => keep.has(i + 1)).join("\n");
        if (!keep.size && $("composer-sheet").open) $("composer-sheet").close(); // lines with errors keep the sheet open
        const lastGraph = ready[ready.length - 1].graph;
        rebuild();
        const skipped = drafts.length - ready.length;
        flash(fill(C.added, { count: ready.length, graph: graphTitle(lastGraph) }) + (skipped ? ` ${fill(C.addedSkipped, { skipped })}` : ""));
        if (lastGraph !== state.graph.slug) switchGraph(lastGraph);
        else renderAll();
      }

      function retractFact(id) {
        if (!isLive()) return;
        state.log.push({ id: newId(), kind: "retract", at: new Date().toISOString(), target: id });
        saveLog();
        rebuild();
        if (state.selected && state.selected.kind === "edge" && state.selected.id === id) state.selected = null;
        flash(C.retracted);
        renderAll();
      }

      // ---- Navigation ------------------------------------------------------------------------

      function switchGraph(slug, { keepSelection = false } = {}) {
        state.graph = { slug, title: graphTitle(slug) };
        writeJson(M.localStorage.view, { graph: slug });
        if (!keepSelection) state.selected = null;
        renderAll({ fit: true });
        if (keepSelection && cy && state.selected && state.selected.kind === "node") {
          const node = cy.$id(state.selected.slug);
          if (node.nonempty()) cy.center(node);
        }
      }

      function renderAll(opts = {}) {
        if (!graphList().some((g) => g.slug === state.graph.slug) && state.log.length) state.graph = graphList()[0];
        state.graph = { slug: state.graph.slug, title: graphTitle(state.graph.slug) };
        renderTabs();
        renderStats();
        renderTimeline();
        renderGraph(opts);
        renderDetail();
        renderLog();
        renderPreview();
        if (query.req && !query.req.error) runQuery({ rerun: true });
        if (!$("status").textContent || !statusTimer) $("status").textContent = persistentStatus();
      }

      // ---- Query -----------------------------------------------------------------------------

      const QM = M.query;
      const RULES = QM.rules.join("\n");
      const DS_URL = (document.querySelector('script[src*="datascript"]') || {}).src;
      const query = { req: null, run: 0, seq: 0, worker: null, workerDbVersion: -1, pending: null, inline: false };

      const clauseOf = (q, name) => {
        const m = q.match(new RegExp(`:${name}\\s+([\\s\\S]*?)\\s*(?=:find|:in|:with|:where|\\]\\s*$)`));
        return m ? m[1].trim() : null;
      };

      // Reads the query text once. ?node is frozen at Run time; $ and ?graph resolve on every re-run.
      function prepareQuery(raw) {
        const text = raw.trim();
        if (!text) return null;
        if (!text.startsWith("[")) {
          const term = text.toLowerCase();
          return { mode: "text", term: text, query: QM.textQuery, names: ["$", "?term"], values: { "?term": term }, columns: ["?slug"], shape: "rel" };
        }
        let q = text;
        let names = ["$"];
        const inClause = clauseOf(q, "in");
        if (inClause !== null) names = inClause.split(/\s+/);
        else if (/:where/.test(q)) {
          q = q.replace(/:where/, ":in $ % :where"); // so the built-in rules work without an :in clause
          names = ["$", "%"];
        }
        const values = {};
        for (const name of names) {
          if (name === "?node") {
            if (!state.selected || state.selected.kind !== "node") return { error: C.queryNeedsNode };
            values[name] = state.selected.slug;
          } else if (!["$", "%", "?graph"].includes(name)) {
            return { error: fill(C.queryUnknownInput, { name }) };
          }
        }
        const find = clauseOf(q, "find") || "";
        const columns = [...find.matchAll(/\((?:[^()]|\([^()]*\))*\)|\?[^\s()[\]]+/g)].map((m) => m[0]);
        const shape = /^\[[\s\S]*\.\.\.\s*\]$/.test(find) ? "coll" : find.startsWith("[") ? "tuple" : /\s\.$/.test(find) ? "scalar" : "rel";
        return { mode: "datalog", query: q, names, values, columns, shape };
      }

      function resolveInputs(req) {
        return req.names.map((name) => {
          if (name === "$") return { db: true };
          if (name === "%") return RULES;
          if (name === "?graph") return state.graph.slug;
          return req.values[name];
        });
      }

      function dropWorker() {
        if (query.worker) query.worker.terminate();
        query.worker = null;
        if (query.pending) {
          clearTimeout(query.pending.timer);
          query.pending.resolve({ ok: false, stale: true });
          query.pending = null;
        }
      }

      // Queries run in a Web Worker, so a query that never ends can be stopped.
      function getWorker() {
        if (query.worker || query.inline) return query.worker;
        const source = `let ds = null, db = null;
          onmessage = (event) => {
            const m = event.data;
            try {
              if (!ds) { importScripts(m.lib); ds = self.datascript; }
              if (m.db) db = ds.from_serializable(m.db);
              const args = m.inputs.map((x) => (x && x.db ? db : x));
              const start = performance.now();
              const result = ds.q(m.query, ...args);
              postMessage({ id: m.id, ok: true, result: JSON.parse(JSON.stringify(result === undefined ? null : result)), ms: performance.now() - start });
            } catch (error) {
              postMessage({ id: m.id, ok: false, error: String((error && error.message) || error) });
            }
          };`;
        try {
          query.worker = new Worker(URL.createObjectURL(new Blob([source], { type: "text/javascript" })));
          query.workerDbVersion = -1;
        } catch {
          query.inline = true;
        }
        return query.worker;
      }

      function execute(req) {
        if (query.pending) dropWorker();
        const inputs = resolveInputs(req);
        const worker = getWorker();
        if (!worker) {
          try {
            const start = performance.now();
            const result = ds.q(req.query, ...inputs.map((x) => (x && x.db ? state.db : x)));
            return Promise.resolve({ ok: true, result, ms: performance.now() - start });
          } catch (error) {
            return Promise.resolve({ ok: false, error: String((error && error.message) || error) });
          }
        }
        return new Promise((resolve) => {
          const id = ++query.seq;
          const message = { id, lib: DS_URL, query: req.query, inputs };
          if (query.workerDbVersion !== state.dbVersion) {
            message.db = JSON.parse(JSON.stringify(ds.serializable(state.db)));
            query.workerDbVersion = state.dbVersion;
          }
          const timer = setTimeout(() => {
            query.pending = null;
            worker.terminate();
            if (query.worker === worker) query.worker = null;
            resolve({ ok: false, timeout: true });
          }, QM.timeoutMs);
          query.pending = { timer, resolve };
          worker.onmessage = (event) => {
            if (event.data.id !== id) return;
            clearTimeout(timer);
            query.pending = null;
            resolve(event.data);
          };
          worker.onerror = (event) => {
            event.preventDefault();
            dropWorker();
            resolve({ ok: false, error: event.message || "worker error" });
          };
          worker.postMessage(message);
        });
      }

      function toRows(result, shape) {
        if (shape === "scalar") return result === null || result === undefined ? [] : [[result]];
        if (shape === "tuple") return Array.isArray(result) && result.length ? [result] : [];
        if (!Array.isArray(result)) return [];
        return shape === "coll" ? result.map((v) => [v]) : result.map((r) => (Array.isArray(r) ? r : [r]));
      }

      // A value is a node when it is a known slug, a node entity id, or a pulled map with a slug.
      function slugOf(value) {
        if (typeof value === "string") return exists(state.db, ["node/slug", value]) ? value : null;
        if (typeof value === "number" && Number.isInteger(value) && value > 0) {
          const pulled = ds.pull(state.db, NODE_PULL, value);
          return pulled && pulled["node/slug"] ? pulled["node/slug"] : null;
        }
        if (value && typeof value === "object" && typeof value["node/slug"] === "string") return value["node/slug"];
        return null;
      }

      function focusNode(slug) {
        state.selected = { kind: "node", slug };
        if (!currentView().nodes.some((n) => n.slug === slug)) {
          const other = ds.q(Q.alsoIn, state.db, slug).map(([g]) => g).sort()[0];
          if (other) { switchGraph(other, { keepSelection: true }); return; }
        }
        select(state.selected);
        if (cy && cy.$id(slug).nonempty()) cy.animate({ center: { eles: cy.$id(slug) } }, { duration: M.layout.animationDuration });
      }

      function renderResults(req, res) {
        const rows = toRows(res.result, req.shape);
        rows.sort((a, b) => JSON.stringify(a).localeCompare(JSON.stringify(b)));
        const matches = new Set();
        const cell = (value) => {
          const slug = slugOf(value);
          if (slug) {
            const b = el("button", { type: "button", className: "secondary outline node-cell", textContent: nodeInfo(state.db, slug).display });
            b.dataset.slug = slug;
            b.addEventListener("click", () => focusNode(slug));
            return el("td", {}, b);
          }
          return el("td", { textContent: value !== null && typeof value === "object" ? JSON.stringify(value) : String(value) });
        };
        rows.forEach((row) => row.forEach((value) => { const slug = slugOf(value); if (slug) matches.add(slug); }));
        const shown = rows.slice(0, QM.maxRows);
        const width = rows.reduce((n, r) => Math.max(n, r.length), req.columns.length);
        const head = Array.from({ length: width }, (_, i) => req.columns[i] || fill(C.queryColumn, { n: i + 1 }));
        $("query-results").replaceChildren(rows.length
          ? el("table", {},
            el("thead", {}, el("tr", {}, ...head.map((h) => el("th", { scope: "col", textContent: h })))),
            el("tbody", {}, ...shown.map((r) => el("tr", {}, ...r.map(cell)))))
          : el("p", { className: "muted small", textContent: C.queryEmpty }));
        state.matches = matches;
        applyHighlight();
        const ringed = cy ? cy.nodes().filter((n) => matches.has(n.id())).length : currentView().nodes.filter((n) => matches.has(n.slug)).length;
        $("query-status").textContent = [
          req.mode === "text" ? fill(C.queryTextMode, { term: req.term }) : null,
          fill(C.queryResult, { rows: rows.length, ms: Math.round(res.ms || 0), matches: ringed, graph: state.graph.title }),
          rows.length > shown.length ? fill(C.queryTruncated, { shown: shown.length }) : null,
          isLive() ? null : C.queryAsOf,
          query.inline ? C.queryInline : null
        ].filter(Boolean).join(" ");
      }

      function showQueryProblem(message) {
        state.matches = new Set();
        applyHighlight();
        $("query-results").replaceChildren();
        $("query-status").textContent = message;
      }

      async function runQuery({ rerun = false } = {}) {
        if (!rerun) query.req = prepareQuery($("query-input").value);
        const req = query.req;
        if (!req) return clearQuery();
        if (req.error) return showQueryProblem(req.error);
        if (!ds || !state.db) return;
        const token = ++query.run;
        $("query-status").textContent = C.queryRunning;
        const res = await execute(req);
        if (token !== query.run || res.stale) return;
        if (!res.ok) return showQueryProblem(res.timeout ? fill(C.queryTimeout, { seconds: QM.timeoutMs / 1000 }) : fill(C.queryError, { message: res.error }));
        renderResults(req, res);
      }

      function clearQuery() {
        query.req = null;
        query.run += 1;
        $("query-input").value = "";
        showQueryProblem("");
      }

      function renderQueryHelp() {
        const pairs = (items) => el("ul", {}, ...items.map((item) => el("li", {}, el("code", { textContent: item.name }), ` ${item.text}`)));
        $("query-help-body").replaceChildren(
          el("h4", { textContent: C.queryHelpShape }),
          el("pre", {}, el("code", { textContent: QM.shape.join("\n") })),
          el("ul", {}, ...QM.shapeParts.map((t) => el("li", { textContent: t }))),
          el("h4", { textContent: C.queryHelpInputs }), pairs(QM.inputs),
          el("h4", { textContent: C.queryHelpAttributes }), pairs(QM.attributes),
          el("h4", { textContent: C.queryHelpRules }), pairs(QM.ruleDocs),
          el("h4", { textContent: C.queryHelpTips }),
          el("ul", {}, ...QM.tips.map((t) => el("li", { textContent: t })))
        );
        $("query-examples").replaceChildren(...QM.examples.map((group) => el("div", { className: "query-group" },
          el("h4", { textContent: group.group }),
          el("ul", {}, ...group.items.map((item) => {
            const text = item.query.join("\n");
            const b = el("button", { type: "button", className: "secondary", textContent: item.title });
            b.addEventListener("click", () => {
              $("query-input").value = text;
              runQuery();
              $("query-input").scrollIntoView({ block: "nearest" });
            });
            return el("li", {}, b, el("pre", {}, el("code", { textContent: text })));
          })))));
      }

      // ---- Import / export / clear -----------------------------------------------------------

      function exportLog() {
        const payload = { format: M.exportFile.format, version: M.exportFile.version, exportedAt: new Date().toISOString(), entries: state.log };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = el("a", { href: url, download: fill(M.exportFile.fileName, { date: new Date().toISOString().slice(0, 10) }) });
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
        flash(fill(C.exported, { count: state.log.length }));
      }

      function importText(text) {
        let data;
        try { data = JSON.parse(text); } catch { return flash(fill(C.importRejected, { reason: C.importParse })); }
        if (!data || data.format !== M.exportFile.format || !Array.isArray(data.entries)) return flash(fill(C.importRejected, { reason: C.importNotLog }));
        const missing = data.entries.findIndex((e) => !hasIdentity(e));
        if (missing !== -1) return flash(fill(C.importRejected, { reason: fill(C.importMissingIdentity, { index: missing + 1 }) }));
        const ids = new Set(state.log.map((e) => e.id));
        const fresh = data.entries.map(sanitizeEntry).filter((e) => e && !ids.has(e.id));
        state.log.push(...fresh);
        saveLog();
        rebuild();
        renderAll({ fit: true });
        flash(fill(C.imported, { added: fresh.length, skipped: data.entries.length - fresh.length }));
      }

      let clearArmed = null;
      function clearLog() {
        if (!clearArmed) {
          $("clear").textContent = C.clearConfirm;
          clearArmed = setTimeout(() => { clearArmed = null; $("clear").textContent = C.clear; }, M.timing.clearConfirmMs);
          return;
        }
        clearTimeout(clearArmed);
        clearArmed = null;
        $("clear").textContent = C.clear;
        closeMenu();
        state.selected = null;
        if (store && store.owner !== window.NostrPrototypes.config.anonOwner) {
          // Relays keep the synced log, so a signed-in clear retracts every active fact instead.
          const retracted = new Set(state.log.filter((e) => e.kind === "retract").map((e) => e.target));
          const active = state.log.filter((e) => e.kind === "fact" && !retracted.has(e.id));
          const now = Date.now();
          active.forEach((e, i) => state.log.push({ id: newId(), kind: "retract", at: new Date(now + i).toISOString(), target: e.id }));
          saveLog();
          rebuild();
          renderAll();
          flash(fill(C.retractedAll, { count: active.length }));
          return;
        }
        state.log = [];
        state.positions = {};
        if (store) store.clearLocal(LOG).then(() => persisted.clear());
        else saveLog();
        writeJson(M.localStorage.positions, state.positions);
        rebuild();
        renderAll();
        flash(C.cleared);
      }

      // ---- Compact layout: "More" menu and composer sheet -----------------------------------

      function closeMenu() {
        if ($("more-menu").matches(":popover-open")) $("more-menu").hidePopover();
      }

      // Wide screens: a dropdown under the "More" button, or above it when the space below is too small.
      // Phones: the CSS bottom sheet.
      function placeMenu() {
        const menu = $("more-menu");
        if (compact.matches) { menu.style.inset = ""; return; }
        const gap = M.layout.menuGap;
        const button = $("more").getBoundingClientRect();
        const left = Math.max(gap, Math.min(button.right - menu.offsetWidth, window.innerWidth - menu.offsetWidth - gap));
        const fitsBelow = button.bottom + gap + menu.offsetHeight <= window.innerHeight - gap;
        const top = fitsBelow ? button.bottom + gap : Math.max(gap, button.top - gap - menu.offsetHeight);
        menu.style.inset = `${top}px auto auto ${left}px`;
      }

      // One composer node: in the side column on wide screens, in the bottom sheet on phones.
      function placeComposer() {
        const form = $("composer");
        if (compact.matches) {
          if (form.parentElement !== $("composer-sheet-body")) $("composer-sheet-body").append(form);
        } else {
          if ($("composer-sheet").open) $("composer-sheet").close();
          if (form.previousElementSibling !== $("composer-home")) $("composer-home").after(form);
        }
      }

      // ---- Boot ------------------------------------------------------------------------------

      function bindStatic() {
        $("kicker").textContent = M.kicker;
        $("title").textContent = M.title;
        document.title = M.title;
        $("intro").textContent = M.intro;
        $("entry-label").textContent = C.entryLabel;
        $("entry").placeholder = C.entryPlaceholder;
        $("add").textContent = C.addButton;
        $("add-hint").textContent = C.addHint;
        $("syntax-title").textContent = C.syntaxTitle;
        $("syntax-example").textContent = C.syntaxExample;
        $("syntax-rules").replaceChildren(...C.syntaxRules.map((rule) => el("li", { textContent: rule })));
        $("graph-name").placeholder = C.newGraphPlaceholder;
        $("graph-create").textContent = C.newGraphCreate;
        $("graph-cancel").textContent = C.newGraphCancel;
        $("load-sample").textContent = C.loadSample;
        $("relayout").textContent = C.relayout;
        $("relayout").hidden = !cy;
        $("more").textContent = C.more;
        $("more").setAttribute("aria-label", C.moreLabel);
        $("fab").textContent = C.fab;
        $("composer-close").textContent = C.composerClose;
        $("time-title").textContent = C.timeTitle;
        $("export").textContent = C.export;
        $("import").textContent = C.import;
        $("clear").textContent = C.clear;
        $("legend").replaceChildren(
          el("span", {}, el("span", { className: "swatch sw-focus" }), C.legendFocus),
          el("span", {}, el("span", { className: "swatch sw-down" }), C.legendDown),
          el("span", {}, el("span", { className: "swatch sw-up" }), C.legendUp),
          el("span", {}, el("span", { className: "swatch sw-match" }), C.legendMatch)
        );

        $("query-title").textContent = C.queryTitle;
        $("query-label").textContent = C.queryLabel;
        $("query-input").placeholder = C.queryPlaceholder;
        $("query-run").textContent = C.queryRun;
        $("query-run").disabled = !ds;
        $("query-clear").textContent = C.queryClear;
        $("query-hint").textContent = C.queryHint;
        $("query-help-title").textContent = C.queryHelpTitle;
        $("query-examples-title").textContent = C.queryExamplesTitle;
        renderQueryHelp();
        $("query-form").addEventListener("submit", (event) => { event.preventDefault(); runQuery(); });
        $("query-input").addEventListener("keydown", (event) => {
          if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) { event.preventDefault(); runQuery(); }
        });
        $("query-clear").addEventListener("click", clearQuery);

        $("entry").addEventListener("input", renderPreview);
        for (const id of ["entry", "query-input"]) $(id).addEventListener("focus", () => { if (compact.matches && state.selected) select(null); });
        $("entry").addEventListener("keydown", (event) => {
          if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) { event.preventDefault(); addFacts(); }
        });
        $("composer").addEventListener("submit", (event) => { event.preventDefault(); addFacts(); });
        $("time").addEventListener("input", () => {
          state.time = Number($("time").value);
          rebuild({ keepTime: true });
          renderAll();
        });
        $("relayout").addEventListener("click", () => { closeMenu(); renderGraph({ relayout: true }); });
        $("more-menu").addEventListener("toggle", (event) => { if (event.newState === "open") placeMenu(); });
        $("fab").addEventListener("click", () => {
          placeComposer();
          $("composer-sheet").showModal();
          $("entry").focus();
        });
        $("composer-close").addEventListener("click", () => $("composer-sheet").close());
        compact.addEventListener("change", placeComposer);
        placeComposer();
        $("load-sample").addEventListener("click", () => {
          const ids = new Set(state.log.map((e) => e.id));
          const seed = seedEntries().filter((e) => !ids.has(e.id));
          state.log.push(...seed);
          saveLog();
          rebuild();
          state.graph = { slug: M.defaultGraph.slug, title: M.defaultGraph.title };
          renderAll({ fit: true });
          flash(fill(C.sampleLoaded, { count: seed.length }));
        });
        $("graph-form").addEventListener("submit", (event) => {
          event.preventDefault();
          const name = $("graph-name").value.trim();
          const slug = slugify(name);
          if (!slug) return flash(C.errGraph);
          if (graphList().some((g) => g.slug === slug) && (state.log.length || slug !== M.defaultGraph.slug)) return flash(fill(C.newGraphExists, { graph: name }));
          state.log.push({ id: newId(), kind: "graph", at: new Date().toISOString(), slug, title: name });
          saveLog();
          rebuild();
          $("graph-name").value = "";
          $("graph-form").hidden = true;
          switchGraph(slug);
          flash(fill(C.graphCreated, { graph: name }));
        });
        $("graph-cancel").addEventListener("click", () => { $("graph-form").hidden = true; });
        $("export").addEventListener("click", () => { closeMenu(); exportLog(); });
        $("import").addEventListener("click", () => { closeMenu(); $("import-file").click(); });
        $("import-file").addEventListener("change", async () => {
          const file = $("import-file").files[0];
          $("import-file").value = "";
          if (file) importText(await file.text());
        });
        $("clear").addEventListener("click", clearLog);
      }

      async function boot() {
        store = await openStore();
        state.log = await loadLog();
        if (store) {
          // Facts from another device, or a switch of key, replace the log.
          store.subscribe((change) => {
            if (change.reason === "local") return;
            const wasLive = isLive();
            state.log = storedLog();
            if (change.reason === "owner") state.selected = null;
            rebuild({ keepTime: !wasLive });
            renderAll();
          });
        }
        const accountBadge = document.querySelector("nostr-account"); // shell.js puts it in the top bar
        if (accountBadge) accountBadge.store = store;
        const positions = readJson(M.localStorage.positions);
        state.positions = positions && typeof positions === "object" && !Array.isArray(positions) ? positions : {};
        rebuild();
        const view = readJson(M.localStorage.view);
        const graphs = graphList();
        const wanted = view && typeof view.graph === "string" && graphs.find((g) => g.slug === view.graph);
        state.graph = wanted || graphs.find((g) => g.slug === M.defaultGraph.slug) || graphs[0];
        initCanvas();
        bindStatic();
        renderAll({ fit: true });
        window.factGraph = { state, get cy() { return cy; }, get store() { return store; }, datascript: ds, parseLine, select, switchGraph };
        window.factGraph.ready = true;
      }

      boot().catch((error) => { console.error(error); flash(String(error.message || error)); });
    </script>
  </body>
</html>
