<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Prototypes</title>
    <link rel="stylesheet" href="prototype-base.css">
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #f7f3ea;
        --ink: #172033;
        --muted: #5d6678;
        --card: #fffdf8;
        --line: rgba(23, 32, 51, 0.14);
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.1);
        --synced: #2f9e44;
        --browser: #1971c2;
        --none: #868e96;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(147, 197, 253, 0.34), transparent 32rem),
          linear-gradient(135deg, #fffaf0 0%, #f7f3ea 52%, #edf4ff 100%);
        color: var(--ink);
      }

      main { width: min(48rem, 100%); margin: 0 auto; padding: 1.5rem 1rem 3rem; }
      h1, h2, p { margin-top: 0; }
      h1 { margin-bottom: 0.25rem; font-size: clamp(1.6rem, 7vw, 2.4rem); letter-spacing: -0.04em; }
      h2 { margin-bottom: 0.25rem; font-size: 1.05rem; letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.5rem; }
      .intro, .section-note, .stats { color: var(--muted); line-height: 1.45; }
      .intro { margin-bottom: 0.4rem; font-size: 0.95rem; }
      .stats { margin-bottom: 0; font-size: 0.85rem; }

      .controls { display: grid; gap: 0.6rem; margin-block: 1.25rem 0.5rem; }
      .search { position: relative; }
      .search input { width: 100%; min-height: 2.75rem; padding: 0.5rem 0.8rem; border: 1px solid var(--line); border-radius: 0.7rem; background: var(--card); font-size: 1rem; }
      .search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .chips { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.15rem; scrollbar-width: thin; }
      .chip-btn { flex: none; min-height: 2.5rem; padding: 0 0.85rem; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); font-size: 0.85rem; cursor: pointer; }
      .chip-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
      .chip-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .result-line { margin: 0; font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }

      .section { display: grid; gap: 0.6rem; margin-top: 1.5rem; }
      .section-note { margin-bottom: 0; font-size: 0.88rem; }
      .count { font-size: 0.75rem; font-weight: 700; padding: 0.1rem 0.5rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
      .dot { width: 0.65rem; height: 0.65rem; border-radius: 50%; flex: none; }
      .dot.synced { background: var(--synced); } .dot.browser { background: var(--browser); } .dot.none { background: var(--none); }

      .item-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 0.9rem; background: color-mix(in srgb, var(--card) 82%, transparent); overflow: hidden; }
      /* Apps are separate tiles: one column on phones, two on wide screens. */
      .app-grid { display: grid; gap: 0.5rem; grid-template-columns: minmax(0, 1fr); }
      .app { padding: 0.6rem 0.8rem; border: 1px solid var(--line); border-radius: 0.8rem; background: color-mix(in srgb, var(--card) 88%, transparent); }
      .app-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.15rem 0.6rem; }
      .app-head a { font-weight: 700; font-size: 0.98rem; color: var(--ink); text-decoration: none; min-height: 1.75rem; display: inline-flex; align-items: center; }
      .app-head a:hover, .app-head a:focus-visible { color: var(--accent); text-decoration: underline; outline: none; }
      .summary { margin: 0.1rem 0 0.35rem; color: var(--muted); font-size: 0.86rem; line-height: 1.4; }
      .tags { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem; }
      .tag { font-size: 0.72rem; font-weight: 700; padding: 0.12rem 0.5rem; border-radius: 999px; background: rgba(23, 32, 51, 0.06); color: var(--ink); white-space: nowrap; }
      .tag.need { background: #fff3db; color: #8a4b00; }
      /* "Details" sits at the end of the tag row; open, it takes the full width below. */
      details.more { margin-inline-start: auto; font-size: 0.84rem; }
      details.more[open] { flex-basis: 100%; margin-inline-start: 0; }
      details.more summary { cursor: pointer; color: var(--accent); min-height: 2.25rem; display: inline-flex; align-items: center; list-style: none; }
      details.more summary::-webkit-details-marker { display: none; }
      details.more summary::before { content: "\25B8"; margin-right: 0.35rem; transition: transform 0.15s; }
      details.more[open] summary::before { transform: rotate(90deg); }
      dl.facts { display: grid; grid-template-columns: minmax(6rem, max-content) minmax(0, 1fr); gap: 0.3rem 0.8rem; margin: 0.2rem 0 0.3rem; }
      dl.facts dt { color: var(--muted); }
      dl.facts dd { margin: 0; }

      .bookmark { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.6rem; padding: 0.7rem 0.9rem; color: inherit; text-decoration: none; border-block-end: 1px solid var(--line); }
      .bookmark:last-child { border-block-end: none; }
      .bookmark:hover, .bookmark:focus-visible { background: var(--accent-soft); outline: none; }
      .bookmark strong { font-size: 0.94rem; }
      .bookmark span { color: var(--muted); font-size: 0.84rem; }

      .empty { padding: 1.25rem; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 0.9rem; margin-top: 1rem; }
      .empty button { margin-top: 0.5rem; min-height: 2.5rem; padding: 0 1rem; border-radius: 999px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
      .footer { margin-top: 2rem; font-size: 0.85rem; color: var(--muted); }
      .footer a { color: var(--accent); }
      @media (min-width: 56rem) {
        main { width: min(68rem, 100%); }
        .app-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
      }
      @media (prefers-reduced-motion: reduce) { details.more summary::before { transition: none; } }
    </style>
    <!-- Shared Nostr account (sign in once for every prototype) and the shared top bar. -->
    <script src="https://cdn.jsdelivr.net/npm/nostr-tools@2.25.2/lib/nostr.bundle.js" defer></script>
    <script src="nostr/store.js" defer></script>
    <script src="nostr/account.js" defer></script>
    <script src="shell.js" defer></script>
  </head>
  <body>
    <main>
      <header class="hero">
        <h1 id="page-title"></h1>
        <p class="intro" id="page-intro"></p>
        <p class="stats" id="stats"></p>
      </header>

      <div class="controls" role="search">
        <div class="search">
          <input type="search" id="search" autocomplete="off" spellcheck="false">
        </div>
        <div class="chips" id="source-filter" role="group"></div>
        <p class="result-line" id="result-line" aria-live="polite"></p>
      </div>

      <div id="groups"></div>
      <div class="empty" id="empty" hidden>
        <p id="empty-text"></p>
        <button type="button" id="empty-reset"></button>
      </div>
      <section class="section" id="bookmarks"></section>
      <p class="footer" id="footer"></p>
    </main>

    <script type="module">
      const M = JSON.parse(document.getElementById("index-manifest").textContent);
      const C = M.copy;
      const $ = (id) => document.getElementById(id);
      const fill = (tpl, vars) => tpl.replace(/\{(\w+)\}/g, (all, key) => (key in vars ? String(vars[key]) : all));
      const el = (tag, props = {}, ...children) => {
        const node = Object.assign(document.createElement(tag), props);
        node.append(...children.filter((c) => c !== null && c !== undefined && c !== false));
        return node;
      };
      const labelOf = (list, id) => (list.find((x) => x.id === id) || { label: id }).label;

      // ---- View state (a per-viewer convenience; the page works without storage) ----

      const view = (() => {
        try { return { query: "", source: "all", ...JSON.parse(localStorage.getItem(M.storageKey) || "{}") }; } catch { return { query: "", source: "all" }; }
      })();
      if (view.source !== "all" && !M.sources.some((s) => s.id === view.source)) view.source = "all";
      const saveView = () => { try { localStorage.setItem(M.storageKey, JSON.stringify(view)); } catch { /* storage blocked */ } };

      // ---- Rendering ----

      function appCard(app) {
        const needs = app.needs.length ? app.needs.map((n) => labelOf(M.needs, n)).join(", ") : C.needsNothing;
        const card = el("article", { className: "app", id: `app-${app.id}` },
          el("div", { className: "app-head" }, el("a", { href: app.url, textContent: app.title })),
          el("p", { className: "summary", textContent: app.summary }),
          el("div", { className: "tags" },
            ...app.sources.map((s) => el("span", { className: "tag", textContent: labelOf(M.sources, s) })),
            ...app.needs.map((n) => el("span", { className: "tag need", textContent: labelOf(M.needs, n) })),
            el("details", { className: "more" },
              el("summary", { textContent: C.details }),
              el("dl", { className: "facts" },
                el("dt", { textContent: C.factSaves }), el("dd", { textContent: app.saves }),
                el("dt", { textContent: C.factData }), el("dd", { textContent: app.data }),
                el("dt", { textContent: C.factNeeds }), el("dd", { textContent: needs })))));
        card.dataset.search = [app.title, app.summary, app.saves, app.data, app.keywords, ...app.sources.map((s) => labelOf(M.sources, s)), ...app.needs.map((n) => labelOf(M.needs, n))].join(" ").toLowerCase();
        card.dataset.sources = app.sources.join(" ");
        return card;
      }

      function renderGroups() {
        $("groups").replaceChildren(...M.groups.map((group) => {
          const apps = M.apps.filter((a) => a.group === group.id);
          return el("section", { className: "section", id: `group-${group.id}` },
            el("h2", {}, el("span", { className: `dot ${group.id}`, ariaHidden: "true" }), group.title, el("span", { className: "count" })),
            el("p", { className: "section-note", textContent: group.description }),
            el("div", { className: "app-grid" }, ...apps.map(appCard)));
        }));
      }

      function renderFilter() {
        const options = [{ id: "all", label: C.filterAll }, ...M.sources];
        $("source-filter").setAttribute("aria-label", C.filterLabel);
        $("source-filter").replaceChildren(...options.map((o) => {
          const b = el("button", { type: "button", className: "chip-btn", textContent: o.label });
          b.dataset.source = o.id;
          b.setAttribute("aria-pressed", String(view.source === o.id));
          b.addEventListener("click", () => { view.source = o.id; saveView(); renderFilter(); applyFilter(); });
          return b;
        }));
      }

      // Shows the cards that match every search word and the chosen data source; hides empty groups.
      function applyFilter() {
        const words = view.query.toLowerCase().split(/\s+/).filter(Boolean);
        let shown = 0;
        for (const section of $("groups").children) {
          let inGroup = 0;
          for (const card of section.querySelectorAll(".app")) {
            const match = words.every((w) => card.dataset.search.includes(w)) && (view.source === "all" || card.dataset.sources.split(" ").includes(view.source));
            card.hidden = !match;
            if (match) inGroup += 1;
          }
          section.hidden = inGroup === 0;
          section.querySelector(".count").textContent = String(inGroup);
          shown += inGroup;
        }
        const total = M.apps.length;
        $("result-line").textContent = shown === total ? fill(C.resultAll, { total }) : fill(C.resultSome, { shown, total });
        $("empty").hidden = shown > 0;
      }

      function renderBookmarks() {
        const b = M.bookmarks;
        $("bookmarks").replaceChildren(
          el("h2", {}, b.title),
          el("p", { className: "section-note", textContent: b.note }),
          el("div", { className: "item-list" }, ...b.items.map((item) => el("a", { className: "bookmark", href: item.url, target: "_blank", rel: "noreferrer" },
            el("strong", { textContent: item.title }), el("span", { textContent: item.description })))));
      }

      document.title = M.title;
      $("page-title").textContent = M.title;
      $("page-intro").textContent = M.intro;
      const counts = Object.fromEntries(M.groups.map((g) => [g.id, M.apps.filter((a) => a.group === g.id).length]));
      $("stats").textContent = fill(C.stats, { apps: M.apps.length, ...counts });
      $("search").placeholder = C.searchPlaceholder;
      $("search").setAttribute("aria-label", C.searchLabel);
      $("search").value = view.query;
      $("search").addEventListener("input", () => { view.query = $("search").value; saveView(); applyFilter(); });
      // "/" jumps to the search field, as on many sites.
      document.addEventListener("keydown", (event) => {
        const target = event.composedPath()[0];
        const typing = target instanceof HTMLElement && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName));
        if (event.key === "/" && !typing && !event.ctrlKey && !event.metaKey && !event.altKey) { event.preventDefault(); $("search").focus(); }
      });
      $("empty-text").textContent = C.emptyText;
      $("empty-reset").textContent = C.emptyReset;
      $("empty-reset").addEventListener("click", () => { view.query = ""; view.source = "all"; saveView(); $("search").value = ""; renderFilter(); applyFilter(); $("search").focus(); });
      $("footer").append(`${C.footer} `, el("a", { href: M.aboutUrl, textContent: C.footerLink }));
      renderGroups();
      renderFilter();
      renderBookmarks();
      applyFilter();
    </script>
  </body>
</html>
