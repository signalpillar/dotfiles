      /* ---------------- dashboard ---------------- */

      function renderStats() {
        const total = NODES.reduce((sum, n) => sum + statusFor(n.id).weight, 0);
        const pct = Math.round((total / NODES.length) * 100);
        refs.pct.textContent = String(pct);
        refs.overallBar.replaceChildren(progressBar(pct, APP.accent, APP.title));

        const points = NODES.reduce((sum, n) => sum + statusFor(n.id).points, 0);
        const mastered = NODES.filter((n) => isMastered(n.id)).length;
        refs.headlineBadges.replaceChildren(
          badge(fill(COPY.pointsBadge, { points, max: MAX_POINTS }), { fill: APP.accent, size: "large" }),
          badge(fill(COPY.masteredBadge, { count: mastered }), { fill: STATUS.get(APP.rules.masteredStatus).color, size: "large" }),
          badge(fill(COPY.topicsBadge, { count: NODES.length }), { variant: "platinum", size: "large", outline: true })
        );

        refs.subjectGrid.replaceChildren(
          ...Object.entries(M.subjects).map(([key, subject]) => {
            const nodes = NODES.filter((n) => n.subject === key);
            const done = nodes.reduce((sum, n) => sum + statusFor(n.id).weight, 0);
            const count = nodes.filter((n) => isMastered(n.id)).length;
            return make("div", { class: "subject-row" }, [
              make("div", { class: "lbl" }, [
                make("b", { text: subject.name }),
                make("span", { text: fill(COPY.subjectMastered, { count, total: nodes.length }) })
              ]),
              progressBar(Math.round((done / nodes.length) * 100), subject.color, subject.name)
            ]);
          })
        );
      }

      /* ---------------- track map ---------------- */

      let layout = null;

      function computeLayout() {
        const t = APP.track;
        const stages = M.stages.map((s) => s.id);
        const positions = new Map();
        const lanes = [];
        let y = t.padBlock;

        M.laneOrder.forEach((subjectKey) => {
          const cells = stages.map((stageId) =>
            NODES.filter((n) => n.subject === subjectKey && n.stage === stageId).sort((a, b) =>
              a.id.localeCompare(b.id, undefined, { numeric: true })
            )
          );
          const rows = Math.max(1, ...cells.map((c) => c.length));
          const height = rows * t.nodeHeight + (rows - 1) * t.rowGap;

          cells.forEach((cell, stageIdx) => {
            cell.forEach((node, rowIdx) => {
              positions.set(node.id, {
                x: t.padInline + stageIdx * (t.nodeWidth + t.columnGap),
                y: y + rowIdx * (t.nodeHeight + t.rowGap)
              });
            });
          });

          lanes.push({ subject: subjectKey, top: y, height });
          y += height + t.laneGap;
        });

        layout = {
          positions,
          lanes,
          width: t.padInline * 2 + stages.length * t.nodeWidth + (stages.length - 1) * t.columnGap,
          height: y + t.rowGap
        };
      }

      function buildTrackChrome() {
        const t = APP.track;
        refs.canvas.querySelectorAll(".lane-label, .stage-label, .lane-band").forEach((n) => n.remove());

        M.stages.forEach((stage, i) => {
          refs.canvas.append(
            make("div", {
              class: "stage-label",
              text: fill(COPY.stageNumber, { id: stage.id }),
              style: { insetInlineStart: t.padInline + i * (t.nodeWidth + t.columnGap) + "px", insetBlockStart: "14px", inlineSize: t.nodeWidth + "px" }
            }, [make("b", { text: stage.name })])
          );
        });

        layout.lanes.forEach((lane) => {
          refs.canvas.append(
            make("div", { class: "lane-band", style: { insetBlockStart: lane.top - t.laneGap / 2 + "px", inlineSize: layout.width + "px" } }),
            make("div", {
              class: "lane-label",
              text: M.subjects[lane.subject].name,
              vars: { c: M.subjects[lane.subject].color },
              style: { insetInlineStart: t.laneLabelInset + "px", insetBlockStart: lane.top + "px", inlineSize: t.padInline - t.laneLabelInset * 2 + "px" }
            })
          );
        });
      }

      function renderTrack() {
        const t = APP.track;
        const e = t.edge;
        Object.assign(refs.canvas.style, { inlineSize: layout.width + "px", blockSize: layout.height + "px" });
        refs.edges.setAttribute("width", layout.width);
        refs.edges.setAttribute("height", layout.height);
        refs.edges.setAttribute("viewBox", "0 0 " + layout.width + " " + layout.height);

        const paths = [];
        NODES.forEach((node) => {
          const to = layout.positions.get(node.id);
          node.requires.forEach((reqId) => {
            const from = layout.positions.get(reqId);
            const source = BY_ID.get(reqId);
            if (!from || !to || !source) return;
            const x1 = from.x + t.nodeWidth;
            const y1 = from.y + t.nodeHeight / 2;
            const x2 = to.x;
            const y2 = to.y + t.nodeHeight / 2;
            const dx = Math.max(e.minCurve, (x2 - x1) * e.curve);
            const active = selectedId === node.id || selectedId === reqId;
            const visible = isVisible(node) && isVisible(source);
            paths.push(
              '<path d="M ' + x1 + " " + y1 + " C " + (x1 + dx) + " " + y1 + ", " + (x2 - dx) + " " + y2 + ", " + x2 + " " + y2 +
                '" fill="none" stroke-linecap="round" stroke="' + M.subjects[source.subject].color +
                '" stroke-width="' + (active ? e.widthActive : e.widthIdle) +
                '" opacity="' + (active ? e.opacityActive : visible ? e.opacityIdle : e.opacityHidden) + '" />'
            );
          });
        });
        refs.edges.innerHTML = paths.join("");

        refs.canvas.querySelectorAll(".node").forEach((n) => n.remove());
        NODES.forEach((node) => {
          const pos = layout.positions.get(node.id);
          const status = statusFor(node.id);
          const locked = !isUnlocked(node) && status.id === STATUS_IDS[0];

          const btn = make("button", {
            class: "node" + (locked ? " locked" : "") + (isVisible(node) ? "" : " dim") + (selectedId === node.id ? " selected" : ""),
            vars: { c: M.subjects[node.subject].color, s: status.color },
            style: { insetInlineStart: pos.x + "px", insetBlockStart: pos.y + "px", inlineSize: t.nodeWidth + "px", blockSize: t.nodeHeight + "px" },
            on: { click: () => select(node.id) }
          }, [
            status.id === STATUS_IDS[0] ? null : make("span", { class: "tint" }),
            make("span", { class: "n-title", text: node.title }),
            make("span", { class: "n-meta" }, [make("i", { class: "dot" }), document.createTextNode(node.id + " · " + status.label)])
          ]);
          refs.canvas.append(btn);
        });

        applyZoom();
      }

      function applyZoom() {
        refs.canvas.style.transform = "scale(" + zoom + ")";
        Object.assign(refs.zoomWrap.style, { inlineSize: layout.width * zoom + "px", blockSize: layout.height * zoom + "px" });
        refs.zoomLabel.textContent = Math.round(zoom * 100) + "%";
      }

      function nudgeZoom(delta) {
        zoom = Math.min(APP.zoom.max, Math.max(APP.zoom.min, zoom + delta));
        applyZoom();
      }

      function fitZoom() {
        const available = refs.viewport.clientWidth - 4;
        if (available <= 0) return;
        zoom = Math.min(APP.zoom.fitMax, Math.max(APP.zoom.min, available / layout.width));
        applyZoom();
      }

      /* ---------------- roadmap ---------------- */

      function renderList() {
        const box = refs.panels.list;
        box.replaceChildren();
        let shown = 0;

        M.stages.forEach((stage) => {
          const nodes = NODES.filter((n) => n.stage === stage.id && isVisible(n));
          if (!nodes.length) return;
          shown += nodes.length;

          const cards = make("div", { class: "cards" });
          nodes
            .slice()
            .sort(
              (a, b) =>
                M.laneOrder.indexOf(a.subject) - M.laneOrder.indexOf(b.subject) ||
                a.id.localeCompare(b.id, undefined, { numeric: true })
            )
            .forEach((node) => {
              const status = statusFor(node.id);
              const locked = !isUnlocked(node) && status.id === STATUS_IDS[0];
              cards.append(
                make("button", {
                  class: "lcard" + (locked ? " locked" : "") + (selectedId === node.id ? " selected" : ""),
                  vars: { c: M.subjects[node.subject].color },
                  on: { click: () => select(node.id) }
                }, [
                  make("span", { class: "l-top" }, [
                    document.createTextNode(M.subjects[node.subject].name + " · " + node.id),
                    make("span", { class: "push" }, [badge(status.label, { fill: status.color, label: status.labelColor, size: "small" })])
                  ]),
                  make("span", { class: "l-title", text: node.title }),
                  make("span", { class: "l-f1", text: node.f1 })
                ])
              );
            });

          box.append(
            make("div", { class: "stage-block" }, [
              make("div", { class: "stage-head" }, [
                make("span", { class: "num", text: fill(COPY.stageNumber, { id: stage.id }) }),
                make("h2", { text: stage.name }),
                make("p", { text: stage.blurb })
              ]),
              cards
            ])
          );
        });

        if (!shown) box.append(make("p", { class: "empty", text: COPY.emptyResults }));
      }

      /* ---------------- garage ---------------- */

      function renderGarage() {
        const box = refs.panels.garage;
        box.replaceChildren(make("p", { class: "foot", text: COPY.garageIntro + " " + M.statusHelp }));

        M.drivers
          .map((driver) => {
            const nodes = NODES.filter((n) => n.driver === driver.id);
            const points = nodes.reduce((sum, n) => sum + statusFor(n.id).points, 0);
            const max = nodes.length * APP.rules.maxStatusPoints;
            return { driver, nodes, points, max, pct: max ? Math.round((points / max) * 100) : 0 };
          })
          .sort((a, b) => b.points - a.points || a.driver.name.localeCompare(b.driver.name))
          .forEach((row, i) => {
            box.append(
              make("div", { class: "dcard garage", vars: { c: row.driver.color } }, [
                make("div", { class: "dhead" }, [
                  make("span", { class: "pos", text: String(i + 1) }),
                  make("span", {}, [
                    make("span", { class: "dname", text: row.driver.name }),
                    make("br"),
                    make("span", { class: "dteam", text: row.driver.team })
                  ]),
                  make("span", { class: "push" }, [badge(fill(COPY.pointsBadge, { points: row.points, max: row.max }), { fill: row.driver.color })])
                ]),
                progressBar(row.pct, row.driver.color, row.driver.name),
                make("div", { class: "dfocus", text: row.driver.focus }),
                make("div", { class: "dnodes" }, row.nodes.map((node) => topicChip(node.id, node.id + " " + node.title)))
              ])
            );
          });
      }

      function topicChip(id, text) {
        const node = BY_ID.get(id);
        return make("button", {
          class: "tagbtn",
          vars: { s: statusFor(id).color },
          on: { click: () => select(id) }
        }, [make("i"), document.createTextNode(text || (node ? node.title : id))]);
      }

      /* ---------------- F1 explainer ---------------- */

      const SECTION_RENDERERS = {
        prose: (section) => section.paragraphs.map((text) => make("p", { text })),
        stats: (section) => [
          make("div", { class: "stat-grid" }, section.items.map((item) =>
            make("div", { class: "stat" }, [
              make("b", { text: item.value }),
              make("span", { text: item.label }),
              make("em", { text: item.note })
            ])
          ))
        ],
        principles: (section) => [
          make("div", { class: "item-grid" }, section.items.map((item) =>
            make("article", { class: "item" }, [make("h3", { text: item.title }), make("p", { text: item.body }), scienceRow(item.science, false)])
          ))
        ],
        glossary: (section) => [
          make("div", { class: "glossary" }, section.items.map((item) =>
            make("article", { class: "gterm" }, [make("h3", { text: item.term }), make("p", { text: item.body }), scienceRow(item.science, true)])
          ))
        ],
        steps: (section) => [
          make("div", { class: "steps" }, section.items.map((item) =>
            make("div", { class: "step" }, [
              make("div", { class: "when", text: item.when }),
              make("div", {}, [make("div", { class: "what", text: item.what }), make("p", { text: item.body })])
            ])
          ))
        ],
        table: (section) => {
          const table = make("table");
          const head = make("tr");
          section.columns.forEach((c) => head.append(make("th", { text: c })));
          table.append(make("thead", {}, [head]));
          const body = make("tbody");
          section.rows.forEach((row) => {
            const tr = make("tr");
            row.forEach((cell) => tr.append(make("td", { text: cell })));
            body.append(tr);
          });
          table.append(body);
          return [make("div", { class: "table-wrap" }, [table]), section.note ? make("p", { class: "sub", text: section.note }) : null];
        },
        ratio: (section) => {
          const bar = make("div", { class: "ratio-bar" }, section.items.map((item) =>
            make("span", {
              text: item.share + "%",
              style: { flexGrow: String(item.share), background: item.color, color: item.labelColor || "#fff" }
            })
          ));
          const cards = make("div", { class: "item-grid ratio-cards" }, section.items.map((item) =>
            make("article", { class: "item ratio-card", vars: { c: item.color } }, [
              make("b", { class: "ratio-share", text: item.share + "%" }),
              make("h3", { text: item.label }),
              make("p", { text: item.body })
            ])
          ));
          return [bar, cards, section.note ? make("p", { class: "sub", text: section.note }) : null];
        },
        links: (section) => [
          make("div", { class: "linklist" }, section.items.map((item) => {
            let host = item.url;
            try {
              host = new URL(item.url).hostname.replace(/^www\./, "");
            } catch (err) {
              /* keep the raw string */
            }
            return make("a", { class: "linkrow", href: item.url, target: "_blank", rel: "noopener noreferrer" }, [
              make("span", { class: "lname", text: item.label }),
              make("span", { class: "lnote", text: item.note }),
              make("span", { class: "lhost", text: host })
            ]);
          }))
        ]
      };

      function renderPage(viewId, pageKey) {
        const page = M.pages[pageKey];
        const box = refs.panels[viewId];
        box.className = "explainer";
        box.replaceChildren(make("p", { class: "lede", text: page.lede }));

        page.sections.forEach((section) => {
          const heading = make("h2", { text: section.title });
          heading.prepend(make("span", { class: "rule" }));
          const parts = (SECTION_RENDERERS[section.type] || (() => []))(section);
          box.append(
            make("section", { class: "ex-section" }, [
              heading,
              section.intro ? make("p", { class: "sub", text: section.intro }) : null,
              ...parts
            ])
          );
        });
      }

      function scienceRow(ids, compact) {
        if (!ids || !ids.length) return null;
        const row = make("div", { class: "sci" });
        if (!compact) row.append(make("span", { class: "caption", text: COPY.scienceLabel }));
        ids.forEach((id) => {
          const node = BY_ID.get(id);
          if (node) row.append(topicChip(id, node.id + " " + node.title));
        });
        return row;
      }

      /* ---------------- detail drawer ---------------- */

      function select(id) {
        selectedId = id;
        renderDetail();
        if (jellyOk) refs.drawer.open = true;
        else refs.drawer.setAttribute("open", "");
        renderView();
      }

      function closeDetail() {
        selectedId = null;
        if (jellyOk) refs.drawer.open = false;
        else refs.drawer.removeAttribute("open");
        renderView();
      }

      function fact(label, text, isF1) {
        return make("div", { class: "fact" + (isF1 ? " is-f1" : "") }, [make("h3", { text: label }), make("p", { text })]);
      }

      function renderDetail() {
        refs.detailBody.replaceChildren();
        if (!selectedId) return;

        const node = BY_ID.get(selectedId);
        const entry = progress[node.id] || {};
        const status = statusFor(node.id);
        const subject = M.subjects[node.subject];
        const stage = M.stages.find((s) => s.id === node.stage);
        const driver = M.drivers.find((d) => d.id === node.driver);
        const L = COPY.factLabels;

        refs.detailBody.append(
          make("h2", { text: node.title }),
          make("div", { class: "row" }, [
            badge(subject.name, { fill: subject.color, label: subject.labelColor, size: "small" }),
            badge(node.id, { variant: "platinum", size: "small", outline: true }),
            badge(fill(COPY.stageBadge, { id: stage.id, name: stage.name }), { variant: "platinum", size: "small", outline: true }),
            isUnlocked(node) ? null : badge(COPY.lockedBadge, { fill: APP.accent, size: "small" })
          ].filter(Boolean)),
          make("div", { class: "caption", text: COPY.statusPrompt }),
          make("div", { class: "status-row" }, STATUS_IDS.map((sid) => {
            const s = STATUS.get(sid);
            const active = status.id === sid;
            return button(fill(COPY.statusButton, { label: s.label, note: s.note }), {
              fill: active ? s.color : undefined,
              label: s.labelColor,
              variant: active ? undefined : "platinum",
              block: true,
              onClick: () => setStatus(node.id, sid)
            });
          })),
          make("div", { class: "facts" }, [
            fact(L.spec, node.spec),
            fact(L.f1, node.f1, true),
            fact(L.diy, node.diy),
            fact(L.check, node.check),
            driver ? fact(L.driver, fill(COPY.driverFact, driver)) : null
          ].filter(Boolean))
        );

        if (node.requires.length) refs.detailBody.append(linkFact(COPY.requiresLabel, node.requires));
        const unlocks = UNLOCKS.get(node.id);
        if (unlocks.length) refs.detailBody.append(linkFact(COPY.unlocksLabel, unlocks));

        refs.detailBody.append(
          make("div", { class: "caption", text: COPY.notesPrompt }),
          textField("textarea", {
            label: COPY.notesLabel,
            rows: 4,
            value: entry.notes || "",
            placeholder: COPY.notesPlaceholder,
            onInput: (value) => setNotes(node.id, value)
          })
        );

        if (entry.updatedAt) {
          refs.detailBody.append(make("div", { class: "stamp", text: fill(COPY.lastUpdated, { when: new Date(entry.updatedAt).toLocaleString() }) }));
        }
        refs.detailBody.append(button(COPY.closeButton, { variant: "platinum", block: true, onClick: closeDetail }));
      }

      function linkFact(title, ids) {
        return make("div", { class: "fact" }, [
          make("h3", { text: title }),
          make("div", { class: "links" }, ids.map((id) => (BY_ID.has(id) ? topicChip(id, BY_ID.get(id).title) : null)).filter(Boolean))
        ]);
      }

      /* ---------------- import and export ---------------- */

      function exportProgress() {
        const payload = {
          app: APP.id,
          version: APP.storage.schemaVersion,
          exportedAt: new Date().toISOString(),
          summary: {
            topics: NODES.length,
            points: NODES.reduce((sum, n) => sum + statusFor(n.id).points, 0),
            maxPoints: MAX_POINTS
          },
          progress
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: APP.export.mimeType });
        const url = URL.createObjectURL(blob);
        const a = make("a", { href: url, download: APP.export.filePrefix + "-" + new Date().toISOString().slice(0, 10) + ".json" });
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), APP.timing.revokeObjectUrlMs);
      }

      async function handleImportFile(file) {
        let parsed;
        try {
          parsed = JSON.parse(await file.text());
        } catch (err) {
          window.alert(COPY.importBadJson);
          return;
        }
        const source = parsed && typeof parsed === "object" && parsed.progress ? parsed.progress : parsed;
        const { entries, skipped } = sanitise(source);
        const count = Object.keys(entries).length;
        if (!count) {
          window.alert(COPY.importNothingUsable);
          return;
        }
        pendingImport = entries;
        refs.importSummary.textContent = fill(skipped ? COPY.importSummarySkipped : COPY.importSummary, { count, skipped });
        toggleImportSheet(true);
      }

      function toggleImportSheet(open) {
        if (jellyOk) refs.importSheet.open = open;
        else if (open) refs.importSheet.setAttribute("open", "");
        else refs.importSheet.removeAttribute("open");
      }

      function applyImport(mode) {
        if (!pendingImport) return;
        if (mode === "replace") {
          progress = pendingImport;
        } else {
          for (const [id, incoming] of Object.entries(pendingImport)) {
            const existing = progress[id];
            if (!existing || new Date(incoming.updatedAt) >= new Date(existing.updatedAt || 0)) progress[id] = incoming;
          }
        }
        pendingImport = null;
        saveProgress();
        toggleImportSheet(false);
        renderStats();
        renderView();
        renderDetail();
      }

      function resetProgress() {
        if (!window.confirm(COPY.resetConfirm)) return;
        progress = {};
        saveProgress();
        closeDetail();
        renderStats();
        renderView();
      }

      /* ---------------- views ---------------- */

      /* Views the app implements itself, plus one generic renderer for every tab
         that declares a "page" in the manifest. */
      const VIEW_RENDERERS = { track: renderTrack, list: renderList, garage: renderGarage };
      const PAGE_TABS = new Map(APP.tabs.filter((t) => t.page).map((t) => [t.id, t.page]));

      function renderView() {
        if (PAGE_TABS.has(view)) renderPage(view, PAGE_TABS.get(view));
        else (VIEW_RENDERERS[view] || (() => {}))();
        /* Search and subject filters only apply to the roadmap views. */
        refs.controls.hidden = PAGE_TABS.has(view);
      }

      function setView(next) {
        view = next;
        if (!jellyOk) {
          for (const [id, panel] of Object.entries(refs.tabPanels)) panel.hidden = id !== view;
          [...refs.fallbackTabs.children].forEach((btn, i) => {
            btn.style.opacity = APP.tabs[i].id === view ? "1" : "0.55";
          });
        }
        renderView();
        if (view === "track") requestAnimationFrame(fitZoom);
      }

      /* ---------------- boot ---------------- */

      buildThemeStyles();
      buildChrome();
      applyMode();
      renderModeSwitch();
      renderSubjectChips();

      refs.searchSlot.append(
        textField("input", {
          label: COPY.searchLabel,
          placeholder: COPY.searchPlaceholder,
          onInput: (value) => {
            query = value.trim().toLowerCase();
            renderView();
          }
        })
      );

      computeLayout();
      buildTrackChrome();
      renderStats();
      setView(APP.defaultTab);

      darkQuery.addEventListener("change", () => {
        if (modePref === "auto") {
          applyMode();
          renderView();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && selectedId) closeDetail();
      });

      let resizeTimer = null;
      window.addEventListener("resize", () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(() => {
          if (view === "track") fitZoom();
          refs.drawer.setAttribute("side", wideQuery.matches ? "end" : "bottom");
        }, APP.timing.resizeDebounceMs);
      });
    </script>
  </body>
</html>
