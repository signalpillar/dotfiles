<!doctype html>
<!-- Prototype question: which interface best helps someone understand a mortgage versus renting? Three variants are switchable with ?variant=map, ?variant=workbench, or ?variant=story. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mortgage Compass</title>
    <link rel="stylesheet" href="https://unpkg.com/open-props@1.7.14/open-props.min.css">
    <link rel="stylesheet" href="prototype-base.css">
    <style>
      :root {
        color-scheme: light;
        --ink: #17251f;
        --muted: #6b776e;
        --paper: #f5f6f0;
        --surface: #ffffff;
        --line: #dce3da;
        --green: #287456;
        --green-deep: #174b38;
        --mint: #dceee2;
        --yellow: #f8d27a;
        --orange: #ed8d5d;
        --blue: #507f9f;
        --shadow: 0 1rem 3rem rgba(34, 58, 43, 0.09);
        font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
        background: var(--paper);
        color: var(--ink);
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(circle at 12% -5%, rgba(248, 210, 122, 0.34), transparent 22rem),
          radial-gradient(circle at 93% 4%, rgba(220, 238, 226, 0.72), transparent 25rem),
          var(--paper);
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .site {
        width: min(78rem, 100%);
        margin: 0 auto;
        padding: max(1rem, env(safe-area-inset-top)) clamp(1rem, 3vw, 2.5rem) 7rem;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: clamp(2.5rem, 7vw, 5rem);
      }

      .wordmark,
      .back-link {
        color: var(--ink);
        text-decoration: none;
      }

      .wordmark {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.92rem;
        font-weight: 850;
        letter-spacing: -0.02em;
      }

      .mark {
        display: grid;
        width: 2rem;
        height: 2rem;
        place-items: center;
        border-radius: 0.7rem;
        color: white;
        background: var(--green-deep);
        font-size: 0.8rem;
      }

      .back-link {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .back-link:hover,
      .back-link:focus-visible {
        color: var(--green);
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1,
      h2,
      h3 {
        letter-spacing: -0.055em;
      }

      h1 {
        max-width: 9.5ch;
        margin-bottom: 1.2rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.1rem, 9vw, 6.4rem);
        font-weight: 500;
        line-height: 0.9;
      }

      h2 {
        margin-bottom: 0.65rem;
        font-size: clamp(1.45rem, 3vw, 2rem);
      }

      h3 {
        margin-bottom: 0.25rem;
        font-size: 1.1rem;
      }

      .lede {
        max-width: 36rem;
        margin-bottom: 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.6;
      }

      .eyebrow,
      .section-kicker {
        margin-bottom: 0.75rem;
        color: var(--green);
        font-size: 0.7rem;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .intro {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(14rem, 0.9fr);
        align-items: end;
        gap: 2rem;
        margin-bottom: 3rem;
      }

      .intro-note {
        max-width: 20rem;
        justify-self: end;
        padding-left: 1rem;
        border-left: 2px solid var(--yellow);
        color: var(--muted);
        font-size: 0.84rem;
        line-height: 1.55;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 1.3rem;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: var(--shadow);
      }

      .controls {
        display: grid;
        gap: 1.1rem;
        padding: clamp(1rem, 3vw, 1.5rem);
      }

      .controls-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        padding-bottom: 0.9rem;
        border-bottom: 1px solid var(--line);
      }

      .controls-heading h2 {
        margin-bottom: 0;
        font-size: 1.25rem;
      }

      .controls-heading span {
        color: var(--muted);
        font-size: 0.74rem;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }

      .field {
        display: grid;
        gap: 0.42rem;
        min-width: 0;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field label,
      .field-title {
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 700;
      }

      .input-wrap {
        display: flex;
        align-items: center;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        background: #fbfcf8;
        transition: border-color 140ms ease, box-shadow 140ms ease;
      }

      .input-wrap:focus-within {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(40, 116, 86, 0.12);
      }

      .input-prefix {
        padding-left: 0.8rem;
        color: var(--muted);
      }

      .input-wrap input {
        width: 100%;
        min-width: 0;
        min-height: 2.8rem;
        padding: 0.55rem 0.75rem;
        border: 0;
        outline: 0;
        color: var(--ink);
        background: transparent;
        font-size: 1rem;
        font-weight: 750;
      }

      .input-suffix {
        padding-right: 0.8rem;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .overpay-box {
        display: grid;
        gap: 0.6rem;
        padding: 0.9rem;
        border-radius: 0.9rem;
        background: var(--mint);
      }

      .overpay-box .field-title {
        color: var(--green-deep);
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--green);
      }

      .range-line {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 5rem;
        align-items: center;
        gap: 0.8rem;
      }

      .range-line input[type="number"] {
        min-height: 2.45rem;
        padding: 0.4rem 0.5rem;
        border: 1px solid rgba(40, 116, 86, 0.25);
        border-radius: 0.6rem;
        color: var(--green-deep);
        background: rgba(255, 255, 255, 0.6);
        font-size: 0.95rem;
        font-weight: 750;
      }

      .hero-result {
        display: grid;
        align-content: space-between;
        min-height: 100%;
        padding: clamp(1.4rem, 4vw, 2.2rem);
        border-radius: 1.3rem;
        color: white;
        background:
          radial-gradient(circle at 80% 15%, rgba(248, 210, 122, 0.44), transparent 13rem),
          linear-gradient(145deg, var(--green-deep), #23694f);
        box-shadow: 0 1.4rem 3rem rgba(23, 75, 56, 0.2);
      }

      .hero-result .eyebrow {
        color: var(--yellow);
      }

      .hero-result h2 {
        max-width: none;
        margin-bottom: 2rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.2rem, 5vw, 4rem);
        font-weight: 500;
        line-height: 0.95;
      }

      .big-number {
        display: block;
        margin-bottom: 0.2rem;
        font-size: clamp(2.8rem, 8vw, 5.2rem);
        font-weight: 850;
        letter-spacing: -0.08em;
        line-height: 0.95;
        font-variant-numeric: tabular-nums;
      }

      .number-caption {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.82rem;
        line-height: 1.35;
        display: block;
      }

      .first-month {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 0.65rem;
        margin-top: 2rem;
      }

      .first-month > div {
        padding-top: 0.75rem;
        border-top: 1px solid rgba(255, 255, 255, 0.26);
      }

      .first-month span {
        display: block;
        color: rgba(255, 255, 255, 0.65);
        font-size: 0.7rem;
      }

      .first-month strong {
        display: block;
        margin-top: 0.25rem;
        font-size: 1.1rem;
        font-variant-numeric: tabular-nums;
      }

      .map-layout {
        display: grid;
        grid-template-columns: minmax(18rem, 0.8fr) minmax(0, 1.2fr);
        gap: 1rem;
      }

      .map-results {
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: 1rem;
      }

      .metric-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 1.1rem;
        background: var(--line);
      }

      .metric {
        min-width: 0;
        padding: 1rem;
        background: rgba(255, 255, 255, 0.85);
      }

      .metric-label {
        display: block;
        margin-bottom: 0.4rem;
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .metric-value {
        display: block;
        font-size: clamp(1.15rem, 3vw, 1.65rem);
        font-weight: 850;
        letter-spacing: -0.06em;
        font-variant-numeric: tabular-nums;
      }

      .metric-value.green {
        color: var(--green);
      }

      .insight {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        padding: 1rem 1.15rem;
        border-radius: 1.1rem;
        color: var(--green-deep);
        background: var(--yellow);
      }

      .insight-icon {
        display: grid;
        flex: 0 0 auto;
        width: 2.2rem;
        height: 2.2rem;
        place-items: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.52);
        font-weight: 900;
      }

      .insight p {
        margin: 0;
        font-size: 0.86rem;
        line-height: 1.45;
      }

      .chart-card,
      .compare-card,
      .story-card {
        padding: clamp(1rem, 3vw, 1.5rem);
      }

      .chart-header,
      .card-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.2rem;
      }

      .chart-header h2,
      .card-header h2 {
        margin-bottom: 0;
        font-size: 1.2rem;
      }

      .chart-header span,
      .card-header span {
        color: var(--muted);
        font-size: 0.75rem;
      }

      .bars {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        align-items: end;
        gap: clamp(0.4rem, 2vw, 1rem);
        min-height: 10rem;
        padding-top: 0.5rem;
        border-bottom: 1px solid var(--line);
      }

      .bar-year {
        display: grid;
        align-content: end;
        justify-items: center;
        gap: 0.45rem;
        height: 100%;
        min-width: 0;
      }

      .bar {
        width: min(3rem, 70%);
        min-height: 0.3rem;
        border-radius: 0.55rem 0.55rem 0 0;
        background: linear-gradient(180deg, var(--green), #a1d4ad);
      }

      .bar-year:nth-child(even) .bar {
        background: linear-gradient(180deg, var(--blue), #b4d5df);
      }

      .bar-year strong {
        color: var(--ink);
        font-size: 0.7rem;
        font-variant-numeric: tabular-nums;
      }

      .bar-year span {
        color: var(--muted);
        font-size: 0.7rem;
      }

      .bar-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-top: 0.85rem;
        color: var(--muted);
        font-size: 0.72rem;
      }

      .dot {
        display: inline-block;
        width: 0.55rem;
        height: 0.55rem;
        margin-right: 0.35rem;
        border-radius: 50%;
        background: var(--green);
      }

      .dot.blue {
        background: var(--blue);
      }

      .compare {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 1rem;
      }

      .compare-side {
        padding: 1.2rem;
        border-radius: 1rem;
        background: #eef3ec;
      }

      .compare-side.rent {
        background: #f4ede7;
      }

      .compare-side h3 {
        margin-bottom: 1rem;
      }

      .compare-side strong {
        display: block;
        margin-bottom: 0.25rem;
        font-size: clamp(1.45rem, 4vw, 2rem);
        letter-spacing: -0.07em;
        font-variant-numeric: tabular-nums;
      }

      .compare-side p {
        margin: 0;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.45;
      }

      .notes {
        margin-top: 1.4rem;
        color: var(--muted);
        font-size: 0.72rem;
        line-height: 1.5;
      }

      .workbench-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.7rem;
      }

      .workbench-head h1,
      .story-head h1 {
        max-width: 12ch;
        margin-bottom: 0.8rem;
        font-size: clamp(2.9rem, 7vw, 5.6rem);
      }

      .workbench-head .lede,
      .story-head .lede {
        max-width: 30rem;
      }

      .workbench-badge {
        flex: 0 0 auto;
        padding: 0.55rem 0.8rem;
        border-radius: 999px;
        color: var(--green-deep);
        background: var(--mint);
        font-size: 0.72rem;
        font-weight: 800;
      }

      .workbench-layout {
        display: grid;
        grid-template-columns: minmax(16rem, 0.58fr) minmax(0, 1.42fr);
        gap: 1rem;
        align-items: start;
      }

      .workbench-layout .controls {
        position: sticky;
        top: 1rem;
      }

      .workbench-output {
        display: grid;
        gap: 1rem;
        min-width: 0;
      }

      .number-hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 1rem;
        padding: clamp(1.2rem, 3vw, 2rem);
        border-radius: 1.3rem;
        color: white;
        background: var(--green-deep);
      }

      .number-hero .eyebrow {
        margin-bottom: 0.45rem;
        color: var(--yellow);
      }

      .number-hero h2 {
        margin-bottom: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.5rem, 3.5vw, 2.5rem);
        font-weight: 500;
      }

      .number-hero .big-number {
        margin: 0;
        font-size: clamp(2.2rem, 6vw, 4rem);
      }

      .table-wrap {
        overflow-x: auto;
      }

      .comparison-table {
        width: 100%;
        min-width: 30rem;
        border-collapse: collapse;
        font-size: 0.84rem;
      }

      .comparison-table th,
      .comparison-table td {
        padding: 0.9rem 0.4rem;
        border-bottom: 1px solid var(--line);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .comparison-table th:first-child,
      .comparison-table td:first-child {
        text-align: left;
      }

      .comparison-table th {
        color: var(--muted);
        font-size: 0.68rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .comparison-table td:first-child {
        color: var(--muted);
      }

      .comparison-table .accent {
        color: var(--green);
        font-weight: 850;
      }

      .workbench-lower {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(14rem, 0.9fr);
        gap: 1rem;
      }

      .ring {
        display: grid;
        place-items: center;
        width: 9rem;
        height: 9rem;
        margin: 0.5rem auto 1.2rem;
        border-radius: 50%;
        background: conic-gradient(var(--green) var(--interest-share), var(--yellow) 0);
      }

      .ring::after {
        display: grid;
        width: 6.7rem;
        height: 6.7rem;
        place-items: center;
        border-radius: 50%;
        content: "";
        background: white;
      }

      .ring-label {
        margin-top: -6.7rem;
        height: 6.7rem;
        display: grid;
        align-content: center;
        text-align: center;
        position: relative;
      }

      .ring-label strong {
        display: block;
        font-size: 1.4rem;
        font-variant-numeric: tabular-nums;
      }

      .ring-label span {
        color: var(--muted);
        font-size: 0.7rem;
      }

      .stat-list {
        display: grid;
        gap: 0.75rem;
        margin: 0;
      }

      .stat-list div {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--line);
      }

      .stat-list dt {
        color: var(--muted);
      }

      .stat-list dd {
        margin: 0;
        font-weight: 850;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .story-head {
        margin-bottom: 2rem;
      }

      .story-layout {
        display: grid;
        grid-template-columns: minmax(15rem, 0.58fr) minmax(0, 1.42fr);
        gap: clamp(1rem, 4vw, 3rem);
        align-items: start;
      }

      .story-layout > .controls {
        position: sticky;
        top: 1rem;
      }

      .story {
        display: grid;
        gap: 0;
        min-width: 0;
      }

      .story-step {
        display: grid;
        grid-template-columns: 3.2rem minmax(0, 1fr);
        gap: 1rem;
        padding-bottom: 2rem;
      }

      .story-step:last-child {
        padding-bottom: 0;
      }

      .step-number {
        display: grid;
        width: 2.6rem;
        height: 2.6rem;
        place-items: center;
        border: 1px solid var(--green);
        border-radius: 50%;
        color: var(--green);
        font-weight: 850;
      }

      .step-copy {
        padding-bottom: 2rem;
        border-bottom: 1px solid var(--line);
      }

      .story-step:last-child .step-copy {
        border-bottom: 0;
      }

      .step-copy h2 {
        margin-bottom: 0.45rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.55rem, 4vw, 2.35rem);
        font-weight: 500;
      }

      .step-copy > p {
        max-width: 38rem;
        margin-bottom: 1rem;
        color: var(--muted);
        line-height: 1.55;
      }

      .story-number {
        display: inline-block;
        margin-right: 0.35rem;
        color: var(--green-deep);
        font-size: clamp(2rem, 6vw, 3.5rem);
        font-weight: 850;
        letter-spacing: -0.08em;
        font-variant-numeric: tabular-nums;
      }

      .story-caption {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .ownership-bar {
        display: flex;
        height: 1.2rem;
        overflow: hidden;
        border-radius: 999px;
        background: #e6ebe4;
      }

      .ownership-bar span {
        display: block;
        min-width: 0.4rem;
        height: 100%;
      }

      .ownership-bar .deposit-part {
        background: var(--yellow);
      }

      .ownership-bar .principal-part {
        background: var(--green);
      }

      .ownership-bar .interest-part {
        background: var(--orange);
      }

      .story-compare {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.7rem;
      }

      .story-compare div {
        padding: 1rem;
        border-radius: 0.85rem;
        background: #eef3ec;
      }

      .story-compare div:last-child {
        background: #f4ede7;
      }

      .story-compare span {
        display: block;
        margin-bottom: 0.3rem;
        color: var(--muted);
        font-size: 0.72rem;
      }

      .story-compare strong {
        display: block;
        font-size: 1.2rem;
        font-variant-numeric: tabular-nums;
      }

      .switcher {
        position: fixed;
        z-index: 10;
        right: 50%;
        bottom: max(1rem, env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        gap: 0.25rem;
        min-height: 3.1rem;
        padding: 0.3rem;
        border: 1px solid rgba(23, 37, 31, 0.12);
        border-radius: 999px;
        background: rgba(23, 37, 31, 0.96);
        box-shadow: 0 0.8rem 2.4rem rgba(23, 37, 31, 0.25);
        color: white;
        transform: translateX(50%);
      }

      .switcher button {
        width: 2.4rem;
        height: 2.4rem;
        border: 0;
        border-radius: 50%;
        color: white;
        background: transparent;
        font-size: 1.2rem;
      }

      .switcher button:hover,
      .switcher button:focus-visible {
        background: rgba(255, 255, 255, 0.16);
        outline: 0;
      }

      .switcher-label {
        min-width: 9.5rem;
        padding: 0 0.4rem;
        text-align: center;
        font-size: 0.72rem;
        font-weight: 800;
      }

      .switcher-label span {
        color: var(--yellow);
      }

      :focus-visible {
        outline: 3px solid rgba(40, 116, 86, 0.36);
        outline-offset: 3px;
      }

      @media (max-width: 46rem) {
        .intro,
        .map-layout,
        .workbench-layout,
        .story-layout,
        .workbench-lower {
          grid-template-columns: minmax(0, 1fr);
        }

        .intro-note {
          justify-self: start;
        }

        .workbench-layout .controls,
        .story-layout > .controls {
          position: static;
        }

        .map-results {
          grid-template-rows: auto;
        }

        .workbench-head {
          display: block;
        }

        .workbench-badge {
          display: inline-block;
          margin-top: 1rem;
        }
      }

      @media (max-width: 23rem) {
        .site {
          padding-inline: 0.75rem;
        }

        .field-grid,
        .metric-strip,
        .compare,
        .story-compare {
          grid-template-columns: minmax(0, 1fr);
        }

        .metric-strip {
          gap: 1px;
        }

        .metric {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 1rem;
        }

        .metric-label {
          margin-bottom: 0;
        }

        .switcher-label {
          min-width: 7.5rem;
        }

        .bar-year strong {
          font-size: 0.58rem;
        }

        .bar-year span {
          font-size: 0.58rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <nav class="switcher" aria-label="Prototype variants">
      <button id="previousVariant" type="button" aria-label="Previous prototype view">&#8592;</button>
      <div class="switcher-label" id="variantLabel"></div>
      <button id="nextVariant" type="button" aria-label="Next prototype view">&#8594;</button>
    </nav>

    <script type="application/json" id="mortgage-manifest">
      {
        "currency": "£",
        "defaults": {
          "price": 360000,
          "deposit": 54000,
          "rate": 4.6,
          "years": 25,
          "rent": 1650,
          "rentGrowth": 3,
          "extra": 150,
          "homeGrowth": 2,
          "compareYears": 10
        },
        "limits": {
          "price": [50000, 2000000],
          "deposit": [0, 1900000],
          "depositPercent": [0, 95],
          "rate": [0, 20],
          "years": [5, 40],
          "rent": [0, 10000],
          "rentGrowth": [0, 15],
          "extra": [0, 3000],
          "homeGrowth": [-5, 10]
        },
        "copy": {
          "title": "See where your money goes.",
          "lede": "A mortgage is two payments hiding inside one. Explore how each pound becomes interest, ownership, or rent you never get back.",
          "disclaimer": "Illustrative only. Excludes maintenance, taxes, insurance, fees, investment returns, and changes in property value beyond your assumption.",
          "interestHint": "Interest is the price of borrowing. Overpaying attacks the balance earlier, so less interest has time to grow.",
          "rentHint": "Rent is a real cost, but it does not build ownership. This comparison uses your rent growth assumption and a flat set of running costs."
        },
        "variants": {
          "map": "Money map",
          "workbench": "Decision desk",
          "story": "The story"
        }
      }
    </script>

    <script>
      const manifest = JSON.parse(document.getElementById("mortgage-manifest").textContent);
      const currency = manifest.currency;
      const defaults = manifest.defaults;
      const variantNames = manifest.variants;
      const variants = Object.keys(variantNames);
      const queryVariant = new URLSearchParams(window.location.search).get("variant");
      let currentVariant = variants.includes(queryVariant) ? queryVariant : variants[0];
      let currentState = { ...defaults };

      const money = (value, digits = 0) => {
        const rounded = Number.isFinite(value) ? value : 0;
        return currency + Math.round(rounded).toLocaleString("en-GB", {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits
        });
      };

      const number = (value, digits = 0) => {
        const rounded = Number.isFinite(value) ? value : 0;
        return rounded.toLocaleString("en-GB", {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits
        });
      };

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

      function monthlyPayment(principal, annualRate, months) {
        const rate = annualRate / 100 / 12;
        if (rate === 0) return principal / months;
        return principal * (rate * (1 + rate) ** months) / ((1 + rate) ** months - 1);
      }

      function amortise(principal, annualRate, years, extra) {
        const months = years * 12;
        const basePayment = monthlyPayment(principal, annualRate, months);
        const monthlyRate = annualRate / 100 / 12;
        let balance = principal;
        let totalInterest = 0;
        let totalPaid = 0;
        let month = 0;
        const schedule = [];
        let yearInterest = 0;
        let yearPrincipal = 0;
        let yearPaid = 0;

        while (balance > 0.01 && month < months * 2) {
          const interest = balance * monthlyRate;
          const payment = Math.min(basePayment + extra, balance + interest);
          const principalPaid = Math.max(0, payment - interest);
          balance = Math.max(0, balance - principalPaid);
          totalInterest += interest;
          totalPaid += payment;
          month += 1;
          yearInterest += interest;
          yearPrincipal += principalPaid;
          yearPaid += payment;

          if (month % 12 === 0 || balance <= 0.01) {
            schedule.push({ year: Math.ceil(month / 12), balance, interest: yearInterest, principal: yearPrincipal, paid: yearPaid });
            yearInterest = 0;
            yearPrincipal = 0;
            yearPaid = 0;
          }
        }

        return { basePayment, balance, totalInterest, totalPaid, months: month, schedule };
      }

      function calculate(raw) {
        const price = clamp(raw.price, ...manifest.limits.price);
        const deposit = clamp(raw.deposit, 0, price * 0.95);
        const principal = Math.max(0, price - deposit);
        const rate = clamp(raw.rate, ...manifest.limits.rate);
        const years = clamp(raw.years, ...manifest.limits.years);
        const extra = clamp(raw.extra, ...manifest.limits.extra);
        const baseline = amortise(principal, rate, years, 0);
        const plan = amortise(principal, rate, years, extra);
        const monthlyRate = rate / 100 / 12;
        const firstMonthInterest = principal * monthlyRate;
        const firstMonthPrincipal = Math.max(0, Math.min(plan.basePayment + extra, principal + firstMonthInterest) - firstMonthInterest);
        const compareMonths = Math.min(manifest.defaults.compareYears * 12, years * 12);
        let rentTotal = 0;
        for (let month = 0; month < compareMonths; month += 1) {
          rentTotal += raw.rent * (1 + raw.rentGrowth / 100) ** Math.floor(month / 12);
        }

        const planAtHorizon = amortise(principal, rate, years, extra);
        const balanceAtHorizon = balanceAfterMonths(principal, rate, plan.basePayment + extra, compareMonths);
        const homeValue = price * (1 + raw.homeGrowth / 100) ** (compareMonths / 12);
        const equity = homeValue - balanceAtHorizon;
        const mortgageCash = deposit + paidThroughMonths(principal, rate, plan.basePayment + extra, compareMonths);
        const buyCost = mortgageCash - equity;
        const rentAdvantage = rentTotal - buyCost;
        const interestShare = plan.totalPaid ? plan.totalInterest / plan.totalPaid : 0;

        return {
          price, deposit, principal, rate, years, extra,
          rent: raw.rent, rentGrowth: raw.rentGrowth, homeGrowth: raw.homeGrowth,
          depositPercent: price ? deposit / price * 100 : 0,
          baseline, plan, monthly: plan.basePayment + extra,
          firstMonthInterest, firstMonthPrincipal,
          rentTotal, compareYears: compareMonths / 12,
          balanceAtHorizon, homeValue, equity, mortgageCash, buyCost, rentAdvantage,
          interestShare, monthsSaved: Math.max(0, baseline.months - plan.months),
          yearsSaved: Math.max(0, (baseline.months - plan.months) / 12)
        };
      }

      function balanceAfterMonths(principal, annualRate, payment, targetMonths) {
        const rate = annualRate / 100 / 12;
        let balance = principal;
        for (let month = 0; month < targetMonths && balance > 0.01; month += 1) {
          const interest = balance * rate;
          balance = Math.max(0, balance - Math.max(0, Math.min(payment, balance + interest) - interest));
        }
        return balance;
      }

      function paidThroughMonths(principal, annualRate, payment, targetMonths) {
        const rate = annualRate / 100 / 12;
        let balance = principal;
        let paid = 0;
        for (let month = 0; month < targetMonths && balance > 0.01; month += 1) {
          const interest = balance * rate;
          const actual = Math.min(payment, balance + interest);
          balance = Math.max(0, balance - Math.max(0, actual - interest));
          paid += actual;
        }
        return paid;
      }

      function input(id, label, value, prefix = "", suffix = "", type = "number", extraAttributes = "") {
        return `<div class="field"><label for="${id}">${label}</label><div class="input-wrap">${prefix ? `<span class="input-prefix">${prefix}</span>` : ""}<input id="${id}" data-field="${id}" type="${type}" value="${value}" ${extraAttributes} inputmode="decimal">${suffix ? `<span class="input-suffix">${suffix}</span>` : ""}</div></div>`;
      }

      function controls() {
        const state = currentState;
        return `<section class="panel controls" aria-label="Mortgage assumptions">
          <div class="controls-heading"><h2>Your starting point</h2><span>Change any number</span></div>
          <div class="field-grid">
            ${input("price", "Home price", state.price, currency)}
            ${input("deposit", "Deposit", state.deposit, currency)}
            ${input("depositPercent", "Deposit percentage", Math.round(state.deposit / state.price * 100), "", "%", "number", `min="${manifest.limits.depositPercent[0]}" max="${manifest.limits.depositPercent[1]}" step="1"`)}
            ${input("rate", "Interest rate", state.rate, "", "%", "number", `step="0.1"`)}
            ${input("years", "Mortgage term", state.years, "", "years", "number", `step="1"`)}
            ${input("rent", "Rent today", state.rent, currency, "/ month")}
          </div>
          <div class="overpay-box">
            <span class="field-title">The experiment: monthly overpayment</span>
            <div class="range-line"><input data-field="extra" type="range" min="${manifest.limits.extra[0]}" max="${manifest.limits.extra[1]}" step="25" value="${state.extra}" aria-label="Monthly overpayment slider"><input data-field="extra" type="number" min="${manifest.limits.extra[0]}" max="${manifest.limits.extra[1]}" step="25" value="${state.extra}" aria-label="Monthly overpayment amount"></div>
            <span class="field-title">Put more into the balance now. Watch interest fall.</span>
          </div>
          <div class="field-grid">
            ${input("rentGrowth", "Rent increase", state.rentGrowth, "", "% / year", "number", `step="0.5"`)}
            ${input("homeGrowth", "Home value change", state.homeGrowth, "", "% / year", "number", `step="0.5"`)}
          </div>
        </section>`;
      }

      function insight(data) {
        const savedText = data.yearsSaved > 0.05 ? `That saves ${number(data.yearsSaved, 1)} years and ${money(data.baseline.totalInterest - data.plan.totalInterest)} in interest.` : "Try adding an overpayment to see the balance move faster.";
        return `<div class="insight"><span class="insight-icon">↗</span><p><strong>Overpaying by ${money(data.extra)} / month.</strong> ${savedText}</p></div>`;
      }

      function bars(data) {
        const schedule = data.plan.schedule.slice(0, 5);
        const max = Math.max(...schedule.map((item) => item.interest + item.principal), 1);
        const compactMoney = (value) => `${currency}${Math.round(value / 1000)}k`;
        return `<div class="bars" aria-label="Mortgage payments by year">${schedule.map((item) => `<div class="bar-year"><div class="bar" style="height:${Math.max(5, (item.paid / max) * 100)}%" title="${money(item.paid)} paid in year ${item.year}"></div><strong>${compactMoney(item.balance)}</strong><span>Year ${item.year}</span></div>`).join("")}</div><div class="bar-legend"><span><i class="dot"></i>balance left at year end</span><span><i class="dot blue"></i>bars show yearly payment</span></div>`;
      }

      function mapView() {
        return `<main class="site">
          <div class="topbar"><a class="wordmark" href="index.html"><span class="mark">↗</span> Mortgage compass</a><a class="back-link" href="index.html">All prototypes</a></div>
          <section class="intro"><div><p class="eyebrow">Mortgage, made visible</p><h1>${manifest.copy.title}</h1><p class="lede">${manifest.copy.lede}</p></div><p class="intro-note">Start with your real numbers. Then turn the overpayment dial and watch the expensive part of the mortgage shrink.</p></section>
          <div class="map-layout">
            ${controls()}
            <div class="map-results">
              <section class="hero-result"><div><p class="eyebrow">Your monthly mortgage</p><h2><span class="big-number" data-output="monthly"></span><span class="number-caption">including your overpayment</span></h2></div><div class="first-month"><div><span>Month one to interest</span><strong data-output="firstMonthInterest"></strong></div><div><span>Month one to ownership</span><strong data-output="firstMonthPrincipal"></strong></div></div></section>
              <div class="metric-strip"><div class="metric"><span class="metric-label">Borrowed</span><span class="metric-value" data-output="principal"></span></div><div class="metric"><span class="metric-label">Total interest</span><span class="metric-value" data-output="totalInterest"></span></div><div class="metric"><span class="metric-label">Mortgage ends</span><span class="metric-value green" data-output="payoff"></span></div></div>
              ${insight({ extra: defaults.extra, yearsSaved: 0, baseline: { totalInterest: 0 }, plan: { totalInterest: 0 } })}
              <section class="panel chart-card"><div class="chart-header"><h2>Balance, over time</h2><span>With your extra payment</span></div><div data-chart></div></section>
            </div>
          </div>
          <section class="panel compare-card" style="margin-top:1rem"><div class="card-header"><h2>Buy or rent, at year ${manifest.defaults.compareYears}?</h2><span>Simple side-by-side</span></div><div class="compare"><div class="compare-side"><h3>Buy this home</h3><strong data-output="buyCost"></strong><p>Estimated net housing cost after the deposit, payments, and equity built.</p></div><div class="compare-side rent"><h3>Keep renting</h3><strong data-output="rentTotal"></strong><p>Rent paid over ${manifest.defaults.compareYears} years, growing at your assumption.</p></div></div><p class="notes">${manifest.copy.disclaimer}</p></section>
        </main>`;
      }

      function workbenchView() {
        return `<main class="site"><div class="topbar"><a class="wordmark" href="index.html"><span class="mark">↗</span> Mortgage compass</a><a class="back-link" href="index.html">All prototypes</a></div>
          <section class="workbench-head"><div><p class="eyebrow">Decision desk</p><h1>Make the trade-offs explicit.</h1><p class="lede">A compact workbench for comparing the cost of borrowing with the cost of waiting.</p></div><span class="workbench-badge">Live estimate</span></section>
          <div class="workbench-layout">${controls()}<div class="workbench-output"><section class="number-hero"><div><p class="eyebrow">Interest you can avoid</p><h2>Overpaying changes the finish line.</h2></div><span class="big-number" data-output="savedInterest"></span></section>
            <section class="panel chart-card"><div class="card-header"><h2>The two plans</h2><span>Same loan. Different behaviour.</span></div><div class="table-wrap"><table class="comparison-table"><thead><tr><th>Measure</th><th>Standard plan</th><th>Your plan</th><th>Change</th></tr></thead><tbody><tr><td>Monthly payment</td><td data-output="baseMonthly"></td><td class="accent" data-output="monthly"></td><td data-output="extraLabel"></td></tr><tr><td>Total interest</td><td data-output="baseInterest"></td><td class="accent" data-output="totalInterest"></td><td class="accent" data-output="savedInterest"></td></tr><tr><td>Mortgage length</td><td data-output="basePayoff"></td><td class="accent" data-output="payoff"></td><td class="accent" data-output="yearsSaved"></td></tr><tr><td>Balance after ${manifest.defaults.compareYears} years</td><td data-output="baseBalance"></td><td class="accent" data-output="balance"></td><td data-output="balanceChange"></td></tr></tbody></table></div></section>
            <div class="workbench-lower"><section class="panel story-card"><div class="card-header"><h2>What is in the payment?</h2><span>Across the full plan</span></div><div class="ring" data-ring></div><div class="ring-label"><strong data-output="interestShare"></strong><span>of mortgage payments are interest</span></div><dl class="stat-list"><div><dt>Principal</dt><dd data-output="principal"></dd></div><div><dt>Interest</dt><dd data-output="totalInterest"></dd></div><div><dt>Paid altogether</dt><dd data-output="totalPaid"></dd></div></dl></section><section class="panel compare-card"><div class="card-header"><h2>Ten-year snapshot</h2><span>Buy versus rent</span></div><div class="compare"><div class="compare-side"><h3>Ownership</h3><strong data-output="equity"></strong><p>Estimated equity in the home after ${manifest.defaults.compareYears} years.</p></div><div class="compare-side rent"><h3>Rent paid</h3><strong data-output="rentTotal"></strong><p>Paid out with no property balance left.</p></div></div><p class="notes">${manifest.copy.disclaimer}</p></section></div>
          </div></div></main>`;
      }

      function storyView() {
        return `<main class="site"><div class="topbar"><a class="wordmark" href="index.html"><span class="mark">↗</span> Mortgage compass</a><a class="back-link" href="index.html">All prototypes</a></div>
          <section class="story-head"><p class="eyebrow">The story of a pound</p><h1>Follow your money through the loan.</h1><p class="lede">Most mortgage totals feel abstract. This view turns the same calculation into three moments: entering, paying, and owning.</p></section>
          <div class="story-layout">${controls()}<div class="story"><article class="story-step"><span class="step-number">01</span><div class="step-copy"><h2>First, you bring a starting stake.</h2><p>Your deposit lowers what you need to borrow. In this plan, the bank lends you <span class="story-number" data-output="principal"></span>, secured against a home worth <span class="story-number" data-output="price"></span>.</p><div class="story-compare"><div><span>Your deposit</span><strong data-output="deposit"></strong></div><div><span>Deposit percentage</span><strong data-output="depositPercent"></strong></div></div></div></article>
            <article class="story-step"><span class="step-number">02</span><div class="step-copy"><h2>Then every payment splits in two.</h2><p>At the beginning, interest has the bigger voice because the balance is largest. Principal is the part that turns into ownership.</p><div class="story-compare"><div><span>Month one to interest</span><strong data-output="firstMonthInterest"></strong></div><div><span>Month one to ownership</span><strong data-output="firstMonthPrincipal"></strong></div></div></div></article>
            <article class="story-step"><span class="step-number">03</span><div class="step-copy"><h2>Overpaying moves the finish line.</h2><p>Put an extra <span class="story-number" data-output="extra"></span> into the balance each month and you avoid <span class="story-number" data-output="savedInterest"></span> of interest. That is money that stays with you.</p><div class="ownership-bar" data-ownership-bar aria-label="Deposit, principal and interest proportions"></div><div class="bar-legend"><span><i class="dot" style="background:var(--yellow)"></i>deposit</span><span><i class="dot"></i>principal paid</span><span><i class="dot" style="background:var(--orange)"></i>interest paid</span></div></div></article>
            <article class="story-step"><span class="step-number">04</span><div class="step-copy"><h2>At year ${manifest.defaults.compareYears}, see what remains.</h2><p>Buying leaves you with an asset and a balance. Renting leaves you with flexibility and a rent bill. Neither is automatically right; now you can see the assumptions behind the choice.</p><div class="story-compare"><div><span>Estimated home equity</span><strong data-output="equity"></strong></div><div><span>Rent paid by then</span><strong data-output="rentTotal"></strong></div></div><p class="notes">${manifest.copy.rentHint} ${manifest.copy.disclaimer}</p></div></article>
          </div></div></main>`;
      }

      function readInputs() {
        const values = {};
        document.querySelectorAll("[data-field]").forEach((field) => {
          if (field.type === "range" && values[field.dataset.field] !== undefined) return;
          values[field.dataset.field] = Number(field.value) || 0;
        });
        return { ...defaults, ...values };
      }

      function setOutput(name, value) {
        document.querySelectorAll(`[data-output="${name}"]`).forEach((element) => {
          element.textContent = value;
        });
      }

      function updateView() {
        const data = calculate(readInputs());
        setOutput("monthly", money(data.monthly));
        setOutput("baseMonthly", money(data.plan.basePayment));
        setOutput("principal", money(data.principal));
        setOutput("deposit", money(data.deposit));
        setOutput("depositPercent", `${number(data.depositPercent, 0)}%`);
        setOutput("price", money(data.price));
        setOutput("extra", money(data.extra));
        setOutput("firstMonthInterest", money(data.firstMonthInterest));
        setOutput("firstMonthPrincipal", money(data.firstMonthPrincipal));
        setOutput("totalInterest", money(data.plan.totalInterest));
        setOutput("baseInterest", money(data.baseline.totalInterest));
        setOutput("totalPaid", money(data.plan.totalPaid));
        setOutput("savedInterest", money(data.baseline.totalInterest - data.plan.totalInterest));
        setOutput("payoff", `${number(data.plan.months / 12, 1)} yrs`);
        setOutput("basePayoff", `${number(data.baseline.months / 12, 1)} yrs`);
        setOutput("yearsSaved", data.yearsSaved > 0.05 ? `-${number(data.yearsSaved, 1)} yrs` : "-");
        setOutput("balance", money(data.balanceAtHorizon));
        setOutput("baseBalance", money(balanceAfterMonths(data.principal, data.rate, data.baseline.basePayment, data.compareYears * 12)));
        setOutput("balanceChange", money(data.balanceAtHorizon - balanceAfterMonths(data.principal, data.rate, data.baseline.basePayment, data.compareYears * 12)));
        setOutput("extraLabel", data.extra ? `+${money(data.extra)}` : "-");
        setOutput("rentTotal", money(data.rentTotal));
        setOutput("equity", money(data.equity));
        setOutput("buyCost", money(data.buyCost));
        setOutput("interestShare", `${number(data.interestShare * 100, 0)}%`);
        document.querySelectorAll("[data-ring]").forEach((element) => element.style.setProperty("--interest-share", `${data.interestShare * 100}%`));
        document.querySelectorAll("[data-chart]").forEach((element) => { element.innerHTML = bars(data); });
        document.querySelectorAll("[data-ownership-bar]").forEach((element) => {
          const total = data.deposit + data.plan.totalInterest + data.principal;
          element.innerHTML = `<span class="deposit-part" style="width:${data.deposit / total * 100}%"></span><span class="principal-part" style="width:${data.principal / total * 100}%"></span><span class="interest-part" style="width:${data.plan.totalInterest / total * 100}%"></span>`;
        });
        document.querySelectorAll(".insight").forEach((element) => { element.outerHTML = insight(data); });
      }

      function bindInputs() {
        document.querySelectorAll("[data-field]").forEach((field) => field.addEventListener("input", (event) => {
          const name = event.target.dataset.field;
          if (name === "depositPercent") {
            const price = Number(document.querySelector('[data-field="price"]').value) || defaults.price;
            const deposit = clamp(price * Number(event.target.value) / 100, 0, price * 0.95);
            document.querySelectorAll('[data-field="deposit"]').forEach((inputField) => { inputField.value = Math.round(deposit); });
          }
          if (name === "deposit") {
            const price = Number(document.querySelector('[data-field="price"]').value) || defaults.price;
            const percent = clamp(Number(event.target.value) / price * 100, 0, 95);
            document.querySelectorAll('[data-field="depositPercent"]').forEach((inputField) => { inputField.value = Math.round(percent); });
          }
          if (name === "price") {
            const price = Number(event.target.value) || defaults.price;
            const deposit = Number(document.querySelector('[data-field="deposit"]').value) || defaults.deposit;
            document.querySelectorAll('[data-field="depositPercent"]').forEach((inputField) => { inputField.value = Math.round(clamp(deposit / price * 100, 0, 95)); });
          }
          if (name === "extra") document.querySelectorAll('[data-field="extra"]').forEach((inputField) => { inputField.value = event.target.value; });
          currentState = readInputs();
          updateView();
        }));
      }

      function changeVariant(offset) {
        currentState = readInputs();
        currentVariant = variants[(variants.indexOf(currentVariant) + offset + variants.length) % variants.length];
        const url = new URL(window.location.href);
        url.searchParams.set("variant", currentVariant);
        window.history.replaceState({}, "", url);
        render();
      }

      function render() {
        document.getElementById("app").innerHTML = currentVariant === "workbench" ? workbenchView() : currentVariant === "story" ? storyView() : mapView();
        document.getElementById("variantLabel").innerHTML = `<span>${currentVariant.toUpperCase()}</span> · ${variantNames[currentVariant]}`;
        bindInputs();
        updateView();
      }

      document.getElementById("previousVariant").addEventListener("click", () => changeVariant(-1));
      document.getElementById("nextVariant").addEventListener("click", () => changeVariant(1));
      document.addEventListener("keydown", (event) => {
        if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
        if (event.key === "ArrowLeft") changeVariant(-1);
        if (event.key === "ArrowRight") changeVariant(1);
      });
      render();
    </script>
  </body>
</html>
