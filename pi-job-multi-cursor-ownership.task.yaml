context: 'Problem: a single saved cursor blocks parallel agents on independent Ready slices.


  Need:

  - More than one cursor per task, with ownership

  - Agent creates its own cursor when it starts working on a slice; releases when the slice work is done,
  or when the agent is done with the task

  - Definition of done working with the task: user asks to remove the cursor

  - Stale cursors concept (abandoned/orphaned ownership)

  - Agent is free to create its own cursor for its own identity (identity TBD)

  - Multiple agents create/release cursors independently


  Goal: enable multiple agents to work in parallel on independent slices in one task.'
orchestration:
  cursors: []
  policy:
    coding_execution:
      subagent_required: true
      lower_power_model_preferred: true
      orchestrator_reviews_subagent: true
      exceptions: []
  artifacts: {}
  content_digest: 6dfc54ab8fa7c588db32f2ce64c52f9153f51ad00e2ac4af50ca69a85e829cf0
decisions:
- date: '2026-08-11'
  note: 'Claim unit: one owner per slice. Slices are sequential; a cursor owns a whole slice, not a step
    inside it.'
  source: clarify-scope 2026-08-11
- date: '2026-08-11'
  note: 'Owner identity: agent-chosen. Explore whether pi-job can offer a stable default owner id derived
    from session signals (e.g. cwd, parent pid); not required that agents use it.'
  source: clarify-scope 2026-08-11
- date: '2026-08-11'
  note: 'Release: auto-release when slice work completes (finish/done path), plus explicit release (user
    asks to remove cursor / agent done with task).'
  source: clarify-scope 2026-08-11
- date: '2026-08-11'
  note: 'Stale cursors: status flags plus optional TTL-based staleness. Reclaim/force-release is a later
    detail under that model.'
  source: clarify-scope 2026-08-11
- date: '2026-08-11'
  note: 'Compatibility: no single-cursor compatibility shim required. Hard cut to multi-cursor with ownership.'
  source: clarify-scope 2026-08-11
- date: '2026-08-11'
  note: 'Cursor binding: mutating commands and disambiguating reads take `--owner <id>` (optional env
    default `PI_JOB_OWNER`). One active claim per owner; claim record is `{owner, slice, step, claimed_at,
    last_seen}`. No separate cursor UUID for v1.'
  source: wayfinder grill 2026-08-11
- date: '2026-08-11'
  note: 'Claim lifecycle: explicit `claim --slice KEY --owner ID` before start. Mutating commands refuse
    if the owner has no claim or the claim''s slice mismatches. Auto-release on slice completion; `release
    --owner` for explicit drop. No silent claim inside start.'
  source: wayfinder grill 2026-08-11
- date: '2026-08-11'
  note: 'Auto-release: drop the owner''s claim when the claimed slice reaches terminal status (done or
    skipped). Mid-slice `release --owner` abandons the claim only; slice state is unchanged and the slice
    becomes claimable again.'
  source: wayfinder grill 2026-08-11
- date: '2026-08-11'
  note: 'Claim eligibility: only Ready slices (deps satisfied, not terminal) with no active non-stale
    claim. A stale claim does not block; a new claim displaces it (previous owner may still be around;
    that is accepted). Surface displacement clearly in status/output.'
  source: wayfinder grill 2026-08-11
- date: '2026-08-11'
  note: 'Staleness: mutating commands for an owner bump `last_seen`. A claim is stale when `now - last_seen
    > TTL`. Default TTL is 24h in the profile (overridable later). status/show flag stale claims. No heartbeat
    daemon in v1.'
  source: wayfinder grill 2026-08-11
- date: '2026-08-11'
  note: 'Hard cut: replace `orchestration.cursor` with `orchestration.cursors`. No read-path shim and
    no migrate-task conversion for legacy single-cursor files. Stop using the old field; that is the whole
    compatibility story.'
  source: wayfinder grill 2026-08-11
- date: '2026-08-11'
  note: 'Owner identity helper: deferred. v1 requires explicit `--owner` or `PI_JOB_OWNER`. No cwd/ppid
    auto-id on the critical path; optional suggest command only if friction appears later.'
  source: wayfinder grill 2026-08-11
- date: '2026-08-11'
  note: 'Release authority: `release --owner ID` may drop any claim (not self-only). User/orchestrator
    can clear non-stale stuck claims immediately. Stale displacement on claim remains the unattended path.'
  source: wayfinder grill 2026-08-11
- date: '2026-08-11'
  note: 'Delivery shape: develop directly on master in this chezmoi/harness tree. No feature branches,
    worktrees, or PRs for this effort. Skip share-with-team / set-worktree / add-pr paths; verify and
    land in-tree.'
  source: wayfinder grill 2026-08-11
- date: '2026-08-11'
  note: 'Owner resolution: `--owner` / `PI_JOB_OWNER` preferred but not mandatory when the target claim
    is unambiguous (e.g. exactly one active claim). Do not force owner on every mutating call; stay out
    of the agent''s way.'
  source: grill-plan 2026-08-11
- date: '2026-08-11'
  note: 'One claim per owner: an owner may hold at most one active claim. A second `claim` while another
    claim is held refuses until `release` or auto-release of the first.'
  source: grill-plan 2026-08-11
- date: '2026-08-11'
  note: SUPERSEDES earlier claim shape that included step. Owned claim is `{owner, slice, claimed_at,
    last_seen}` only. Active step is derived as the claimed slice's first non-terminal step. No stored
    step on the cursor for v1.
  source: grill-plan 2026-08-11
- date: '2026-08-11'
  note: No advance in the multi-cursor agent loop. Position is claim + derived first non-terminal step.
    After finish, continue with instruction/start on the new first non-terminal; when the slice is terminal,
    claim auto-releases and the next Ready slice is claimed. Remove or leave advance unused pending cleanup;
    do not require it after finish.
  source: grill-plan 2026-08-11
