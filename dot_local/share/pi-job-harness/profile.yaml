# Live execution profile validated by ProfileDocument in bin/pi-job.
# Mapping keys must match each entry's key field; step and slice references must resolve.
config_layering:
  user_defaults: true
  repo_overrides: true
  precedence: repo-over-user
artifact_rules:
  decision_review_deck:
    key: decision_review_deck
    purpose: Create a two-minute async decision review deck when durable decisions need team review.
    trigger: task.decisions contains decisions worth presenting, or the user asks for a decision walkthrough
    inputs:
      - task.decisions
      - task.plan.slices
    outputs:
      - projects/<project>/<YYYY-MM-DD>-<topic>-review.md
    guardrails:
      - pull decisions from the durable task record, not the diff
      - use slides separated by ---
      - include ASCII before/after or flow diagrams for decision slides
      - avoid file names, function names, and test counts
    validator: deck path recorded or skip reason recorded
  daily_boo:
    key: daily_boo
    purpose: Append a personal aha-moment entry worth revisiting later.
    trigger: session produced a real aha or revisit-worthy domain insight
    inputs:
      - session_insights
    outputs:
      - daily.boo.txt append
    guardrails:
      - append only via skills/daily-boo/scripts/append.sh
      - never read daily.boo.txt
      - do not use for task tracking, PR status, or agent lessons
      - skip rather than pad a thin entry
    validator: append command recorded or skip reason recorded
  share_with_team:
    key: share_with_team
    purpose: Create team-facing tickets and PRs from the completed work.
    trigger: an implement slice reaches share-with-team, or a closing reconciliation finds an unshared repo
    inputs:
      - task.plan
      - verification_evidence
    outputs:
      - ticket keys
      - pull request URLs
      - team feedback thread
    guardrails:
      - invoke share-with-team once per repository changed
      - reconcile against repos already shared; do not double-open a ticket or PR for an already-shared repo
      - use the share-with-team ticket template (skills/share-with-team/SKILL.md § Ticket)
      - |-
        Before writing any PR body: (1) check the target repo for a template at
        .github/pull_request_template.md, .github/PULL_REQUEST_TEMPLATE.md, or any file
        under .github/PULL_REQUEST_TEMPLATE/; (2) if found, fill that template exactly,
        section by section - do not invent a different structure; (3) if absent, use the
        share-with-team skill's fallback template (skills/share-with-team/SKILL.md §
        PR description: Vocabulary, How <feature> works, What this PR adds, quirks,
        Errors, Known limitation, Tests) - do not freehand a bespoke PR body in either
        case.
      - include e2e evidence or explicitly record the gap
      - do not treat sharing as terminal; wait for team feedback and loop on it
    validator: ticket and PR links recorded with feedback wait state, or skip reason recorded
toolbelt:
  httpyac-api-spec:
    key: httpyac-api-spec
    title: httpyac API spec
    purpose: Request/response contract for new/changed endpoints; doubles as a manual test once built.
    suits:
      - setup
      - implement
      - spike
  sequence-diagram:
    key: sequence-diagram
    title: Sequence diagram
    purpose: Cross-service / hand-off flow (park/resume, timers, polling).
    suits:
      - setup
      - research
  test-case-table:
    key: test-case-table
    title: Test-case table
    purpose: Core journeys + edge cases, each marked v0/v1/v2.
    suits:
      - setup
      - implement
      - spike
  state-transition-table:
    key: state-transition-table
    title: State-transition table
    purpose: Resource lifecycle / status transitions with the rule per edge.
    suits:
      - setup
      - research
  config-flag-matrix:
    key: config-flag-matrix
    title: Config / flag matrix
    purpose: Feature-flag x market/programme x env/region grid with default values.
    suits:
      - setup
  data-shape-sketch:
    key: data-shape-sketch
    title: Data-shape sketch
    purpose: FHIR resource / extension / ValueSet shapes being added or read.
    suits:
      - setup
      - research
  endpoint-status-map:
    key: endpoint-status-map
    title: Endpoint status map
    purpose: >-
      One journey's mutating endpoints in causal order, each with a before->after
      status contract (resource roles, non-effects, dual writers). Not a generic
      sequence or architecture diagram.
    suits:
      - setup
      - research
      - implement
      - spike
    example: |-
      Build an **endpoint status map** for this ticket.

      ## Name
      `{journey short name} - endpoint status map`

      ## Scope
      - One primary journey only (happy path + the failure under investigation).
      - Systems in play (P3 / PI / SF / Camunda / Graphius). Do not widen to unrelated markets.

      ## Method
      1. List mutating endpoints in causal order (who calls whom).
      2. For each endpoint capture a row:
         - Endpoint (method + path)
         - Caller (Camunda task / SF EventBridge / Graphius / ...)
         - PI service (if any)
         - Resources touched (roles: prescribed MR, requested/winner MR, SR, addons)
         - Status / field rules: before -> after
         - Explicit non-effects (does NOT set X)
         - Failure mode if relevant (HTTP status + meaning)
      3. Draw a vertical flow of those endpoints only.
      4. Add a compact table under the diagram with the same rows.
      5. Call out dual writers (two paths that can set the same status) and the invariant each owns.
      6. Ground every status rule in a code/BPMN reference (file or ticket), not memory.
      7. End with: "what this ticket's failure maps to" (which step broke which rule).

      ## Output shape
      1. One mermaid/ASCII flow (endpoints + status deltas on arrows or under steps)
      2. One table: Endpoint | Caller | Resources | Status rules | Notes
      3. Optional: 3-5 line "tonight's case" overlay

      ## Do not
      - Include read-only GETs unless they are the gate
      - Mix accept + decline + timeout into one diagram unless the ticket is the shared matrix
      - Use opaque UUIDs as primary labels (put them in a separate evidence table)

      ## Rules of thumb
      - Time order of writers only.
      - Mutations only (or fields later gates need, e.g. requester).
      - Resource roles, not UUIDs.
      - Per endpoint: one status contract + explicit non-effects.
      - Surface dual writers; fail-closed notes; code over folklore.
      - Happy path first, then tonight's fork.

pr_template_guardrail: &pr_template_guidance |-
  Before writing any PR body: (1) check the target repo for a template at
  .github/pull_request_template.md, .github/PULL_REQUEST_TEMPLATE.md, or any file
  under .github/PULL_REQUEST_TEMPLATE/; (2) if found, fill that template exactly,
  section by section - do not invent a different structure; (3) if absent, use the
  share-with-team skill's fallback template (skills/share-with-team/SKILL.md §
  PR description: Vocabulary, How <feature> works, What this PR adds, quirks,
  Errors, Known limitation, Tests) - do not freehand a bespoke PR body in either
  case.
  After opening the PR, record it:
    pi-job --task TASK_FILE add-pr --slice SLICE_KEY --repo REPO --url URL --status open
  Prefer `gh pr create --head <branch>` right after the first push of a new branch
  (avoids the "must first push" abort).
plan_and_grill_guardrail: &plan_and_grill_guidance |-
  Before other implement/spike steps, lead with create-plan then grill-plan:
  (1) create-plan - sibling Markdown plan file as a constraint-and-behaviour contract
      (not a how-to essay or delivery journal).
      Required sections: intent, types and composition, call stacks, system behaviour,
      constraints, verification; optional short touch surface.
      Types and composition: prefer pseudo-code (fenced type/interface sketch, any
      language tag) plus prose boundaries.
      Call stacks: one indented stack (e.g. handler -> service -> store); note
      test/memory swaps inline; prefer a shallow stack over `Call stacks: N/A - <reason>`.
      Do not restate the slice goal; do not inline the plan body in the task file.
      Do not move delivery status, cursor, or session journals into plan files
      (pi-job store owns those).
      DX and agent experience share the same constructs: clear names and short contracts.
      Persist product/scope/architecture/policy agreements with `pi-job add-decision`
      (and/or the grilled plan); do not leave load-bearing scope choices only in chat.
      Step evidence belongs in `finish --note`, not `add-decision`.
      Token smell: shrink the slice or contract; do not dump more of the task store.
      Naming: `<task-stem>.plans/<slice-key>.md`. create-plan note is ONLY
      `Plan file: <task-stem>.plans/<slice-key>.md` (relative to the task file's directory).
  (2) grill-plan - grill-me skill (skills/grill-me/SKILL.md).
      Challenge behaviour, boundaries, must-not constraints, verification, types and
      composition, and call stacks; prose volume is not an acceptance criterion.
      Note what changed; revise the plan FILE and re-grill until it survives.
      After grill survives, capture product/scope choices that should outlive the session
      with `pi-job add-decision` (date/note/source), not only in chat.
      Do not use add-decision for PR, deploy, e2e, or progress chatter.
  Advance blocks past incomplete create-plan/grill-plan. Distinct from setup `grill`.
  Exception: trivial single-file edit may skip both (status: skipped, one-line reason) -
  same class as coding_execution.exceptions; only way to omit types and composition / call stacks.
  Soft enforcement: guidance + phrase locks + seeded stub; no hard plan-file heading linter.
  If a seed stub already exists, revise it rather than starting blank.
sync_pipeline_instructions: |-
  ACTION REQUIRED: this command only reads the task file - it never calls GitHub or Jira.
  The slice list below is LAST-RECORDED state, not live remote status.
  Do not treat this listing as current truth, and do not stop after printing it.
  For each listed slice, immediately run (orchestrator or per-slice subagent):
    1. checklist - verify PR/merge state and whether the recorded step/slice status still matches reality
    2. verify - gh pr view <url> + optional git merge-base --is-ancestor <sha> main
    3. add-pr --status merged|closed if the PR state changed
    4. finish --note '<append-style evidence>' to record what was found
    5. advance to move past the verified step when the current step is complete
    6. Jira ticket status update if applicable
  Do not report this list to the user as current status until step 2 has run for every open PR
  (and every listed in_progress/blocked slice has been checked).
cli_help:
  add_decision:
    command: append a product/scope decision (not step evidence; use finish --note)
    note: >-
      decision rationale as Markdown (preferred); rendered as a blockquote in `pi-job markdown`.
      Shell-safe: pass --note with single quotes or a HEREDOC; bare backticks in double-quoted
      shell args are command-substituted (example: --note 'Keep expiresAt as-is').
  finish:
    note: >-
      append completion/evidence for this step (not product decisions; use add-decision);
      Markdown preferred; rendered formatted in `pi-job markdown`; omitted preserves the
      existing note; when supplied appends with a blank line; --replace overwrites instead.
      Shell-safe: pass --note with single quotes or a HEREDOC so backticks/paths are not
      executed by the shell (example: finish --note 'Ran yarn test in worktree').
      When more than one unfinished step exists, pass --slice KEY --step KEY.
instruction_packets:
  todo_tracking: |-
    - Align session todos with `pi-job plan`; set cursor {cursor} in_progress until step gates pass or skip is recorded.
  future_work: |-
    - Spawn a new slice for follow-up work; do not bury actionable items in notes only.
  record_results_intro: |-
    Task record is machine-owned; use pi-job commands only (TASK_FILE / SLICE_KEY in header).
    Channels: pi-job channels. This step:
  task_record_discipline: |-
    The task record is machine-owned; do not open or edit the task store directly.
    TASK_FILE is the path passed to `--task` (see packet header). SLICE_KEY is the current slice key.
    Reads: pi-job --task TASK_FILE status | plan | markdown [--slice SLICE_KEY] | show [--slice SLICE_KEY] | instruction.
    Writes: pi-job mutation commands (start, finish [--replace], advance, add-slice, add-step, set-slice, block-slice, unblock-slice, set-project, set-context, add-decision, set-plan-note, remove-slice, set-worktree, add-pr, acknowledge-edit); see pi-job --help for the rest.
    Write notes and decisions as Markdown so `pi-job markdown` can render them formatted (decisions as blockquotes; context/notes as Markdown prose or quotes).
    Why: direct inspection loads the whole record into context (token cost); hand-edits bypass validation and orchestration guards.
    Token smell: if a step needs a huge dump to proceed, shrink the contract or the slice; do not dump more of the store into context.
    DX and agent experience share the same constructs: clear names, small packets, and machine-readable contracts help both.
    Full channel map: pi-job channels (or pi-job channels --step KEY for one step).
  next_action: |-
    Do not wait for another user prompt.
    1. If the current slice has no execution metadata: `pi-job --task TASK_FILE start --slice-only --model <orchestrator-model-id>`
    2. `pi-job --task TASK_FILE start --model <fully-qualified-model-id>`
    3. Execute cursor {cursor} per this packet
    4. `pi-job --task TASK_FILE finish` with evidence, then `pi-job --task TASK_FILE advance`, then `pi-job --task TASK_FILE instruction`
    5. If advance/instruction emits a pick-next packet: run `pi-job show`, choose a Ready slice, `advance --slice KEY --step STEP`, then `instruction`
    Pause only for user-decision steps (clarify/grill/requires_user_decision) or a recorded blocker.
  pick_next_slice: |-
    The current slice has no unfinished steps (or the cursor is not on actionable work).
    Array order of plan.slices is not execution order - you choose among Ready slices.
    1. Run `pi-job --task TASK_FILE show` and inspect Ready-marked slices
    2. Choose one Ready slice (deps satisfied; unfinished)
    3. `pi-job --task TASK_FILE advance --slice KEY --step STEP` (first unfinished step of that slice)
    4. `pi-job --task TASK_FILE instruction`
    Do not wait for the user. If Ready is empty and the task is not done, record a blocker or fix depends_on.
    If the task is done, stop.
  orchestrator: |-
    - Role: orchestrator (CLI-only for the store). Supersedes any default workspace role (e.g. Product Owner) while this task is active.
    - Enter the orchestrator loop immediately after this packet (including right after create, or instruction).
    - Do not wait for the user to say "continue".
    - Loop: start → execute this step → finish with evidence → advance → instruction.
    - When a slice is exhausted: follow the pick-next packet (show → choose Ready → advance --slice/--step → instruction).
    - Pause only when the step requires a user decision, grill/clarify answers, or a recorded blocker.
    - Execute this step in the main orchestration session.
    - Do not skip required artifacts or validators from the task contract.
    - Run pi-job advance only after the step evidence is recorded or a blocker is written down.
  subagent_orchestrator: |-
    - Choose an appropriate lower-cost model using judgement for the coding/subagent pass.
    - Run this step in a subagent.
    - Give the subagent the prompt below exactly, plus any runtime tool context it needs.
    - Tell the subagent to run first: pi-job --task TASK_FILE markdown --slice SLICE_KEY --with-decisions
    - Do not paste a decisions dump into the subagent prompt; the markdown --slice --with-decisions read loads binding decisions.
    - Review the subagent result before running pi-job advance.
      Prefer a higher-reasoning model for that review pass than the subagent used to write
      the change (spot incorrect assumptions, missed edge cases, and unsafe defaults).
    - After review, continue the orchestrator loop (finish → advance → instruction); do not wait for "continue".
  subagent_prompt: |-
    This packet is your execution context; do not inspect the task store directly.
    TASK_FILE is the path passed to `--task` (see packet header). SLICE_KEY is the current slice key.
    Before any other work, run: pi-job --task TASK_FILE markdown --slice SLICE_KEY --with-decisions
    Treat every ## Decisions entry as binding. If SUPERSEDED/RESOLVED, follow the superseding entry.
    On conflict or a blocking decision, STOP and report - do not re-litigate.
    New product/scope/architecture/policy decisions only via add-decision.
    Step evidence (e2e, PR/merge/deploy, WIP/RESOLVED progress) via finish --note / add-pr / plan file - never add-decision.
    RCA / interrupt evidence via add-finding (appends to .plans/_findings.md), not add-decision.
    For sibling-step evidence in this slice after decisions are loaded, run: pi-job --task TASK_FILE show --slice SLICE_KEY
    Execute only cursor {cursor}.
    Return changed files, commands run, verification evidence, and unresolved risks.
    Do not advance the task record unless this cursor step explicitly asks for task-record updates.
  plan_todo: |-
    - Use the session todo capability to track this task plan.
    - Create one todo per slice (or per step when helpful).
    - Mark the current/next slice/step in_progress; mark completed items done as evidence lands.
    - Keep todos aligned with pi-job status/plan; do not invent parallel plans outside the contract.
  out_of_band_edit_warning: |-
    warning: task file semantic content does not match the last pi-job write digest.
    Prefer pi-job mutation commands over hand-edits (see pi-job --help; Writes in the task-record discipline packet).
    For a legitimate hand-edit run: pi-job --task {task_file} acknowledge-edit --reason '<why>'
    (appends the reason to the current cursor slice note and refreshes the digest; not a decision).
  missing_task_hint: |-
    task store not found: {task_file}
    create and initialize one with:
      pi-job --task {task_file} create --kind setup
    or from an intent document:
      pi-job --task {task_file} create --from <intent.yaml>
    for an empty plan (add slices yourself, then re-run create):
      pi-job --task {task_file} create --empty-plan
  seed_slice_plans: |-
    Create these plan files immediately from known task context, decisions, goals, and deps.
    Do not wait until each slice's create-plan cursor.
    Later create-plan revises the same path; note stays: Plan file: <task-stem>.plans/<key>.md
    Work against task <TASK>.
  slice_plan_stub: |-
    # {key}

    ## Goal
    {goal}

    ## Depends on
    {depends_on}

    ## Intent
    -

    ## Types and composition
    ```ts
    // prefer fenced type/interface sketch + prose boundaries
    ```

    ## Call stacks
    ```ts
    // one indented stack; note test/memory swaps inline when they matter
    // shallow: edit-code -> file -> function  (prefer over N/A)
    ```

    ## System behaviour
    -

    ## Constraints
    -

    ## Verification
    -

    ## Touch surface
    -

    ## Open questions
    -

    ## Decisions
    - (slice-local; product decisions go via add-decision)
  findings_file_header: |-
    # Findings

    Append-only RCA / evidence log for this task.
    Do not put long findings in the task YAML.
  status_interrupt_hint: >-
    Cursor parked (user-decision); interrupt work OK via investigate / add-finding / add-slice / block-slice
  investigate_interrupt: |-
    PI-JOB INVESTIGATE (interrupt)

    Task file: {task_file}
    Saved cursor: {cursor_label} (do not advance / finish / claim it)
    Topic: {topic}

    Rules:
    - This is side work against the task; the parked cursor stays parked.
    - Do not run advance/finish/start on the saved cursor for this investigation.
    - Record RCA/evidence with: pi-job --task {task_file} add-finding --note '...'
      (appends to {pointer}; never long YAML).
    - Product/scope agreements still use add-decision (prefer short / --plan-file).
    - When the fix is clear: add-slice and/or block-slice --gate <fix-slice>.

    {finding_status}

    Suggested follow-ups (manual):
      pi-job --task {task_file} add-finding --note '<evidence>' --source '{source}'
      pi-job --task {task_file} add-slice --kind fog|implement --key <key> ...
      pi-job --task {task_file} block-slice --key <closing> --reason '...' --gate <fix-key>
interrupt_park_steps:
  - grill
  - grill-plan
  - clarify-scope
record_channels:
  catalog: |-
    Task-record write channels (which command for which fact):

    decision (add-decision) — product, scope, architecture, or policy agreement that
      later sessions must honor without re-grilling. Must still be true if the PR
      never merged. Prefer one sentence + rationale. Not a journal.

    step_note (finish --note) — evidence that THIS step happened or failed:
      commands, e2e results, scan findings, "gap recorded", skip reasons.

    slice_note (finish --slice-only) — cross-step narrative for the slice (blocker story, handoff).
      Not add-decision.

    plan_file (*.plans/<slice-key>.md) — constraint-and-behaviour contract. Long prose lives here.

    plan_note (set-plan-note) — destination / high-level map. Not a progress log.

    pull_request (add-pr) — delivery lifecycle PR links and status.

    repo_work (set-worktree) — recorded filesystem worktree path for a slice's repo.

    finding (add-finding) — RCA / interrupt evidence in .plans/_findings.md.

    Per-step packets list only the channels relevant to that step.
    Run `pi-job channels --step KEY` for one step's blurbs.
  blurbs:
    decision: DECISION (add-decision) = product, scope, architecture, or policy agreement that later sessions must honor without re-grilling. Not a journal.
    step_note: STEP NOTE (finish --note) = evidence that THIS step happened or failed (commands, e2e, scan findings, skip reasons).
    slice_note: SLICE NOTE (finish --slice-only) = cross-step narrative for the slice (blocker story, handoff). Not add-decision.
    plan_file: PLAN FILE (*.plans/<slice-key>.md) = constraint-and-behaviour contract; long prose lives here.
    plan_note: PLAN NOTE (set-plan-note) = destination / high-level map. Not a progress log.
    pull_request: PR (add-pr) = delivery lifecycle PR links and status. Sync verify evidence stays in finish --note.
    repo_work: REPO (set-worktree) = recorded worktree path for this slice's repo work.
    finding: FINDING (add-finding) = RCA / interrupt evidence in .plans/_findings.md, not long YAML.
step_kinds:
  explore-context:
    key: explore-context
    title: Explore context
    owner: orchestrator
    record_channels: [step_note, slice_note]
    validators:
      - repos-or-explicitly-not-applicable
    guidance: Read the adjacent code/docs needed to act. Record known repos and adjacent context - or explicitly note none apply.
  clarify-scope:
    key: clarify-scope
    title: Clarify scope
    owner: orchestrator
    record_channels: [decision, step_note, slice_note]
    validators:
      - blocking-ambiguity-resolved
    skip_rule: skip when exploration answers the implementation-relevant questions
    guidance: Resolve blocking ambiguity with the user before planning. Skip only when exploration already answered the implementation-relevant questions.
  grill:
    key: grill
    title: Grill overall scope
    owner: orchestrator
    record_channels: [decision, step_note, slice_note]
    validators:
      - grill-done-or-user-declined
    skip_rule: only when user explicitly declines
    guidance: 'Interrogate overall task scope using the grill-me skill (skills/grill-me/SKILL.md). note records what was challenged and what changed. Loop: revise, grill again, until it survives - not a one-shot rubber stamp.'
  select-toolbelt:
    key: select-toolbelt
    title: Select planning aids from the toolbelt
    owner: orchestrator
    record_channels: [step_note, slice_note]
    validators:
      - toolbelt-selection-recorded
    guidance: From the aids whose suits includes a relevant slice kind (see `pi-job toolbelt`), select the subset that will help write the plan. Register each with `pi-job toolbelt add <key> --status planned` plus a one-line why. Do not produce the aid files yet - they are written during plan-slices and flipped to done when the file exists.
  plan-slices:
    key: plan-slices
    title: Plan slices
    owner: orchestrator
    record_channels: [step_note, slice_note, plan_note]
    validators:
      - at-least-one-slice
      - slices-repo-scoped-and-atomic
    guidance: Prefer one slice per repository. Make each slice atomic - self-contained end to end - ordered by dependency. Add implement slices with `pi-job add-slice --kind implement`. When producing a registered toolbelt aid, if the catalog entry has an `example`, follow that as the build instruction for the aid file.
  wayfinder:
    key: wayfinder
    title: Chart the fog
    owner: orchestrator
    record_channels: [decision, step_note, slice_note, plan_note]
    validators:
      - wayfinder-context-loaded
      - decisions-or-fog-slices-recorded
    skip_rule: skip when there is no fog to chart - the destination is already clear enough to plan slices directly
    guidance: >-
      Chart the foggy area named in this step's note with the wayfinder skill (installed separately),
      using this pi-job task file as the wayfinder issue tracker. First run
      `pi-job --task <this-file> wayfinder-context` to load the map: the destination, recorded
      decisions, and the current frontier/fog of research and fog slices. Take those as given - do not
      re-decide resolved areas. pi-job orchestrates, it does not execute, so spawn as many subagents as
      needed to reduce uncertainty (research the world, prototype to see, grill the user). Record
      scope/architecture resolutions with `add-decision`; record research evidence with `finish --note`
      on the wayfinder step or grow implement/research slices. Then create whatever slices the chart calls for with
      `pi-job add-slice` and the appropriate depends_on: fog slices for areas still too foggy or
      decidable only after other work is done, and implement/research/spike slices for work now clear
      enough to schedule. The pi-job skill's Wayfinder section holds the full map-to-task-file mapping.
  create-plan:
    key: create-plan
    title: Create plan
    owner: subagent
    record_channels: [step_note, plan_file]
    validators:
      - plan-recorded
      - create-plan-and-grill-plan-done-or-skip-reason-before-other-steps
    guidance: *plan_and_grill_guidance
  grill-plan:
    key: grill-plan
    title: Grill the plan file
    owner: orchestrator
    record_channels: [decision, step_note, plan_file]
    validators:
      - grill-done-or-user-declined
      - create-plan-and-grill-plan-done-or-skip-reason-before-other-steps
    guidance: *plan_and_grill_guidance
  edit-code:
    key: edit-code
    title: Edit code
    owner: subagent
    record_channels: [step_note, repo_work]
    validators:
      - coding-policy-recorded
      - worktree-used-when-repo-editing
    guidance: Make the change described by this slice's create-plan step. Use a worktree when editing a repo other than the current one.
  verify:
    key: verify
    title: Verify
    owner: orchestrator
    record_channels: [step_note]
    validators:
      - relevant-tests-or-gap-recorded
    guidance: Run the relevant tests/checks for what changed, or record the gap.
  e2e-evidence:
    key: e2e-evidence
    title: Provide e2e/acceptance evidence or record the gap
    owner: orchestrator
    record_channels: [step_note]
    validators:
      - evidence-or-gap-recorded
    skip_rule: skip when e2e/acceptance evidence is not needed for this slice (record why)
    guidance: |-
      After the PR has merged (or equivalent landing), capture e2e/acceptance evidence
      on the deployed or otherwise exercised path, or record an explicit gap/skip reason.
      Prefer ticket comments and finish --note over add-decision.
      This step is skippable when unit/integration coverage is enough or live e2e is blocked.
  ready-for-release:
    key: ready-for-release
    title: Mark the ticket Ready for Release
    owner: orchestrator
    record_channels: [step_note]
    validators:
      - ticket-ready-for-release-or-not-applicable
    skip_rule: skip when this slice has no Jira ticket, or the ticket is already Ready for Release / Done
    guidance: |-
      After wait-for-feedback (merge) and e2e-evidence (or an explicit e2e skip), transition
      the slice's Jira ticket to Ready for Release.
      Leave a short testing/landing note on the ticket when useful.
      Record the transition (or not-applicable/skip reason) in finish --note.
      Do not mark the slice done until this gate is finished or skipped with reason.
  vulnerability-scan:
    key: vulnerability-scan
    title: Run an independent vulnerability scan
    owner: orchestrator
    record_channels: [decision, step_note]
    requires_user_decision: true
    different_model_from_step: edit-code
    validators:
      - user-decision-recorded
      - scanner-model-differs-from-code-author-model
      - vulnerabilities-resolved-or-risk-accepted
    skip_rule: only when the user explicitly declines the scan for this implement slice
    guidance: |-
      Ask the user whether this implement slice requires a vulnerability scan.
      If declined, record an explicit user-declined skip.
      If accepted, dispatch a vulnerability-focused reviewer as a separate pass:
      - Fully qualified model ID must differ from the model recorded on edit-code
        (whether edit-code ran in the orchestrator or a subagent).
      - Prefer a higher-reasoning / higher-capability model than the code author
        (do not reuse a fast coding or low-cost edit model for the scan).
        Example pattern: if edit-code used a composer/fast ID, pick a reasoning-oriented
        ID from a different family or a stronger tier in the same provider.
      - Review the changed/generated code for vulnerabilities, insecure defaults,
        authz gaps, injection, secrets, and unsafe trust boundaries.
      - Record findings in finish --note; resolve them or explicitly accept remaining
        risk before sharing.
      Do not treat "different model" alone as enough - capability for review matters.
  share-with-team:
    key: share-with-team
    title: 'Share with team: ticket + PR for this slice''s repo'
    owner: orchestrator
    record_channels: [step_note, pull_request]
    validators:
      - pr-template-checked
      - share-with-team-template-used
    guidance: *pr_template_guidance
    artifact_gates:
      - key: ticket
        required: true
        when: this slice completes its repo change
        source: changed_repos
        output: one ticket for the slice's repo
      - key: pull_request
        required: true
        when: this slice completes its repo change
        source: changed_files
        output: one PR, body from the checked repo template or the fallback
  wait-for-feedback:
    key: wait-for-feedback
    title: 'Wait for team feedback: loop on PR review until merged'
    owner: orchestrator
    record_channels: [step_note, pull_request]
    validators:
      - feedback-window-recorded
    guidance: |-
      Not terminal until the PR merges or is explicitly abandoned.
      Re-check via `pi-job sync` (store-side) then live `gh pr view`.
      When the user reports a merge (or gh shows MERGED), record it before finish:
        pi-job --task TASK_FILE add-pr --slice SLICE_KEY --repo REPO --url URL --status merged
      Then finish --note with the merge evidence and advance.
  update-task-file:
    key: update-task-file
    title: Update this task file
    owner: orchestrator
    record_channels: [decision, step_note, slice_note, plan_note]
    validators:
      - task-file-current
    guidance: Keep the task record current via pi-job mutation commands only (add-slice, add-step, add-decision, set-plan-note, finish, advance; see pi-job --help). Do not edit the task store directly. Create explicit new slices for future work, issues worth revisiting, technical debt, or unresolved doubts discovered during execution; give each a bounded goal, appropriate kind, and dependencies instead of burying it in notes.
  investigate:
    key: investigate
    title: Investigate
    owner: orchestrator
    record_channels: [step_note, finding]
    validators:
      - evidence-backed-findings
    guidance: Gather evidence-backed findings for the research question.
  synthesize:
    key: synthesize
    title: Synthesize
    owner: orchestrator
    record_channels: [step_note, slice_note]
    validators:
      - open-questions-called-out
    guidance: Produce the answer or doc; call out open questions.
  collect-references:
    key: collect-references
    title: Collect references
    owner: orchestrator
    record_channels: [step_note, plan_file, pull_request]
    validators:
      - jira-ticket-or-explicit-no-ticket-exception
      - pr-links-optional-at-collect
    guidance: |-
      Record the Jira ticket to follow (required unless an explicit no-ticket exception is documented with reason).
      PR links are optional here; add or update them during wait-for-landing as they appear.
      PRs are observed, not authored - do not open PRs, comment, or engage.
      Stub the peer-capture Subject section in the sibling plan file
      <task-stem>.plans/<slice-key>.md: ticket key, owner, and any PR URLs known so far.
  wait-for-landing:
    key: wait-for-landing
    title: Wait for landing
    owner: orchestrator
    record_channels: [step_note, pull_request]
    validators:
      - landed-or-abandoned-with-reason
      - pr-links-updated-if-discovered
    skip_rule: skip when work is already abandoned before wait (record abandon reason; proceed to thin capture)
    guidance: |-
      Observe until the ticket reaches Done or the PR merges, or the work is explicitly abandoned.
      On abandon: skip this step with reason, then proceed to a thin review-capture (Subject, Outcome, Open questions, Follow-ups only).
      During wait, add PR links via pi-job add-pr as they are discovered; still no engagement (no comments, reviews, or code changes).
      Re-check via pi-job sync when helpful.
  review-capture:
    key: review-capture
    title: Review and capture understanding
    owner: orchestrator
    record_channels: [step_note, plan_file]
    validators:
      - peer-capture-outline-complete-or-thin-on-abandon
    guidance: |-
      Write durable peer-capture into the sibling plan file
      <task-stem>.plans/<slice-key>.md (same path convention as implement plans).
      Record only a pointer in the step note: Plan file: <task-stem>.plans/<slice-key>.md.
      Use this nine-section outline when the work landed:
      1. Subject - ticket, owner, PR links
      2. Outcome - landed | abandoned (with reason)
      3. Constraints
      4. Decisions
      5. Invariants
      6. Use cases
      7. Test cases
      8. Open questions
      9. Follow-ups - spawned slices or explicit none
      On abandon: sections 3-7 may be n/a; Subject, Outcome, Open questions, and Follow-ups are mandatory.
      Observe-only throughout - no code changes, PR comments, or Jira notes on the followed work.
  follow-up-gate:
    key: follow-up-gate
    title: Follow-up gate
    owner: orchestrator
    record_channels: [step_note, slice_note]
    validators:
      - follow-up-slices-spawned-or-explicit-none
    guidance: |-
      Decide bounded follow-up work surfaced by the capture.
      Spawn follow-up slices with pi-job add-slice (appropriate kind and dependencies) OR record explicit none with reason.
      Do not bury actionable follow-ups only in free-form notes.
  update-test-plan:
    key: update-test-plan
    title: Update the test plan
    owner: orchestrator
    record_channels: [step_note]
    validators:
      - test-plan-reconciled-or-not-applicable
    guidance: Reconcile the PRD/plan's test-case table against what actually shipped across all slices.
  update-docs:
    key: update-docs
    title: Update documentation
    owner: orchestrator
    record_channels: [step_note]
    validators:
      - docs-updated-or-not-applicable
    guidance: Update FACT_MAP / workflow docs / README that the shipped slices affect, or record not applicable.
  capture-metrics:
    key: capture-metrics
    title: Capture metrics to watch
    owner: orchestrator
    record_channels: [step_note]
    validators:
      - metrics-recorded-or-not-applicable
    guidance: Record which dashboards/alerts to watch post-ship, or that none apply.
  pi-job-feedback:
    key: pi-job-feedback
    title: Record pi-job feedback
    owner: orchestrator
    record_channels: [step_note]
    validators:
      - feedback-recorded
    guidance: |-
      Append any gotchas, friction points, or recommendations that would make the
      pi-job experience easier next time to ~/pi-job.feedback.yml (create if absent).
      Skip only when the session produced no actionable feedback.
slice_kinds:
  setup:
    key: setup
    title: Task setup
    description: Explore, clarify, grill scope, pick toolbelt, plan the implementation slices. Runs once, first.
    policies: {}
    step_template:
      - explore-context
      - clarify-scope
      - grill
      - wayfinder
      - select-toolbelt
      - plan-slices
      - pi-job-feedback
    required_steps:
      - explore-context
      - clarify-scope
      - grill
      - select-toolbelt
      - plan-slices
  implement:
    key: implement
    title: Implementation
    description: One atomic, repo-scoped change - planned, grilled, built, verified, shipped as it completes.
    policies:
      coding_execution:
        subagent_required: true
        lower_power_model_preferred: true
        orchestrator_reviews_subagent: true
        exceptions:
          - trivial-single-file-edit
          - user-explicitly-requests-orchestrator
    step_template:
      - create-plan
      - grill-plan
      - edit-code
      - verify
      - vulnerability-scan
      - share-with-team
      - update-task-file
      - wait-for-feedback
      - e2e-evidence
      - ready-for-release
      - pi-job-feedback
    required_steps:
      - create-plan
      - grill-plan
      - edit-code
      - verify
      - share-with-team
      - update-task-file
      - wait-for-feedback
  closing:
    key: closing
    title: Task closing
    description: Cross-slice bookkeeping once every implementation slice is done. Runs once, last.
    policies: {}
    step_template:
      - update-test-plan
      - update-docs
      - capture-metrics
      - update-task-file
      - pi-job-feedback
    required_steps:
      - update-test-plan
      - update-docs
      - capture-metrics
      - update-task-file
  research:
    key: research
    title: Research
    description: Investigation without code changes.
    policies:
      no_code_changes: true
    step_template:
      - explore-context
      - clarify-scope
      - investigate
      - synthesize
      - update-task-file
      - pi-job-feedback
  spike:
    key: spike
    title: Spike / prototype
    description: Time-boxed learning; output is evidence + a keep/change/discard call.
    policies:
      coding_execution:
        subagent_required: true
        lower_power_model_preferred: true
        orchestrator_reviews_subagent: true
        exceptions:
          - throwaway-local-prototype
    step_template:
      - clarify-scope
      - create-plan
      - grill-plan
      - edit-code
      - verify
      - update-task-file
      - pi-job-feedback
  fog:
    key: fog
    title: Fog / decision branch
    description: A foggy sub-area charted later, after its dependencies are done. Records decisions and spawns the slices needed to resolve it. No code changes of its own.
    policies:
      no_code_changes: true
    step_template:
      - clarify-scope
      - wayfinder
      - plan-slices
      - pi-job-feedback
  follow-work:
    key: follow-work
    title: Follow peer work
    description: Observe another person's Jira delivery item until it lands, capture durable understanding, then spawn or decline follow-ups.
    policies:
      no_code_changes: true
    step_template:
      - clarify-scope
      - collect-references
      - wait-for-landing
      - review-capture
      - follow-up-gate
      - update-task-file
      - pi-job-feedback
    required_steps:
      - clarify-scope
      - collect-references
      - wait-for-landing
      - review-capture
      - follow-up-gate
      - update-task-file
